[[cases]]
case_id = "protected-values"
source_type = "prompt"
content = """Validate record SYNTHETIC_RUN_001 at
https://synthetic.invalid/proof/run.
The artifact is synthetic/artifacts/fixed-run.json.
Preserve error code E_SYNTHETIC_PROTECTED exactly.
This synthetic context marker is repeated.
This synthetic context marker is repeated."""
tags = ["synthetic", "protected"]
protected_regions = [
  { kind = "url", value = "https://synthetic.invalid/proof/run" },
  { kind = "path", value = "synthetic/artifacts/fixed-run.json" },
  { kind = "identifier", value = "SYNTHETIC_RUN_001" },
  { kind = "exact_error", value = "E_SYNTHETIC_PROTECTED" },
]

[cases.policy]
enabled = true
profile = "balanced"
allow_lossy = false
require_validation = true
fallback_on_validation_failure = true

[[cases]]
case_id = "code-heavy"
source_type = "structured_data"
content = """def verify_artifact(path: str, expected_sha256: str) -> bool:
    with open(path, "rb") as artifact:
        actual_sha256 = sha256(artifact.read()).hexdigest()
    return actual_sha256 == expected_sha256

ARTIFACT_PATH = "synthetic/artifacts/fixed-run.json"
ARTIFACT_MARKER = "sha256:synthetic-proof"""
tags = ["synthetic", "code-heavy"]

[cases.policy]
enabled = true
profile = "balanced"
allow_lossy = false
require_validation = true
fallback_on_validation_failure = true

[[cases]]
case_id = "high-risk-protected"
source_type = "prompt"
content = "Review SYNTHETIC_SECURITY_WARNING for SYNTHETIC_FINDING_007 without altering exact identifiers."
