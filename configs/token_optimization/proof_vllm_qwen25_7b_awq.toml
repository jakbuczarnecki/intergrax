schema_version = "token-optimization-proof.v1"
proof_id = "token-optimization-qwen25-7b-awq-qualification"
run_mode = "live_adapter"

[adapter]
adapter_id = "local-vllm"
provider = "vllm"
type = "openai_compatible"
model = "Qwen/Qwen2.5-7B-Instruct-AWQ"
base_url = "http://127.0.0.1:8100/v1"
timeout_seconds = 120.0
max_output_tokens = 256
temperature = 0.0

[router]
enabled = true
configuration_id = "exact_only"
minimum_confidence = 0.6
allow_structured_output_fallback = true
require_review_for_protected_lossy_content = true

[pipeline]
mode = "default"
layer_ids = []
failure_policy = "continue"

[output]
directory = ".artifacts/token_optimization/qwen25-7b"
fail_if_exists = true

[[cases]]
case_id = "short-clean"
source_type = "prompt"
content = "Return current deployment status."
tags = ["synthetic", "short-clean"]

[cases.policy]
enabled = true
profile = "balanced"
allow_lossy = false
require_validation = true
fallback_on_validation_failure = true

[[cases]]
case_id = "exact-duplicates"
source_type = "prompt"
content = "line-a\nline-a\nline-b"
tags = ["synthetic", "exact-duplicates"]

[cases.policy]
