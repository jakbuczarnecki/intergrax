name: Documentation
description: Report a gap, error, or improvement in docs/ canon
title: "[Docs]: "
labels: ["documentation", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Documentation lives in `docs/` — one source of truth per topic.
        Index: [README — Documentation](https://github.com/jakbuczarnecki/intergrax/blob/main/README.md#documentation-index)

  - type: dropdown
    id: document
    attributes:
      label: Affected document
      options:
        - README.md (navigation / status)
        - docs/guides/INTERGRAX_DEVELOPMENT_STRATEGY.md
        - docs/intergrax_runtime_architecture.md
        - docs/intergrax_runtime_architecture.md
        - docs/guides/AGENT_CREATION_GUIDE.md
        - docs/architecture/INTEGRATIONS.md
        - docs/architecture/TOOLS.md
        - docs/architecture/SKILLS.md
        - docs/architecture/LLM_ADAPTERS.md
        - docs/architecture/MODALITY.md
        - docs/guides/HARNESS_ENVIRONMENT.md
        - docs/guides/EXTENSION_AUTHOR_GUIDE.md
        - docs/guides/IDEAL_HARNESS_AI_ARCHITECTURE.md
        - docs/architecture/ADAPTIVE_HARNESS_INTELLIGENCE.md
        - README.md
        - AGENTS.md / llms.txt
        - Other
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Issue type
      options:
        - Factual error
        - Outdated status / phase info
        - Missing section
        - Unclear explanation
        - Broken link
        - Duplicate / conflicting with another doc
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong or missing?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: Proposed correction or new content (keep in the correct canon file)
    validations:
      required: false

  - type: checkboxes
    id: canon
    attributes:
      label: Canon compliance
      options:
        - label: This change should update an existing doc, not create a parallel guide
          required: true
