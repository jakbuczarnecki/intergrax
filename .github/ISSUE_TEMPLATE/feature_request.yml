name: Feature request
description: Propose a new capability for the Intergrax Harness AI platform
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Propose features aligned with the [Harness AI strategic goal](https://github.com/jakbuczarnecki/intergrax/blob/main/docs/guides/INTERGRAX_DEVELOPMENT_STRATEGY.md).
        Check [implementation plan](https://github.com/jakbuczarnecki/intergrax/blob/main/docs/intergrax_runtime_architecture.md) for existing phases.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve? Who benefits?
      placeholder: Teams building agents need X because Y...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should Intergrax address this?
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: Target tier
      options:
        - Tier-0 Platform (integrations, tools, skills, LLM, RAG)
        - Tier-1 Nexus runtime
        - Tier-2 Agent
        - Tier-3 Application
        - Documentation / DX
        - CI / tooling
    validations:
      required: true

  - type: textarea
    id: harness_alignment
    attributes:
      label: Harness AI alignment
      description: How does this move Intergrax toward production-grade Harness AI?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing Tier-0 modules, workarounds, or patterns already in the codebase
      placeholder: Could this be solved by composing existing tools/skills instead of new platform code?

  - type: dropdown
    id: phase
    attributes:
      label: Related implementation phase (if known)
      options:
        - §6.1 maintenance
        - Phase W-ADAPT (Adaptive Harness Intelligence)
        - Phase K (business agents — end of plan)
        - New phase needed
        - Not sure

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked that no existing Tier-0 module already provides this capability
          required: false
        - label: I am willing to follow the CONTRIBUTING.md work cycle (docs → implement → verify)
          required: false
