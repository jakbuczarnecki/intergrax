name: Bug report
description: Report a specific, reproducible defect
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for a concrete, reproducible bug. Do not include secrets or credentials.
        For security vulnerabilities, see [SECURITY.md](https://github.com/jakbuczarnecki/intergrax/blob/main/SECURITY.md) — do not open a public issue.
        Intergrax is source-available/proprietary; see [docs/project/community/COLLABORATION.md](https://github.com/jakbuczarnecki/intergrax/blob/main/COLLABORATION.md).

  - type: dropdown
    id: component
    attributes:
      label: Component / area
      options:
        - harness/runtime
        - Nexus/orchestration
        - agents
        - applications
        - tools/skills/integrations
        - RAG/memory
        - CLI/proof path
        - documentation
        - other
    validations:
      required: true

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-line description of the defect
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. ...
        2. ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, uv version if known, branch/commit (no secrets)
      placeholder: |
        OS:
        Python:
        uv:
        Branch/commit:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste relevant error messages or trace snippets (redact secrets)
      render: shell

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: License and collaboration acknowledgement
      options:
        - label: I understand that Intergrax is source-available/proprietary and that reporting an issue does not grant production, redistribution, derivative-work, or commercial-use rights.
          required: true
