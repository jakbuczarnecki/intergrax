# PR guard: RAG Tier-0 changes must pass golden retrieval + core unit tests.

name: RAG guard

on:
  pull_request:
    paths:
      - "intergrax/rag/**"
      - "intergrax/tools/providers/rag/**"
      - "intergrax/integrations/providers/vector_store/**"
      - "intergrax/integrations/providers/embedding_provider/**"
      - "intergrax/integrations/providers/document_parser/**"
      - "intergrax/integrations/providers/rerank_provider/**"
      - "intergrax/integrations/providers/graph_store/**"
      - "tests/unit/rag/**"
      - "tests/fixtures/rag_golden/**"

env:
  UV_LINK_MODE: copy
  UV_PYTHON_DOWNLOADS: never

permissions:
  contents: read

jobs:
  rag-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv sync --extra dev-ci --extra dev-ci-rag --frozen

      - name: Environment conformance (CI profile)
        run: uv run --frozen python scripts/maintenance/check_environment_conformance.py --profile ci

      - name: RAG maturity label gate (RAG-MAINT-01)
        run: uv run --frozen python scripts/maintenance/check_rag_maturity_labels.py

      - name: RAG unit + golden regression + load/soak SLO
        run: >-
          uv run --frozen pytest
          tests/unit/rag/
          tests/unit/tools/providers/rag/
          -m gate
          -q --tb=line
