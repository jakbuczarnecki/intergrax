# PR guard: RAG Tier-0 changes must pass golden retrieval + core unit tests.

name: RAG guard

on:
  pull_request:
    paths:
      - "intergrax/rag/**"
      - "intergrax/tools/providers/rag/**"
      - "intergrax/integrations/providers/vector_store/**"
      - "tests/unit/rag/**"
      - "tests/fixtures/rag_golden/**"

env:
  UV_LINK_MODE: copy
  UV_PYTHON_DOWNLOADS: never

jobs:
  rag-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv sync --extra dev-ci --extra dev-ci-rag --frozen

      - name: Environment conformance (CI profile)
        run: uv run --frozen python scripts/maintenance/check_environment_conformance.py --profile ci

      - name: RAG maturity label gate (RAG-MAINT-01)
        run: uv run --frozen python scripts/maintenance/check_rag_maturity_labels.py

      - name: RAG unit + golden regression + load/soak SLO
        run: >-
          uv run --frozen pytest
          tests/unit/rag/
          tests/unit/tools/providers/rag/
          -m gate
          -q --tb=line
