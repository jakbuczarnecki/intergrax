# Optional live LLM smoke tests (secrets required). Not run on PR.
# Scheduled weekly (Monday 04:00 UTC) + manual dispatch.

name: LLM network smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

env:
  UV_LINK_MODE: copy
  UV_PYTHON_DOWNLOADS: never

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev-ci --extra llm-all --frozen

      - name: Live LLM smoke (network)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          uv run pytest
          tests/unit/llm_adapters/test_network_smoke.py
          -m network -q --tb=line
