name: Enterprise audit nightly (ENT-AUDIT-X)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Audit mode
        required: true
        default: FULL
        type: choice
        options:
          - FULL
          - FREEZE

permissions:
  contents: read

jobs:
  ent-audit-nightly:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          python-version: "3.12"
      - name: Sync dev-ci qualification dependencies
        run: uv sync --frozen --extra dev-ci
      - name: Qualification suite
        run: uv run pytest tests/qualification/ent_audit_x -q
      - name: Enterprise audit run (${{ github.event.inputs.mode || 'FULL' }} real)
        env:
          MODE: ${{ github.event.inputs.mode || 'FULL' }}
        run: |
          OUT=".tmp/proof/ent-audit-x/nightly-${MODE}"
          uv run python scripts/enterprise_audit/run_enterprise_audit.py \
            --mode "$MODE" \
            --output-dir "$OUT"
          # Operator-only: FREEZE bootstrap / evidence bundle (C007) — not on scheduled nightly.
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ent-audit-nightly-${{ github.event.inputs.mode || 'FULL' }}
          path: .tmp/proof/ent-audit-x/
