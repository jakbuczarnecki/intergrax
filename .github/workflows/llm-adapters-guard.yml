# PR guard: any change under intergrax/llm_adapters/ must pass builtin conformance.

name: LLM adapters guard

on:
  pull_request:
    paths:
      - "intergrax/llm_adapters/**"
      - "tests/unit/llm_adapters/**"

env:
  UV_LINK_MODE: copy
  UV_PYTHON_DOWNLOADS: never

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv sync --extra dev-ci --frozen

      - name: Builtin provider conformance (mocked)
        run: >-
          uv run pytest
          tests/unit/llm_adapters/test_builtin_conformance.py
          tests/unit/llm_adapters/test_resilience.py
          tests/unit/llm_adapters/test_metrics_exposition.py
          -m gate -q --tb=line
