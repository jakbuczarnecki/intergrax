# PR guard: any change under intergrax/llm_adapters/ must pass builtin conformance.

name: LLM adapters guard

on:
  pull_request:
    paths:
      - "intergrax/llm_adapters/**"
      - "tests/unit/llm_adapters/**"

env:
  UV_LINK_MODE: copy
  UV_PYTHON_DOWNLOADS: never

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv sync --extra dev-ci --extra llm-ollama --frozen

      - name: Environment conformance (CI profile)
        run: uv run --frozen python scripts/maintenance/check_environment_conformance.py --profile ci

      - name: Builtin provider conformance (mocked)
        run: >-
          uv run --frozen pytest
          tests/unit/llm_adapters/test_builtin_conformance.py
          tests/unit/llm_adapters/test_resilience.py
          tests/unit/llm_adapters/test_metrics_exposition.py
          -m gate -q --tb=line
