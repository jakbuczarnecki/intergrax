# Sync GitHub repository description, homepage, and topics from the canonical manifest.
#
# Source of truth: .github/repo-management/repository-metadata.json
# Manual run: Actions → "Sync repository metadata" → Run workflow
# Local run:  .github/repo-management/README.md

name: Sync repository metadata

on:
  push:
    branches: [main]
    paths:
      - ".github/repo-management/**"
      - ".github/workflows/sync-repository-metadata.yml"
  workflow_dispatch:

permissions:
  administration: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync description, homepage, and topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/repo-management/sync_github_repository_metadata.py --apply
