# Sync GitHub repository description, homepage, and topics from the canonical manifest.
#
# Source of truth: .github/repo-management/repository-metadata.json
# Manual run: Actions → "Sync repository metadata" → Run workflow
# Local run:  .github/repo-management/README.md

name: Sync repository metadata

on:
  push:
    branches: [main]
    paths:
      - ".github/repo-management/**"
      - ".github/workflows/sync-repository-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev-ci --frozen

      - name: Require repository metadata token
        env:
          REPO_METADATA_TOKEN: ${{ secrets.REPO_METADATA_TOKEN }}
        run: |
          if [ -z "$REPO_METADATA_TOKEN" ]; then
            echo "::error::REPO_METADATA_TOKEN secret is missing. Add a fine-grained PAT with Administration: Read and write (see .github/repo-management/README.md)."
            exit 1
          fi

      - name: Sync description, homepage, and topics
        env:
          GH_TOKEN: ${{ secrets.REPO_METADATA_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run --frozen python .github/repo-management/sync_github_repository_metadata.py --apply
