# Operational L3 evidence on release tags (Phase H-APP.6.2)
name: Harness release evidence

on:
  push:
    tags:
      - "v*"

jobs:
  ops-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev-ci --frozen
      - name: Environment conformance (CI profile)
        run: uv run --frozen python scripts/maintenance/check_environment_conformance.py --profile ci
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.2
      - name: Install Semgrep
        run: uv pip install semgrep
      - name: V-SEC STABLE promote gate (CLI scan)
        env:
          INTERGRAX_SECURITY_PROMOTE_RUN_SCAN: "true"
          INTERGRAX_SECURITY_PROMOTE_SCAN_BACKEND: "cli"
        run: uv run --frozen python scripts/gates/check_harness_security_promote_gate.py
      - name: Enforce W-OPS / H-APP operational evidence
        run: uv run --frozen python scripts/release/phase_w_ops_evidence.py --enforce
      - name: Enforce W-ADAPT runtime L4 closeout
        run: uv run --frozen python scripts/release/phase_w_adapt_closeout_gate.py --enforce-l4-runtime
