# © Artur Czarnecki. All rights reserved.
# Intergrax framework – proprietary and confidential.
#
# CI profiles:
#   pull_request, push (main) - ci_smoke unit tests + Platform Plugin gates (Linux + Windows wheel E2E)
#   schedule (nightly 03:00 UTC), workflow_dispatch (full) - full gate + governance + closeout
#   workflow_dispatch (smoke) - same as PR (debug)
#   workflow_dispatch (diagnostics_full) - one exact-SHA full tests/unit/runtime/diagnostics qualification
#
# Feature-branch pushes do not trigger CI (avoids duplicate runs when a PR is open).
# Full regression: `uv run pytest tests/unit -m "gate and not no_ci"` locally or nightly CI.
# Local full suite: uv sync --extra dev --extra dev-unit-cert

name: Regression gate

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "smoke (PR default), full (nightly parity), or diagnostics_full (exact-SHA DIAG qualification)"
        type: choice
        options:
          - smoke
          - full
          - diagnostics_full
        default: smoke
      qualification_sha:
        description: "40-char Git commit SHA (required when profile is diagnostics_full)"
        type: string
        required: false

concurrency:
  group: >-
    ${{ github.event.inputs.profile == 'diagnostics_full'
        && format('diagnostics-full-qualification-{0}', github.event.inputs.qualification_sha)
        || format('regression-gate-{0}-{1}-{2}', github.event_name, github.ref, github.event.inputs.profile || 'smoke') }}
  cancel-in-progress: ${{ github.event.inputs.profile != 'diagnostics_full' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_LINK_MODE: copy
  UV_PYTHON_DOWNLOADS: never

jobs:
  ci-smoke:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.profile == 'smoke'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal)
        run: uv sync --extra dev-ci --frozen

      - name: Environment conformance (CI profile)
        run: uv run --frozen python scripts/maintenance/check_environment_conformance.py --profile ci

      - name: Workspace lock consistency
        run: uv lock --check

      - name: Application dependency projects resolve
        run: |
          # Dependency-graph isolation (deterministic). Do not use shared-root
          # `uv pip show` as isolation proof - uv reuses workspace `.venv`.
          uv export --frozen --no-dev --project applications/lab_application --no-emit-workspace | tee /tmp/lab-export.txt
          uv export --frozen --no-dev --project applications/local_workspace_application --no-emit-workspace | tee /tmp/lkw-export.txt
          grep -qi 'Intergrax-ai\|intergrax-ai' /tmp/lab-export.txt
          grep -qi 'Intergrax-ai\|intergrax-ai' /tmp/lkw-export.txt
          grep -qi 'slack-sdk' /tmp/lkw-export.txt
          ! grep -qi 'slack-sdk' /tmp/lab-export.txt

      - name: CI smoke unit tests
        run: uv run --frozen python scripts/ci/run_ci_smoke_pytest.py

      - name: Durable diagnostics deterministic gate
        run: >-
          uv run --frozen pytest
          tests/unit/applications/architecture/test_harden_1b_durable_problem_store_composition.py
          tests/unit/runtime/diagnostics/test_harden_1d_problem_persistence_write_failure.py
          tests/integration/applications/architecture/test_harden_1d_durable_problem_store_failure_semantics.py
          tests/integration/runtime/test_harden_4b_tenant_diagnostic_isolation_e2e.py
          tests/integration/runtime/test_harden_4c_clean_diagnostic_host_e2e.py
          tests/integration/runtime/test_harden_4d_problem_lifecycle_host_e2e.py
          tests/integration/runtime/test_harden_4e_diagnostic_read_truth_e2e.py
          -q --tb=line

      - name: Diagnostic concurrency deterministic gate
        run: >-
          uv run --frozen pytest
          tests/unit/runtime/diagnostics/test_harden_2a_problem_persistence_concurrency.py
          tests/unit/runtime/diagnostics/test_harden_2b_problem_lifecycle_occ_retry.py
          -q --tb=line

      - name: Diagnostics observability hardening gate (HARDEN-3C-3E)
        run: >-
          uv run --frozen pytest
          tests/unit/runtime/observability/test_harden_3c_export_failure_semantics.py
          tests/unit/runtime/observability/test_harden_3d_exporter_health.py
          tests/unit/contracts/test_instrumentation_span_attributes.py
          tests/unit/rag/tracking/test_rag_otel_spans.py
          tests/unit/context/tracking/test_context_otel_spans.py
          tests/unit/runtime/architecture/test_harden_3e_otel_import_gate.py
          tests/unit/runtime/architecture/test_harden_3f_qualification_matrix.py
          -q --tb=line

      - name: Platform Plugin program gate (Linux regression)
        run: >-
          uv run --frozen pytest
          tests/contract/core/plugins/test_platform_plugin_contract.py
          tests/integration/platform_plugins/test_plugin8_dual_mode_tool_e2e.py
          tests/unit/scaffold/test_scaffold_local_extension_qualification.py
          tests/unit/core/plugins/
          tests/unit/runtime/security/test_defense_plugin_admission.py
          tests/unit/applications/test_security_plugin_adoption_wiring.py
          tests/unit/runtime/policy/rules/test_policy_plugin_loader_isolation.py
          tests/unit/applications/test_policy_wiring.py
          -q --tb=line

      - name: Tier boundary audits (instant)
        env:
          INTERGRAX_CI_TEST_MARKER: ci_smoke
        run: >-
          uv run --frozen python scripts/maintenance/check_harness_no_getattr.py
          && uv run --frozen python scripts/maintenance/check_agents_no_tier3_imports.py
          && uv run --frozen python scripts/ci/check_ci_gate_test_purity.py
          && uv run --frozen python scripts/maintenance/check_dependency_ownership.py
          && uv run --frozen python scripts/maintenance/check_knowledge_document_conformance.py

  platform-plugin-windows-e2e:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.profile != 'diagnostics_full'
      )
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal)
        run: uv sync --extra dev-ci --frozen

      - name: Platform Plugin Windows wheel E2E
        run: >-
          uv run --frozen pytest
          tests/integration/platform_plugins/test_plugin8_dual_mode_tool_e2e.py
          tests/contract/core/plugins/test_platform_plugin_contract.py
          -q --tb=line

  gate-tests:
    if: >-
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.profile == 'full'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal + unit cert)
        run: uv sync --extra dev-ci --extra dev-unit-cert --frozen

      - name: Environment conformance (CI profile)
        run: uv run --frozen python scripts/maintenance/check_environment_conformance.py --profile ci

      - name: Full unit regression gate
        run: uv run --frozen pytest tests/unit -m "gate and not no_ci" -n auto -q --tb=line

      - name: Durable diagnostics deterministic gate
        run: >-
          uv run --frozen pytest
          tests/unit/applications/architecture/test_harden_1b_durable_problem_store_composition.py
          tests/unit/runtime/diagnostics/test_harden_1d_problem_persistence_write_failure.py
          tests/integration/applications/architecture/test_harden_1d_durable_problem_store_failure_semantics.py
          tests/integration/runtime/test_harden_4b_tenant_diagnostic_isolation_e2e.py
          tests/integration/runtime/test_harden_4c_clean_diagnostic_host_e2e.py
          tests/integration/runtime/test_harden_4d_problem_lifecycle_host_e2e.py
          tests/integration/runtime/test_harden_4e_diagnostic_read_truth_e2e.py
          -q --tb=line

      - name: Diagnostic concurrency deterministic gate
        run: >-
          uv run --frozen pytest
          tests/unit/runtime/diagnostics/test_harden_2a_problem_persistence_concurrency.py
          tests/unit/runtime/diagnostics/test_harden_2b_problem_lifecycle_occ_retry.py
          -q --tb=line

      - name: Diagnostics observability hardening gate (HARDEN-3C-3E)
        run: >-
          uv run --frozen pytest
          tests/unit/runtime/observability/test_harden_3c_export_failure_semantics.py
          tests/unit/runtime/observability/test_harden_3d_exporter_health.py
          tests/unit/contracts/test_instrumentation_span_attributes.py
          tests/unit/rag/tracking/test_rag_otel_spans.py
          tests/unit/context/tracking/test_context_otel_spans.py
          tests/unit/runtime/architecture/test_harden_3e_otel_import_gate.py
          tests/unit/runtime/architecture/test_harden_3f_qualification_matrix.py
          -q --tb=line

  gate-governance-tier:
    if: >-
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.profile == 'full'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal)
        run: uv sync --extra dev-ci --frozen

      - name: Environment conformance (CI profile)
        run: uv run --frozen python scripts/maintenance/check_environment_conformance.py --profile ci

      - name: Tier boundary and registry audits
        env:
          INTERGRAX_CI_TEST_MARKER: "gate and not no_ci"
        run: >-
          uv run --frozen python scripts/maintenance/check_agents_vendor_imports.py
          && uv run --frozen python scripts/maintenance/check_capability_routing.py
          && uv run --frozen python scripts/maintenance/check_agent_step_security.py
          && uv run --frozen python scripts/maintenance/check_agent_threat_model.py
          && uv run --frozen python scripts/gates/check_agent_acp_close_ci.py
          && uv run --frozen python scripts/maintenance/check_contract_schema_versions.py
          && uv run --frozen python scripts/gates/check_acp_ci_conformance_matrix.py --scripts-only
          && uv run --frozen python scripts/maintenance/check_agent_typed_state.py
          && uv run --frozen python scripts/maintenance/check_production_chat_agent_imports.py
          && uv run --frozen python scripts/maintenance/check_integration_vendor_imports.py
          && uv run --frozen python scripts/maintenance/check_harness_no_getattr.py
          && uv run --frozen python scripts/ci/check_ci_gate_test_purity.py
          && uv run --frozen python scripts/gates/check_application_production_gates.py
          && uv run --frozen python scripts/maintenance/check_legacy_modules_removed.py
          && uv run --frozen python scripts/maintenance/check_agent_skill_resolution.py
          && uv run --frozen python scripts/maintenance/check_harness_registry_resolution.py
          && uv run --frozen python scripts/maintenance/check_agent_registry_bypass.py
          && uv run --frozen python scripts/maintenance/check_langgraph_not_required.py
          && uv run --frozen python scripts/maintenance/check_knowledge_document_conformance.py
          && uv run --frozen python scripts/maintenance/check_agents_no_tier3_imports.py
          && uv run --frozen python scripts/docs/check_docs_domain_pairs.py
          && uv run --frozen python scripts/maintenance/check_scaffold_harness_alignment.py
          && uv run --frozen python scripts/maintenance/check_plugin_catalog.py
          && uv run --frozen python scripts/maintenance/check_legacy_tool_plan_booleans.py

  gate-governance-wiring:
    if: >-
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.profile == 'full'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal)
        run: uv sync --extra dev-ci --frozen

      - name: Environment conformance (CI profile)
        run: uv run --frozen python scripts/maintenance/check_environment_conformance.py --profile ci

      - name: Harness wiring and observability audits
        run: >-
          uv run --frozen python scripts/maintenance/check_harness_capability_graph_wiring.py
          && uv run --frozen python scripts/maintenance/check_harness_observability_wiring.py
          && uv run --frozen python scripts/maintenance/check_observability_gates.py
          && uv run --frozen python scripts/maintenance/check_harness_reliability_wiring.py
          && uv run --frozen python scripts/maintenance/check_harness_security_wiring.py
          && uv run --frozen python scripts/maintenance/check_harness_guardrail_wiring.py
          && uv run --frozen python scripts/gates/check_harness_security_promote_gate.py
          && uv run --frozen python scripts/maintenance/check_harness_security_defense_plugins.py
          && uv run --frozen python scripts/maintenance/check_harness_encryption_policy.py
          && uv run --frozen python scripts/maintenance/check_harness_security_spine_signals.py
          && uv run --frozen python scripts/maintenance/check_harness_cost_wiring.py
          && uv run --frozen python scripts/maintenance/check_harness_evaluation_wiring.py
          && uv run --frozen intergrax doctor --ci

  gate-closeout:
    needs:
      - gate-tests
      - gate-governance-tier
      - gate-governance-wiring
    if: >-
      (
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.profile == 'full'
        )
      ) &&
      needs.gate-tests.result == 'success' &&
      needs.gate-governance-tier.result == 'success' &&
      needs.gate-governance-wiring.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal)
        run: uv sync --extra dev-ci --frozen

      - name: Environment conformance (CI profile)
        run: uv run --frozen python scripts/maintenance/check_environment_conformance.py --profile ci

      - name: Phase V architecture closeout gate
        run: uv run --frozen python scripts/release/phase_v_closeout_gate.py --enforce --enforce-l4

      - name: Phase W-ADAPT runtime L4 closeout gate
        run: uv run --frozen python scripts/release/phase_w_adapt_closeout_gate.py --enforce-l4-runtime

      - name: Phase W-OPS operational evidence (nightly / full dispatch)
        run: uv run --frozen python scripts/release/phase_w_ops_evidence.py

      - name: RAG load/soak nightly report (RAG-MAINT-02)
        run: uv run --frozen python scripts/release/rag_load_soak_report.py

      - name: Export harness spec schemas
        run: uv run --frozen python scripts/release/export_harness_spec_schemas.py

      - name: Export capability catalog feed
        run: uv run --frozen python scripts/release/export_capability_catalog_feed.py

  diag-final-external-proof:
    if: >-
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.profile == 'full'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      INTERGRAX_EXTERNAL_OTLP_PROOF_REQUIRED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal)
        run: uv sync --extra dev-ci --frozen

      - name: HARDEN-3F external canonical OTLP proof
        run: >-
          mkdir -p build
          && uv run --frozen pytest
          tests/integration/runtime/test_diag_final_external_otel_e2e.py
          -m external_proof
          --junitxml=build/harden-3f-external-otlp-proof.xml
          -q --tb=short

      - name: Assert HARDEN-3F external OTLP proof executed (no skip)
        run: >-
          uv run --frozen python -c "import sys, xml.etree.ElementTree as ET;
          root = ET.parse('build/harden-3f-external-otlp-proof.xml').getroot();
          skipped = sum(int(ts.get('skipped', 0)) for ts in root.findall('testsuite'));
          sys.exit(f'HARDEN-3F external OTLP proof skipped ({skipped}) - infrastructure/proof failure' if skipped else 0)"

  durable-diagnostics-external-proof:
    if: >-
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.profile == 'full'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    env:
      INTERGRAX_MONGODB_URI: mongodb://localhost:27017
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/agents:${{ github.workspace }}/applications

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal + MongoDB provider)
        run: uv sync --extra dev-ci --extra integrations-mongodb --frozen

      - name: Durable diagnostics backend readiness
        run: >-
          uv run --frozen python
          tests/integration/applications/architecture/harden_1c_restart_proof_worker.py
          probe

      - name: Durable diagnostics external restart proof
        run: >-
          mkdir -p build
          && uv run --frozen pytest
          tests/integration/applications/architecture/test_harden_1c_durable_problem_restart_proof.py
          --junitxml=build/harden-1c-external-proof.xml
          -q --tb=short

      - name: Assert HARDEN-1C proof executed (no skip)
        run: >-
          uv run --frozen python -c "import sys, xml.etree.ElementTree as ET;
          root = ET.parse('build/harden-1c-external-proof.xml').getroot();
          skipped = sum(int(ts.get('skipped', 0)) for ts in root.findall('testsuite'));
          sys.exit(f'HARDEN-1C skipped ({skipped}) - infrastructure/proof failure' if skipped else 0)"

      - name: Diagnostic concurrency external proof
        run: >-
          uv run --frozen pytest
          tests/integration/applications/architecture/test_harden_2c_durable_problem_lifecycle_concurrency_proof.py
          --junitxml=build/harden-2c-external-proof.xml
          -q --tb=short

      - name: Assert HARDEN-2C proof executed (no skip)
        run: >-
          uv run --frozen python -c "import sys, xml.etree.ElementTree as ET;
          root = ET.parse('build/harden-2c-external-proof.xml').getroot();
          skipped = sum(int(ts.get('skipped', 0)) for ts in root.findall('testsuite'));
          sys.exit(f'HARDEN-2C skipped ({skipped}) - infrastructure/proof failure' if skipped else 0)"

      - name: HARDEN-4F Mongo Problem Store failure external proof
        run: >-
          uv run --frozen pytest
          tests/integration/applications/architecture/test_harden_4f_mongo_problem_store_failure_e2e.py
          --junitxml=build/harden-4f-external-proof.xml
          -q --tb=short

      - name: Assert HARDEN-4F proof executed (no skip)
        run: >-
          uv run --frozen python -c "import sys, xml.etree.ElementTree as ET;
          root = ET.parse('build/harden-4f-external-proof.xml').getroot();
          skipped = sum(int(ts.get('skipped', 0)) for ts in root.findall('testsuite'));
          sys.exit(f'HARDEN-4F skipped ({skipped}) - infrastructure/proof failure' if skipped else 0)"

  diagnostics-full-qualification:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.profile == 'diagnostics_full'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      QUALIFICATION_SHA: ${{ github.event.inputs.qualification_sha }}

    steps:
      - name: Validate qualification SHA (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QUALIFICATION_SHA}" ]; then
            echo "qualification_sha is required for profile diagnostics_full"
            exit 1
          fi
          if ! [[ "${QUALIFICATION_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "qualification_sha must be exactly 40 hexadecimal characters"
            exit 1
          fi

      - name: Checkout exact qualification SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.qualification_sha }}
          fetch-depth: 0

      - name: Verify commit exists and HEAD matches qualification SHA
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${QUALIFICATION_SHA}^{commit}"
          EXPECTED_SHA="$(echo "${QUALIFICATION_SHA}" | tr '[:upper:]' '[:lower:]')"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "FAIL QUALIFICATION BEFORE PYTEST: HEAD (${ACTUAL_SHA}) != qualification_sha (${EXPECTED_SHA})"
            exit 1
          fi

      - name: Verify R0A/R0B ancestry on qualification SHA
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 613336125b9975074323f83e63a8fd10e49b99db HEAD
          git merge-base --is-ancestor 50a2e99fe266ac4430fb527226847d7339ef0a8f HEAD

      - name: Verify durable qualification workflow present at SHA
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'diagnostics-full-qualification:' .github/workflows/unit-tests.yml
          grep -q 'diagnostics_full' .github/workflows/unit-tests.yml

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal + unit cert)
        run: uv sync --extra dev-ci --extra dev-unit-cert --frozen

      - name: Environment conformance (CI profile)
        run: uv run --frozen python scripts/maintenance/check_environment_conformance.py --profile ci

      - name: Full diagnostics qualification (single pytest invocation)
        id: diagnostics_full_pytest
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build/qualification
          START_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          START_EPOCH="$(date -u +%s)"
          PYTEST_CMD=".venv/bin/python -m pytest tests/unit/runtime/diagnostics -q --durations=40 --junitxml=build/qualification/diagnostics-full.xml"
          set -o pipefail
          ${PYTEST_CMD} 2>&1 | tee build/qualification/full-diag.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          END_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          END_EPOCH="$(date -u +%s)"
          WALL_SEC=$((END_EPOCH - START_EPOCH))
          ACTUAL_SHA="$(git rev-parse HEAD)"
          {
            echo "qualification_sha=${QUALIFICATION_SHA}"
            echo "actual_head_sha=${ACTUAL_SHA}"
            echo "github_run_id=${{ github.run_id }}"
            echo "github_run_attempt=${{ github.run_attempt }}"
            echo "runner_os=${RUNNER_OS}"
            echo "python_version=$(.venv/bin/python -V 2>&1)"
            echo "start_timestamp=${START_TS}"
            echo "end_timestamp=${END_TS}"
            echo "wall_clock_seconds=${WALL_SEC}"
            echo "pytest_exit_code=${PYTEST_EXIT}"
            echo "command=${PYTEST_CMD}"
          } > build/qualification/meta.txt
          echo "${PYTEST_EXIT}" > build/qualification/pytest.exit
          exit "${PYTEST_EXIT}"

      - name: Upload qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-full-qualification-${{ github.event.inputs.qualification_sha }}
          path: build/qualification/
          retention-days: 30
          if-no-files-found: warn

      - name: Qualification pytest exit status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f build/qualification/pytest.exit ]; then
            echo "Missing pytest exit file — qualification aborted before pytest completed"
            exit 1
          fi
          exit "$(cat build/qualification/pytest.exit)"
