#
# Fast regression gate on push/PR:
#   uv sync --extra dev-ci --frozen
#   pytest <gate paths> -m gate
#
# Full local suite: scripts\test.bat unit  (uv sync --extra dev)

name: Regression gate

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: regression-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_LINK_MODE: copy
  UV_PYTHON_DOWNLOADS: never

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal)
        run: uv sync --extra dev-ci --frozen

      - name: Run regression gate
        run: >-
          uv run pytest
          tests/unit/debug
          tests/unit/experiments
          tests/unit/runtime
          tests/unit/agents
          tests/unit/contracts
          tests/unit/llm_adapters
          tests/unit/applications
          tests/unit/docs
          tests/integration
          tests/acceptance
          applications/legal_application/legal_tests/host
          applications/lab_application/lab_application_tests
          applications/research_application/research_application_tests
          agents/signoff_probe
          -m gate -q --tb=line

      - name: Governance import audits
        run: >-
          uv run python scripts/check_agents_vendor_imports.py
          && uv run python scripts/check_production_chat_agent_imports.py
          && uv run python scripts/check_integration_vendor_imports.py
