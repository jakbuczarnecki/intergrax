# Intergrax framework – proprietary and confidential.
#
# CI profiles:
#   pull_request, push (main) — ci_smoke unit tests + 3 boundary scripts (~45–90s wall-clock)
#   schedule (nightly 03:00 UTC), workflow_dispatch (full) — full gate + governance + closeout
#   workflow_dispatch (smoke) — same as PR (debug)
#
# Feature-branch pushes do not trigger CI (avoids duplicate runs when a PR is open).
# Full regression: `uv run pytest tests/unit -m "gate and not no_ci"` locally or nightly CI.
# Local full suite: scripts\test.bat unit  (uv sync --extra dev)

name: Regression gate

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: "smoke (PR default) or full (nightly parity)"
        type: choice
        options:
          - smoke
          - full
        default: smoke

concurrency:
  group: regression-gate-${{ github.event_name }}-${{ github.ref }}-${{ github.event.inputs.profile || 'smoke' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_LINK_MODE: copy
  UV_PYTHON_DOWNLOADS: never

jobs:
  ci-smoke:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.profile == 'smoke'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal)
        run: uv sync --extra dev-ci --frozen

      - name: CI smoke unit tests
        run: uv run python scripts/run_ci_smoke_pytest.py

      - name: Tier boundary audits (instant)
        env:
          INTERGRAX_CI_TEST_MARKER: ci_smoke
        run: >-
          uv run python scripts/check_harness_no_getattr.py
          && uv run python scripts/check_agents_no_tier3_imports.py
          && uv run python scripts/check_ci_gate_test_purity.py

  gate-tests:
    if: >-
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.profile == 'full'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal)
        run: uv sync --extra dev-ci --frozen

      - name: Full unit regression gate
        run: uv run pytest tests/unit -m "gate and not no_ci" -n auto -q --tb=line

  gate-governance-tier:
    if: >-
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.profile == 'full'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal)
        run: uv sync --extra dev-ci --frozen

      - name: Tier boundary and registry audits
        env:
          INTERGRAX_CI_TEST_MARKER: "gate and not no_ci"
        run: >-
          uv run python scripts/check_agents_vendor_imports.py
          && uv run python scripts/check_capability_routing.py
          && uv run python scripts/check_agent_step_security.py
          && uv run python scripts/check_agent_threat_model.py
          && uv run python scripts/check_agent_acp_close_ci.py
          && uv run python scripts/check_contract_schema_versions.py
          && uv run python scripts/check_acp_ci_conformance_matrix.py --scripts-only
          && uv run python scripts/check_agent_typed_state.py
          && uv run python scripts/check_production_chat_agent_imports.py
          && uv run python scripts/check_integration_vendor_imports.py
          && uv run python scripts/check_harness_no_getattr.py
          && uv run python scripts/check_ci_gate_test_purity.py
          && uv run python scripts/check_application_production_gates.py
          && uv run python scripts/check_legacy_modules_removed.py
          && uv run python scripts/check_agent_skill_resolution.py
          && uv run python scripts/check_harness_registry_resolution.py
          && uv run python scripts/check_agent_registry_bypass.py
          && uv run python scripts/check_langgraph_not_required.py
          && uv run python scripts/check_agents_no_tier3_imports.py
          && uv run python scripts/check_docs_domain_pairs.py
          && uv run python scripts/check_scaffold_harness_alignment.py
          && uv run python scripts/check_plugin_catalog.py
          && uv run python scripts/check_legacy_tool_plan_booleans.py

  gate-governance-wiring:
    if: >-
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.profile == 'full'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal)
        run: uv sync --extra dev-ci --frozen

      - name: Harness wiring and observability audits
        run: >-
          uv run python scripts/check_harness_capability_graph_wiring.py
          && uv run python scripts/check_harness_observability_wiring.py
          && uv run python scripts/check_observability_gates.py
          && uv run python scripts/check_harness_reliability_wiring.py
          && uv run python scripts/check_harness_security_wiring.py
          && uv run python scripts/check_harness_guardrail_wiring.py
          && uv run python scripts/check_harness_security_promote_gate.py
          && uv run python scripts/check_harness_security_defense_plugins.py
          && uv run python scripts/check_harness_encryption_policy.py
          && uv run python scripts/check_harness_cost_wiring.py
          && uv run python scripts/check_harness_evaluation_wiring.py
          && uv run intergrax doctor --ci

  gate-closeout:
    needs:
      - gate-tests
      - gate-governance-tier
      - gate-governance-wiring
    if: >-
      (
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.profile == 'full'
        )
      ) &&
      needs.gate-tests.result == 'success' &&
      needs.gate-governance-tier.result == 'success' &&
      needs.gate-governance-wiring.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal)
        run: uv sync --extra dev-ci --frozen

      - name: Phase V architecture closeout gate
        run: uv run python scripts/phase_v_closeout_gate.py --enforce --enforce-l4

      - name: Phase W-ADAPT runtime L4 closeout gate
        run: uv run python scripts/phase_w_adapt_closeout_gate.py --enforce-l4-runtime

      - name: Phase W-OPS operational evidence (nightly / full dispatch)
        run: uv run python scripts/phase_w_ops_evidence.py

      - name: RAG load/soak nightly report (RAG-MAINT-02)
        run: uv run python scripts/rag_load_soak_report.py

      - name: Export harness spec schemas
        run: uv run python scripts/export_harness_spec_schemas.py

      - name: Export capability catalog feed
        run: uv run python scripts/export_capability_catalog_feed.py
