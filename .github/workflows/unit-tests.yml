# Intergrax framework – proprietary and confidential.
#
# CI profiles:
#   push (feature branches) — fast: unit gate + governance scripts (~1 min)
#   push (main), pull_request, workflow_dispatch — full: gate + harness + Phase V
#
# Local full suite: scripts\test.bat unit  (uv sync --extra dev)

name: Regression gate

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: "fast (unit gate only) or full (default)"
        type: choice
        options:
          - full
          - fast
        default: full

concurrency:
  group: regression-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_LINK_MODE: copy
  UV_PYTHON_DOWNLOADS: never

jobs:
  fast-gate:
    if: >-
      (
        github.event_name == 'push' &&
        github.ref != 'refs/heads/main'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.profile == 'fast'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal)
        run: uv sync --extra dev-ci --frozen

      - name: Unit regression gate
        run: uv run pytest tests/unit -m gate -n auto -q --tb=line

      - name: Governance import audits
        run: >-
          uv run python scripts/check_agents_vendor_imports.py
          && uv run python scripts/check_production_chat_agent_imports.py
          && uv run python scripts/check_integration_vendor_imports.py
          && uv run python scripts/check_harness_no_getattr.py
          && uv run python scripts/check_tools_agent_imports.py
          && uv run python scripts/check_tools_agent_run.py
          && uv run python scripts/check_legacy_tool_plan_booleans.py

  gate:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.profile != 'fast'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal)
        run: uv sync --extra dev-ci --frozen

      - name: Run full regression gate
        run: >-
          uv run pytest
          tests/unit/debug
          tests/unit/experiments
          tests/unit/runtime
          tests/unit/agents
          tests/unit/contracts
          tests/unit/llm_adapters
          tests/unit/applications
          tests/unit/docs
          tests/integration
          tests/acceptance
          applications/legal_application/legal_tests/host
          applications/lab_application/lab_application_tests
          applications/research_application/research_application_tests
          agents/signoff_probe
          -m gate -n auto -q --tb=line

      - name: Governance import audits
        run: >-
          uv run python scripts/check_agents_vendor_imports.py
          && uv run python scripts/check_production_chat_agent_imports.py
          && uv run python scripts/check_integration_vendor_imports.py
          && uv run python scripts/check_harness_no_getattr.py
          && uv run python scripts/check_tools_agent_imports.py
          && uv run python scripts/check_tools_agent_run.py
          && uv run python scripts/check_legacy_tool_plan_booleans.py
          && uv run python scripts/check_agent_registry_bypass.py
          && uv run python scripts/check_scaffold_harness_alignment.py
          && uv run python scripts/check_langgraph_not_required.py
          && uv run python scripts/check_agents_no_tier3_imports.py
          && uv run intergrax doctor --ci
          && uv run python scripts/export_harness_spec_schemas.py
          && uv run python scripts/export_capability_catalog_feed.py

      - name: Phase V architecture closeout gate
        run: uv run python scripts/phase_v_closeout_gate.py --enforce --enforce-l4

      - name: Phase W-OPS operational evidence (non-enforcing)
        run: uv run python scripts/phase_w_ops_evidence.py

  harness:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.profile != 'fast'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (harness extras)
        run: uv sync --extra dev-ci --extra integrations-harness --frozen

      - name: Harness smoke tests
        run: >-
          uv run pytest
          tests/unit/integrations/providers/test_harness_m9.py
          tests/unit/integrations/providers/test_p4_harness_providers.py
          tests/unit/tools/providers/observability/
          tests/unit/tools/providers/gitlab/
          tests/unit/tools/providers/pagerduty/
          tests/unit/tools/providers/braintrust/
          tests/integration/runtime/test_harness_hitl_pagerduty.py
          tests/unit/applications/test_task_defaults.py
          tests/unit/applications/test_harness_default_notify.py
          tests/unit/integrations/test_harness_lab_stable_stack.py
          tests/unit/integrations/test_harness_lab_health.py
          tests/unit/runtime/architecture/test_runtime_shadow_evaluation.py
          tests/unit/skills/test_harness_skill_bundle.py
          tests/unit/applications/test_lab_harness_environment_wiring.py
          tests/unit/applications/test_lab_application_settings_phase_u.py
          -n auto -q --tb=line

      - name: Strict harness profile tests
        env:
          LAB_STRICT_HARNESS: "true"
          INTERGRAX_HARNESS_API_KEY: "ci-strict-harness-key"
        run: >-
          uv run pytest
          tests/unit/applications/test_harness_auth.py
          tests/unit/applications/test_lab_strict_harness.py
          -q --tb=line
