# © Artur Czarnecki. All rights reserved.
# Intergrax framework – proprietary and confidential.
#
# CI profiles:
#   pull_request, push (main, development) - smoke via scripts/ci/run_regression_gate_ci.py --profile smoke
#   workflow_dispatch (full) - full gate + governance + closeout (manual; no scheduled nightly)
#   workflow_dispatch (smoke) - same as PR (debug)
#   workflow_dispatch (ebh7_p3_l3) - Protocol 03 L3 exact-SHA replay (TEST_EXECUTION tree + EVIDENCE MANIFEST profile)
#
# pull_request workflows use the file on the repository DEFAULT branch (main).
# After changing this file on development, merge/sync to main or PR checks keep the old definition.
#
# Feature-branch pushes do not trigger CI (avoids duplicate runs when a PR is open).
# Full regression: `uv run pytest tests/unit -m "gate and not no_ci"` locally.
# Local full suite: uv sync --extra dev --extra dev-unit-cert

name: Regression gate

on:
  push:
    branches: [main, development]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: "smoke (PR default), enterprise (smoke+governance), full (nightly parity), diagnostics_full, or ebh7_p3_l3"
        type: choice
        options:
          - smoke
          - enterprise
          - full
          - diagnostics_full
          - ebh7_p3_l3
        default: smoke
      qualification_sha:
        description: "40-char Git commit SHA (required when profile is diagnostics_full)"
        type: string
        required: false
      ebh7_test_execution_sha:
        description: "40-char TEST_EXECUTION_SHA for ebh7_p3_l3 (default EBH-7 frozen baseline)"
        type: string
        required: false
      ebh7_evidence_publication_sha:
        description: "40-char EVIDENCE_PUBLICATION_SHA for MANIFEST profile (ebh7_p3_l3)"
        type: string
        required: false

concurrency:
  group: >-
    ${{ github.event.inputs.profile == 'diagnostics_full'
        && format('diagnostics-full-qualification-{0}', github.event.inputs.qualification_sha)
        || (github.event.inputs.profile == 'ebh7_p3_l3'
        && format('ebh7-p03-l3-{0}-{1}', github.event.inputs.ebh7_test_execution_sha || '4eb7eb1a89f82215d5356aa7d000198e432777b0', github.event.inputs.ebh7_evidence_publication_sha || '96069c09c2ca5a7a3a9586db336716c9430ca1d7'))
        || format('regression-gate-{0}-{1}-{2}', github.event_name, github.ref, github.event.inputs.profile || 'smoke') }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
        && github.event.inputs.profile != 'diagnostics_full'
        && github.event.inputs.profile != 'ebh7_p3_l3' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_LINK_MODE: copy
  UV_PYTHON_DOWNLOADS: never

jobs:
  ci-smoke:
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/development'
        )
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.profile == 'smoke'
      )
    runs-on: ubuntu-latest
    # checkout + uv sync + conformance + ~1900 ci_smoke tests (~50s); cache miss needs headroom
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal)
        run: uv sync --extra dev-ci --frozen

      - name: Regression gate smoke (SSOT)
        run: uv run --frozen python scripts/ci/run_regression_gate_ci.py --profile smoke --skip-uv-sync

  ci-enterprise:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.profile == 'enterprise'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal)
        run: uv sync --extra dev-ci --frozen

      - name: Regression gate enterprise (smoke + governance)
        run: uv run --frozen python scripts/ci/run_regression_gate_ci.py --profile enterprise --skip-uv-sync

  platform-plugin-windows-e2e:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.profile == 'full'
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal)
        run: uv sync --extra dev-ci --frozen

      - name: Platform Plugin Windows wheel E2E
        run: >-
          uv run --frozen pytest
          tests/integration/platform_plugins/test_plugin8_dual_mode_tool_e2e.py
          tests/contract/core/plugins/test_platform_plugin_contract.py
          -q --tb=line

  gate-tests:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.profile == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal + unit cert)
        run: uv sync --extra dev-ci --extra dev-unit-cert --frozen

      - name: Environment conformance (CI profile)
        run: uv run --frozen python scripts/maintenance/check_environment_conformance.py --profile ci

      - name: Full unit regression gate
        run: uv run --frozen pytest tests/unit -m "gate and not no_ci" -n auto -q --tb=line

      - name: Durable diagnostics deterministic gate
        run: >-
          uv run --frozen pytest
          tests/unit/applications/architecture/test_harden_1b_durable_problem_store_composition.py
          tests/unit/runtime/diagnostics/test_harden_1d_problem_persistence_write_failure.py
          tests/integration/applications/architecture/test_harden_1d_durable_problem_store_failure_semantics.py
          tests/integration/runtime/test_harden_4b_tenant_diagnostic_isolation_e2e.py
          tests/integration/runtime/test_harden_4c_clean_diagnostic_host_e2e.py
          tests/integration/runtime/test_harden_4d_problem_lifecycle_host_e2e.py
          tests/integration/runtime/test_harden_4e_diagnostic_read_truth_e2e.py
          -q --tb=line

      - name: Diagnostic concurrency deterministic gate
        run: >-
          uv run --frozen pytest
          tests/unit/runtime/diagnostics/test_harden_2a_problem_persistence_concurrency.py
          tests/unit/runtime/diagnostics/test_harden_2b_problem_lifecycle_occ_retry.py
          -q --tb=line

      - name: Diagnostics observability hardening gate (HARDEN-3C-3E)
        run: >-
          uv run --frozen pytest
          tests/unit/runtime/observability/test_harden_3c_export_failure_semantics.py
          tests/unit/runtime/observability/test_harden_3d_exporter_health.py
          tests/unit/contracts/test_instrumentation_span_attributes.py
          tests/unit/rag/tracking/test_rag_otel_spans.py
          tests/unit/context/tracking/test_context_otel_spans.py
          tests/unit/runtime/architecture/test_harden_3e_otel_import_gate.py
          tests/unit/runtime/architecture/test_harden_3f_qualification_matrix.py
          -q --tb=line

  gate-governance-tier:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.profile == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal)
        run: uv sync --extra dev-ci --frozen

      - name: Environment conformance (CI profile)
        run: uv run --frozen python scripts/maintenance/check_environment_conformance.py --profile ci

      - name: Tier boundary and registry audits
        env:
          INTERGRAX_CI_TEST_MARKER: "gate and not no_ci"
        run: >-
          uv run --frozen python scripts/maintenance/check_agents_vendor_imports.py
          && uv run --frozen python scripts/maintenance/check_capability_routing.py
          && uv run --frozen python scripts/maintenance/check_agent_step_security.py
          && uv run --frozen python scripts/maintenance/check_agent_threat_model.py
          && uv run --frozen python scripts/gates/check_agent_acp_close_ci.py
          && uv run --frozen python scripts/maintenance/check_contract_schema_versions.py
          && uv run --frozen python scripts/gates/check_acp_ci_conformance_matrix.py --scripts-only
          && uv run --frozen python scripts/maintenance/check_agent_typed_state.py
          && uv run --frozen python scripts/maintenance/check_production_chat_agent_imports.py
          && uv run --frozen python scripts/maintenance/check_integration_vendor_imports.py
          && uv run --frozen python scripts/maintenance/check_harness_no_getattr.py
          && uv run --frozen python scripts/ci/check_ci_gate_test_purity.py
          && uv run --frozen python scripts/gates/check_application_production_gates.py
          && uv run --frozen python scripts/maintenance/check_legacy_modules_removed.py
          && uv run --frozen python scripts/maintenance/check_agent_skill_resolution.py
          && uv run --frozen python scripts/maintenance/check_harness_registry_resolution.py
          && uv run --frozen python scripts/maintenance/check_agent_registry_bypass.py
          && uv run --frozen python scripts/maintenance/check_langgraph_not_required.py
          && uv run --frozen python scripts/maintenance/check_knowledge_document_conformance.py
          && uv run --frozen python scripts/maintenance/check_agents_no_tier3_imports.py
          && uv run --frozen python scripts/docs/check_docs_domain_pairs.py
          && uv run --frozen python scripts/maintenance/check_scaffold_harness_alignment.py
          && uv run --frozen python scripts/maintenance/check_plugin_catalog.py
          && uv run --frozen python scripts/maintenance/check_legacy_tool_plan_booleans.py

  gate-governance-wiring:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.profile == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal)
        run: uv sync --extra dev-ci --frozen

      - name: Environment conformance (CI profile)
        run: uv run --frozen python scripts/maintenance/check_environment_conformance.py --profile ci

      - name: Harness wiring and observability audits
        run: >-
          uv run --frozen python scripts/maintenance/check_harness_capability_graph_wiring.py
          && uv run --frozen python scripts/maintenance/check_harness_observability_wiring.py
          && uv run --frozen python scripts/maintenance/check_observability_gates.py
          && uv run --frozen python scripts/maintenance/check_harness_reliability_wiring.py
          && uv run --frozen python scripts/maintenance/check_harness_security_wiring.py
          && uv run --frozen python scripts/maintenance/check_harness_guardrail_wiring.py
          && uv run --frozen python scripts/gates/check_harness_security_promote_gate.py
          && uv run --frozen python scripts/maintenance/check_harness_security_defense_plugins.py
          && uv run --frozen python scripts/maintenance/check_harness_encryption_policy.py
          && uv run --frozen python scripts/maintenance/check_harness_security_spine_signals.py
          && uv run --frozen python scripts/maintenance/check_harness_cost_wiring.py
          && uv run --frozen python scripts/maintenance/check_harness_evaluation_wiring.py
          && uv run --frozen intergrax doctor --ci

  gate-closeout:
    needs:
      - gate-tests
      - gate-governance-tier
      - gate-governance-wiring
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.profile == 'full'
      ) &&
      needs.gate-tests.result == 'success' &&
      needs.gate-governance-tier.result == 'success' &&
      needs.gate-governance-wiring.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal)
        run: uv sync --extra dev-ci --frozen

      - name: Environment conformance (CI profile)
        run: uv run --frozen python scripts/maintenance/check_environment_conformance.py --profile ci

      - name: Phase V architecture closeout gate
        run: uv run --frozen python scripts/release/phase_v_closeout_gate.py --enforce --enforce-l4

      - name: Phase W-ADAPT runtime L4 closeout gate
        run: uv run --frozen python scripts/release/phase_w_adapt_closeout_gate.py --enforce-l4-runtime

      - name: Phase W-OPS operational evidence (nightly / full dispatch)
        run: uv run --frozen python scripts/release/phase_w_ops_evidence.py

      - name: RAG load/soak nightly report (RAG-MAINT-02)
        run: uv run --frozen python scripts/release/rag_load_soak_report.py

      - name: Export harness spec schemas
        run: uv run --frozen python scripts/release/export_harness_spec_schemas.py

      - name: Export capability catalog feed
        run: uv run --frozen python scripts/release/export_capability_catalog_feed.py

  diag-final-external-proof:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.profile == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      INTERGRAX_EXTERNAL_OTLP_PROOF_REQUIRED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal)
        run: uv sync --extra dev-ci --frozen

      - name: HARDEN-3F external canonical OTLP proof
        run: >-
          mkdir -p build
          && uv run --frozen pytest
          tests/integration/runtime/test_diag_final_external_otel_e2e.py
          -m external_proof
          --junitxml=build/harden-3f-external-otlp-proof.xml
          -q --tb=short

      - name: Assert HARDEN-3F external OTLP proof executed (no skip)
        run: >-
          uv run --frozen python -c "import sys, xml.etree.ElementTree as ET;
          root = ET.parse('build/harden-3f-external-otlp-proof.xml').getroot();
          skipped = sum(int(ts.get('skipped', 0)) for ts in root.findall('testsuite'));
          sys.exit(f'HARDEN-3F external OTLP proof skipped ({skipped}) - infrastructure/proof failure' if skipped else 0)"

  durable-diagnostics-external-proof:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.profile == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    env:
      INTERGRAX_MONGODB_URI: mongodb://localhost:27017
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/agents:${{ github.workspace }}/applications

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal + MongoDB provider)
        run: uv sync --extra dev-ci --extra integrations-mongodb --frozen

      - name: Durable diagnostics backend readiness
        run: >-
          uv run --frozen python
          tests/integration/applications/architecture/harden_1c_restart_proof_worker.py
          probe

      - name: Durable diagnostics external restart proof
        run: >-
          mkdir -p build
          && uv run --frozen pytest
          tests/integration/applications/architecture/test_harden_1c_durable_problem_restart_proof.py
          --junitxml=build/harden-1c-external-proof.xml
          -q --tb=short

      - name: Assert HARDEN-1C proof executed (no skip)
        run: >-
          uv run --frozen python -c "import sys, xml.etree.ElementTree as ET;
          root = ET.parse('build/harden-1c-external-proof.xml').getroot();
          skipped = sum(int(ts.get('skipped', 0)) for ts in root.findall('testsuite'));
          sys.exit(f'HARDEN-1C skipped ({skipped}) - infrastructure/proof failure' if skipped else 0)"

      - name: Diagnostic concurrency external proof
        run: >-
          uv run --frozen pytest
          tests/integration/applications/architecture/test_harden_2c_durable_problem_lifecycle_concurrency_proof.py
          --junitxml=build/harden-2c-external-proof.xml
          -q --tb=short

      - name: Assert HARDEN-2C proof executed (no skip)
        run: >-
          uv run --frozen python -c "import sys, xml.etree.ElementTree as ET;
          root = ET.parse('build/harden-2c-external-proof.xml').getroot();
          skipped = sum(int(ts.get('skipped', 0)) for ts in root.findall('testsuite'));
          sys.exit(f'HARDEN-2C skipped ({skipped}) - infrastructure/proof failure' if skipped else 0)"

      - name: HARDEN-4F Mongo Problem Store failure external proof
        run: >-
          uv run --frozen pytest
          tests/integration/applications/architecture/test_harden_4f_mongo_problem_store_failure_e2e.py
          --junitxml=build/harden-4f-external-proof.xml
          -q --tb=short

      - name: Assert HARDEN-4F proof executed (no skip)
        run: >-
          uv run --frozen python -c "import sys, xml.etree.ElementTree as ET;
          root = ET.parse('build/harden-4f-external-proof.xml').getroot();
          skipped = sum(int(ts.get('skipped', 0)) for ts in root.findall('testsuite'));
          sys.exit(f'HARDEN-4F skipped ({skipped}) - infrastructure/proof failure' if skipped else 0)"

  diagnostics-full-qualification:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.profile == 'diagnostics_full'
    runs-on: ubuntu-latest
    timeout-minutes: 130

    env:
      QUALIFICATION_SHA: ${{ github.event.inputs.qualification_sha }}
      PYTEST_QUALIFICATION_CMD: >-
        .venv/bin/python -m pytest tests/unit/runtime/diagnostics -q --durations=40
        --junitxml=build/qualification/diagnostics-full.xml

    steps:
      - name: Validate qualification SHA (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QUALIFICATION_SHA}" ]; then
            echo "qualification_sha is required for profile diagnostics_full"
            exit 1
          fi
          if ! [[ "${QUALIFICATION_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "qualification_sha must be exactly 40 hexadecimal characters"
            exit 1
          fi

      - name: Checkout exact qualification SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.qualification_sha }}
          fetch-depth: 0

      - name: Verify commit exists and HEAD matches qualification SHA
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${QUALIFICATION_SHA}^{commit}"
          EXPECTED_SHA="$(echo "${QUALIFICATION_SHA}" | tr '[:upper:]' '[:lower:]')"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "FAIL QUALIFICATION BEFORE PYTEST: HEAD (${ACTUAL_SHA}) != qualification_sha (${EXPECTED_SHA})"
            exit 1
          fi

      - name: Verify R0A/R0B ancestry on qualification SHA
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 613336125b9975074323f83e63a8fd10e49b99db HEAD
          git merge-base --is-ancestor 50a2e99fe266ac4430fb527226847d7339ef0a8f HEAD

      - name: Verify durable qualification workflow present at SHA
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'diagnostics-full-qualification:' .github/workflows/unit-tests.yml
          grep -q 'diagnostics_full' .github/workflows/unit-tests.yml
          grep -q 'github.workflow_sha' .github/workflows/unit-tests.yml
          grep -q 'github.workflow_ref' .github/workflows/unit-tests.yml

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CI minimal + unit cert)
        run: uv sync --extra dev-ci --extra dev-unit-cert --frozen

      - name: Environment conformance (CI profile)
        run: uv run --frozen python scripts/maintenance/check_environment_conformance.py --profile ci

      - name: Create qualification start metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qualification
          ACTUAL_SHA="$(git rev-parse HEAD)"
          START_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "qualification_sha=${QUALIFICATION_SHA}"
            echo "actual_head_sha=${ACTUAL_SHA}"
            echo "github_workflow_ref=${{ github.workflow_ref }}"
            echo "github_workflow_sha=${{ github.workflow_sha }}"
            echo "github_ref=${{ github.ref }}"
            echo "github_ref_name=${{ github.ref_name }}"
            echo "github_repository=${{ github.repository }}"
            echo "github_run_id=${{ github.run_id }}"
            echo "github_run_attempt=${{ github.run_attempt }}"
            echo "runner_os=${RUNNER_OS}"
            echo "python_version=$(.venv/bin/python -V 2>&1)"
            echo "start_timestamp=${START_TS}"
            echo "command=${PYTEST_QUALIFICATION_CMD}"
            echo "status=STARTED"
            echo "qualification_status=STARTED"
          } > build/qualification/meta.txt

      - name: Full diagnostics qualification (single pytest invocation)
        id: diagnostics_full_pytest
        timeout-minutes: 120
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          echo "full_diagnostics_invocations=1" >> build/qualification/meta.txt
          set -o pipefail
          ${PYTEST_QUALIFICATION_CMD} 2>&1 | tee build/qualification/full-diag.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          echo "${PYTEST_EXIT}" > build/qualification/pytest.exit
          exit "${PYTEST_EXIT}"

      - name: Finalize qualification metadata
        if: always()
        shell: bash
        env:
          PYTEST_STEP_OUTCOME: ${{ steps.diagnostics_full_pytest.outcome }}
        run: |
          set -euo pipefail
          META="build/qualification/meta.txt"
          if [ ! -f "${META}" ]; then
            echo "Missing qualification start metadata — evidence pipeline broken"
            exit 1
          fi
          START_TS="$(grep '^start_timestamp=' "${META}" | head -1 | cut -d= -f2- || true)"
          END_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          END_EPOCH="$(date -u +%s)"
          WALL_SEC=""
          if [ -n "${START_TS}" ]; then
            START_EPOCH="$(date -u -d "${START_TS}" +%s 2>/dev/null || true)"
            if [ -n "${START_EPOCH}" ]; then
              WALL_SEC="$((END_EPOCH - START_EPOCH))"
            fi
          fi
          PYTEST_EXIT_CODE="UNKNOWN"
          PYTEST_COMPLETED="false"
          if [ -f build/qualification/pytest.exit ]; then
            PYTEST_EXIT_CODE="$(tr -d '[:space:]' < build/qualification/pytest.exit)"
            PYTEST_COMPLETED="true"
          fi
          JUNIT_PRESENT="false"
          if [ -f build/qualification/diagnostics-full.xml ]; then
            JUNIT_PRESENT="true"
          fi
          LOG_PRESENT="false"
          if [ -f build/qualification/full-diag.log ]; then
            LOG_PRESENT="true"
          fi
          TIMEOUT_STATUS="false"
          QUALIFICATION_STATUS="ABORTED"
          STATUS="INTERRUPTED"
          if [ "${PYTEST_COMPLETED}" = "true" ]; then
            if [ "${PYTEST_EXIT_CODE}" = "0" ]; then
              QUALIFICATION_STATUS="COMPLETED_PASS"
              STATUS="COMPLETED"
            else
              QUALIFICATION_STATUS="COMPLETED_FAIL"
              STATUS="FAILED"
            fi
          elif [ "${PYTEST_STEP_OUTCOME}" = "failure" ] && [ -n "${WALL_SEC}" ] && [ "${WALL_SEC}" -ge 7000 ]; then
            QUALIFICATION_STATUS="TIMED_OUT"
            STATUS="TIMED_OUT"
            TIMEOUT_STATUS="true"
          elif [ "${PYTEST_STEP_OUTCOME}" = "failure" ]; then
            QUALIFICATION_STATUS="ABORTED"
            STATUS="INTERRUPTED"
          fi
          {
            cat "${META}"
            echo "end_timestamp=${END_TS}"
            echo "wall_clock_seconds=${WALL_SEC}"
            echo "pytest_exit_code=${PYTEST_EXIT_CODE}"
            echo "pytest_completed=${PYTEST_COMPLETED}"
            echo "junit_present=${JUNIT_PRESENT}"
            echo "log_present=${LOG_PRESENT}"
            echo "timeout_status=${TIMEOUT_STATUS}"
            echo "qualification_status=${QUALIFICATION_STATUS}"
            echo "status=${STATUS}"
          } > "${META}.tmp"
          mv "${META}.tmp" "${META}"

      - name: Upload qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-full-qualification-${{ github.event.inputs.qualification_sha }}
          path: build/qualification/
          retention-days: 30
          if-no-files-found: error

      - name: Qualification pytest exit status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f build/qualification/pytest.exit ]; then
            exit "$(tr -d '[:space:]' < build/qualification/pytest.exit)"
          fi
          if [ ! -f build/qualification/meta.txt ]; then
            echo "Missing qualification metadata — cannot propagate status"
            exit 1
          fi
          QUAL_STATUS="$(grep '^qualification_status=' build/qualification/meta.txt | tail -1 | cut -d= -f2-)"
          case "${QUAL_STATUS}" in
            COMPLETED_PASS) exit 0 ;;
            *)
              echo "Qualification did not pass (${QUAL_STATUS})"
              exit 1
              ;;
          esac

  ebh7-p03-l3-qualification:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.profile == 'ebh7_p3_l3'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      EBH7_DEFAULT_TEST_EXECUTION_SHA: 4eb7eb1a89f82215d5356aa7d000198e432777b0
      EBH7_DEFAULT_EVIDENCE_PUBLICATION_SHA: 96069c09c2ca5a7a3a9586db336716c9430ca1d7
      EBH7_DEFAULT_P03_REPLAY_HEAD_SHA: 1a73981e1fa818eb1494495c4f84f4b55b3f6bb6
      EBH7_MANIFEST_PATH: docs/project/maintainers/qualification/ebh_7_p03_independent_replay/MANIFEST.json
      TEST_EXECUTION_SHA: >-
        ${{ github.event.inputs.ebh7_test_execution_sha != '' && github.event.inputs.ebh7_test_execution_sha || '4eb7eb1a89f82215d5356aa7d000198e432777b0' }}
      EVIDENCE_PUBLICATION_SHA: >-
        ${{ github.event.inputs.ebh7_evidence_publication_sha != '' && github.event.inputs.ebh7_evidence_publication_sha || '96069c09c2ca5a7a3a9586db336716c9430ca1d7' }}
      P03_REPLAY_HEAD_SHA: >-
        ${{ github.event.inputs.ebh7_p03_replay_head_sha != '' && github.event.inputs.ebh7_p03_replay_head_sha || '1a73981e1fa818eb1494495c4f84f4b55b3f6bb6' }}

    steps:
      - name: Validate EBH-7 SHA inputs (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          for label in TEST_EXECUTION_SHA EVIDENCE_PUBLICATION_SHA; do
            val="${!label}"
            if ! [[ "${val}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "FAIL: ${label} must be exactly 40 hex chars (got '${val}')"
              exit 1
            fi
          done
          echo "test_execution_sha=${TEST_EXECUTION_SHA}"
          echo "evidence_publication_sha=${EVIDENCE_PUBLICATION_SHA}"

      - name: Fetch full history and checkout EVIDENCE replay tree
        uses: actions/checkout@v5
        with:
          ref: development
          fetch-depth: 0

      - name: Verify replay tree and code identity (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          git checkout "${P03_REPLAY_HEAD_SHA}"
          git cat-file -e "${P03_REPLAY_HEAD_SHA}^{commit}"
          git cat-file -e "${TEST_EXECUTION_SHA}^{commit}"
          git cat-file -e "${EVIDENCE_PUBLICATION_SHA}^{commit}"
          REPLAY_HEAD="$(git rev-parse HEAD)"
          if [ "${REPLAY_HEAD}" != "${P03_REPLAY_HEAD_SHA}" ]; then
            echo "FAIL: HEAD (${REPLAY_HEAD}) != P03_REPLAY_HEAD_SHA"
            exit 1
          fi
          git merge-base --is-ancestor "${TEST_EXECUTION_SHA}" "${P03_REPLAY_HEAD_SHA}"
          git merge-base --is-ancestor "${EVIDENCE_PUBLICATION_SHA}" "${P03_REPLAY_HEAD_SHA}"
          if ! git diff --quiet "${TEST_EXECUTION_SHA}" "${P03_REPLAY_HEAD_SHA}" -- tests/qualification/; then
            echo "FAIL: qualification tests differ between TEST_EXECUTION and replay HEAD"
            git diff --stat "${TEST_EXECUTION_SHA}" "${P03_REPLAY_HEAD_SHA}" -- tests/qualification/
            exit 1
          fi
          echo "code_identity_test_execution_sha=${TEST_EXECUTION_SHA}"
          echo "replay_head_sha=${REPLAY_HEAD}"

      - name: Resolve L3 pytest command from EVIDENCE MANIFEST
        id: manifest_profile
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${EVIDENCE_PUBLICATION_SHA}^{commit}"
          git cat-file -e "${EVIDENCE_PUBLICATION_SHA}:${EBH7_MANIFEST_PATH}"
          MANIFEST_TEST_SHA="$(python3 -c "import json; print(json.load(open('${EBH7_MANIFEST_PATH}'))['TEST_EXECUTION_SHA'])")"
          if [ "${MANIFEST_TEST_SHA}" != "${TEST_EXECUTION_SHA}" ]; then
            echo "FAIL: MANIFEST TEST_EXECUTION_SHA (${MANIFEST_TEST_SHA}) != ${TEST_EXECUTION_SHA}"
            exit 1
          fi
          MANIFEST_EVIDENCE_SHA="$(python3 -c "import json; print(json.load(open('${EBH7_MANIFEST_PATH}'))['EVIDENCE_PUBLICATION_SHA'])")"
          if [ "${MANIFEST_EVIDENCE_SHA}" != "${EVIDENCE_PUBLICATION_SHA}" ]; then
            echo "FAIL: MANIFEST EVIDENCE_PUBLICATION_SHA (${MANIFEST_EVIDENCE_SHA}) != ${EVIDENCE_PUBLICATION_SHA}"
            exit 1
          fi
          PYTEST_CMD="$(python3 -c "import json; print(json.load(open('${EBH7_MANIFEST_PATH}'))['pytest_profile']['command'])")"
          echo "${PYTEST_CMD}" | grep -q 'test_ebh_5_dual_slug_rpl_e_operational_gates.py' || {
            echo "FAIL: MANIFEST profile must include F07 operational gates"
            exit 1
          }
          echo "${PYTEST_CMD}" | grep -q 'test_ebh_7_gate_finding_resolution' || true
          echo "pytest_cmd=${PYTEST_CMD}" >> "${GITHUB_OUTPUT}"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (frozen dev-ci)
        run: uv sync --extra dev-ci --frozen

      - name: Environment conformance (CI profile)
        run: uv run --frozen python scripts/maintenance/check_environment_conformance.py --profile ci

      - name: Create EBH-7 L3 qualification metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/qualification/ebh7-l3
          START_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "protocol=EBH-7-P03-L3"
            echo "test_execution_sha=${TEST_EXECUTION_SHA}"
            echo "evidence_publication_sha=${EVIDENCE_PUBLICATION_SHA}"
            echo "replay_checkout_sha=${P03_REPLAY_HEAD_SHA}"
            echo "actual_head_sha=$(git rev-parse HEAD)"
            echo "github_workflow_ref=${{ github.workflow_ref }}"
            echo "github_workflow_sha=${{ github.workflow_sha }}"
            echo "github_run_id=${{ github.run_id }}"
            echo "github_run_attempt=${{ github.run_attempt }}"
            echo "start_timestamp=${START_TS}"
            echo "pytest_cmd=${{ steps.manifest_profile.outputs.pytest_cmd }}"
            echo "qualification_status=STARTED"
          } > build/qualification/ebh7-l3/meta.txt

      - name: Protocol 03 L3 pytest (single invocation)
        id: ebh7_l3_pytest
        timeout-minutes: 35
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          set -o pipefail
          ${{ steps.manifest_profile.outputs.pytest_cmd }} \
            --junitxml=build/qualification/ebh7-l3/junit.xml \
            2>&1 | tee build/qualification/ebh7-l3/pytest.log
          PYTEST_EXIT=${PIPESTATUS[0]}
          echo "${PYTEST_EXIT}" > build/qualification/ebh7-l3/pytest.exit
          exit "${PYTEST_EXIT}"

      - name: Finalize EBH-7 L3 metadata
        if: always()
        shell: bash
        env:
          PYTEST_STEP_OUTCOME: ${{ steps.ebh7_l3_pytest.outcome }}
        run: |
          set -euo pipefail
          META="build/qualification/ebh7-l3/meta.txt"
          mkdir -p build/qualification/ebh7-l3
          if [ ! -f "${META}" ]; then
            echo "qualification_status=ABORTED" > "${META}"
          fi
          END_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PYTEST_EXIT_CODE="UNKNOWN"
          if [ -f build/qualification/ebh7-l3/pytest.exit ]; then
            PYTEST_EXIT_CODE="$(tr -d '[:space:]' < build/qualification/ebh7-l3/pytest.exit)"
          fi
          PASSED="unknown"
          SKIPPED="unknown"
          XFAILED="unknown"
          if [ -f build/qualification/ebh7-l3/junit.xml ]; then
            read -r PASSED SKIPPED XFAILED <<< "$(python3 -c "import xml.etree.ElementTree as ET; r=ET.parse('build/qualification/ebh7-l3/junit.xml').getroot(); print(r.get('tests','0'), sum(int(ts.get('skipped',0)) for ts in r.findall('testsuite')), sum(int(ts.get('failures',0))+int(ts.get('errors',0)) for ts in r.findall('testsuite')))")"
          fi
          F07_COUNT="$(grep -c 'test_ebh_5_dual_slug_rpl_e_operational_gates.py' build/qualification/ebh7-l3/pytest.log 2>/dev/null || echo 0)"
          STATUS="INTERRUPTED"
          QUALIFICATION_STATUS="ABORTED"
          if [ "${PYTEST_EXIT_CODE}" = "0" ]; then
            QUALIFICATION_STATUS="COMPLETED_PASS"
            STATUS="COMPLETED"
          elif [ "${PYTEST_EXIT_CODE}" != "UNKNOWN" ]; then
            QUALIFICATION_STATUS="COMPLETED_FAIL"
            STATUS="FAILED"
          fi
          {
            cat "${META}"
            echo "end_timestamp=${END_TS}"
            echo "pytest_exit_code=${PYTEST_EXIT_CODE}"
            echo "junit_tests=${PASSED}"
            echo "junit_skipped=${SKIPPED}"
            echo "f07_log_lines=${F07_COUNT}"
            echo "qualification_status=${QUALIFICATION_STATUS}"
            echo "status=${STATUS}"
          } | tee "${META}.tmp" > /dev/null
          mv "${META}.tmp" "${META}"

      - name: Upload EBH-7 L3 qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ebh7-p03-l3-${{ env.TEST_EXECUTION_SHA }}
          path: build/qualification/ebh7-l3/
          retention-days: 90
          if-no-files-found: error

      - name: EBH-7 L3 pytest exit status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f build/qualification/ebh7-l3/pytest.exit ]; then
            exit "$(tr -d '[:space:]' < build/qualification/ebh7-l3/pytest.exit)"
          fi
          exit 1
