# Mirrors: scripts\test.bat unit
#   → pytest tests applications -m unit

name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (dev)
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest tests applications -m unit
