# Tier-2 agent dependency project (workspace member).
# Import path preserved: dispute_intake
# Canonical: docs/project/architecture/APPLICATION_RUNTIME_GRAPH_MODEL.md

[project]
name = "intergrax-dispute-intake-agent"
version = "0.1.0"
description = "Reusable Tier-2 agent package: dispute_intake"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Intergrax-ai",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "dispute_intake",
  "dispute_intake.schemas",
  "dispute_intake.steps",
]

[tool.setuptools.package-dir]
"dispute_intake" = "."

[tool.uv.sources]
Intergrax-ai = { workspace = true }
