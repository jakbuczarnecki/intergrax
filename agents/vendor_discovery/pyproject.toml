# Tier-2 agent dependency project (workspace member).
# Import path preserved: vendor_discovery
# Canonical: docs/architecture/APPLICATION_RUNTIME_GRAPH_MODEL.md

[project]
name = "intergrax-vendor-discovery-agent"
version = "0.1.0"
description = "Reusable Tier-2 agent package: vendor_discovery"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Intergrax-ai",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "vendor_discovery",
  "vendor_discovery.schemas",
  "vendor_discovery.steps",
]

[tool.setuptools.package-dir]
"vendor_discovery" = "."

[tool.uv.sources]
Intergrax-ai = { workspace = true }
