# Tier-2 agent dependency project (workspace member).
# Import path preserved: boundary_demo
# Canonical: docs/project/architecture/APPLICATION_RUNTIME_GRAPH_MODEL.md

[project]
name = "intergrax-boundary-demo-agent"
version = "0.1.0"
description = "Reusable Tier-2 agent package: boundary_demo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Intergrax-ai",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "boundary_demo",
]

[tool.setuptools.package-dir]
"boundary_demo" = "."

[tool.uv.sources]
Intergrax-ai = { workspace = true }
