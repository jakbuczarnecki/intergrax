# Tier-2 agent dependency project (workspace member).
# Import path preserved: dispute_analyst
# Canonical: docs/project/architecture/APPLICATION_RUNTIME_GRAPH_MODEL.md

[project]
name = "intergrax-dispute-analyst-agent"
version = "0.1.0"
description = "Reusable Tier-2 agent package: dispute_analyst"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Intergrax-ai",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "dispute_analyst",
  "dispute_analyst.schemas",
  "dispute_analyst.steps",
]

[tool.setuptools.package-dir]
"dispute_analyst" = "."

[tool.uv.sources]
Intergrax-ai = { workspace = true }
