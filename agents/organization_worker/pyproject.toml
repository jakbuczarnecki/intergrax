# Tier-2 agent dependency project (workspace member).
# Import path preserved: organization_worker
# Canonical: docs/architecture/APPLICATION_RUNTIME_GRAPH_MODEL.md

[project]
name = "intergrax-organization-worker-agent"
version = "0.1.0"
description = "Reusable Tier-2 agent package: organization_worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Intergrax-ai",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "organization_worker",
]

[tool.setuptools.package-dir]
"organization_worker" = "."

[tool.uv.sources]
Intergrax-ai = { workspace = true }
