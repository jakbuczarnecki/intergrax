# Tier-2 agent dependency project (workspace member).
# Import path preserved: local_indexer
# Canonical: docs/architecture/APPLICATION_RUNTIME_GRAPH_MODEL.md

[project]
name = "intergrax-local-indexer-agent"
version = "0.1.0"
description = "Reusable Tier-2 agent package: local_indexer"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Intergrax-ai",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "local_indexer",
  "local_indexer.schemas",
  "local_indexer.steps",
]

[tool.setuptools.package-dir]
"local_indexer" = "."

[tool.uv.sources]
Intergrax-ai = { workspace = true }
