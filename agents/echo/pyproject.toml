# Tier-2 agent dependency project (workspace member).
# Import path preserved: echo
# Canonical: docs/architecture/APPLICATION_RUNTIME_GRAPH_MODEL.md

[project]
name = "intergrax-echo-agent"
version = "0.1.0"
description = "Reusable Tier-2 agent package: echo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Intergrax-ai",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "echo",
]

[tool.setuptools.package-dir]
"echo" = "."

[tool.uv.sources]
Intergrax-ai = { workspace = true }
