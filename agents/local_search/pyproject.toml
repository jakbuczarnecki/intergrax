# Tier-2 agent dependency project (workspace member).
# Import path preserved: local_search
# Canonical: docs/project/architecture/APPLICATION_RUNTIME_GRAPH_MODEL.md

[project]
name = "intergrax-local-search-agent"
version = "0.1.0"
description = "Reusable Tier-2 agent package: local_search"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Intergrax-ai",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "local_search",
  "local_search.schemas",
  "local_search.steps",
]

[tool.setuptools.package-dir]
"local_search" = "."

[tool.uv.sources]
Intergrax-ai = { workspace = true }
