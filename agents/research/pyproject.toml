# Tier-2 agent dependency project (workspace member).
# Import path preserved: research
# Canonical: docs/project/architecture/APPLICATION_RUNTIME_GRAPH_MODEL.md

[project]
name = "intergrax-research-agent"
version = "0.1.0"
description = "Reusable Tier-2 agent package: research"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Intergrax-ai",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "research",
  "research.steps",
  "research.summary_steps",
]

[tool.setuptools.package-dir]
"research" = "."

[tool.uv.sources]
Intergrax-ai = { workspace = true }
