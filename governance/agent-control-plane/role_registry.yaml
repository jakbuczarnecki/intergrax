# InterGRAX agent role registry (Delivery DevOS control plane)
# Commit SSOT: may_commit on the role. implementer=true (own worktree branch, Ref: trailer only).
# orchestrator=false: no commit, no branch integration, no push, no pull request, no merge.
# A subagent may commit only when maps_to has may_commit true. Existing roles retain their rules.
# OD-AF-INT A: only cursor-runtime integrator may publish/merge scoped accepted PRs via Cursor gate.
# No existing Claude Code role, map, or subagent is modified by the Cursor-only addition.
# igx-implementer and best-of-n-runner max_parallel stays 2 until a recorded resource benchmark.
# uv/pytest stay serial. A 3-4 worker target is not authorized here.

version: "1.0"
default_role: orchestrator

global_denied_commands:
  - git push --force
  - git reset --hard
  - git checkout -b

roles:
  orchestrator:
    description: Routes operator intent; may spawn subagents per subagent_role_map.
    allowed_skills:
      - igx-devos-qc-orchestrator
      - igx-devos-ticket-driven-work
      - igx-devos-parallel-orchestration
      - igx-devos-ticket-scaffold
    may_commit: false

  architect-planner:
    description: Read-only planning; plan digest and ticket scope.
    allowed_skills:
      - igx-devos-role-architect
      - igx-devos-plan-ticket-scope
      - igx-devos-ticket-scaffold
    may_commit: false

  implementer:
    description: Product code changes within approved ticket scope.
    allowed_skills:
      - igx-devos-role-implementer
      - igx-devos-ticket-driven-work
      - igx-devos-enterprise-quality-gate
    may_commit: true

  tester:
    description: Runs verification; records checkpoint in ticket.
    allowed_skills:
      - igx-devos-role-tester
      - igx-devos-enterprise-quality-gate
    may_commit: false

  reviewer:
    description: Code review handoff; not G6 certification.
    allowed_skills:
      - igx-devos-role-reviewer
    may_commit: false

  delivery-closure:
    description: PR creation and batch checklist; no merge authority.
    allowed_skills:
      - igx-devos-github-pr-workflow
      - igx-devos-enterprise-quality-gate
    may_commit: false

  independent-quality-auditor:
    description: Separate session G6 audit per AUDIT_PROTOCOL; never in implementer chat.
    allowed_skills:
      - igx-devos-role-reviewer
    may_commit: false
    declares_g6_pass: false

  integrator:
    description: Cursor-only OD-AF-INT A integration of reviewed changes via scoped runner; never Claude.
    runtime: cursor
    allowed_skills:
      - igx-devos-ticket-driven-work
      - igx-devos-enterprise-quality-gate
    may_commit: true
    commit_scope: own_worktree_integration_branch
    remote_scope: cursor_scoped_pr_only

subagent_role_map:
  explore:
    maps_to: architect-planner
    max_parallel: 3
    read_only: true
  generalPurpose:
    maps_to: orchestrator
    max_parallel: 2
    read_only: false
  ci-investigator:
    maps_to: tester
    max_parallel: 1
    read_only: true
  bugbot:
    maps_to: reviewer
    max_parallel: 1
    read_only: true
  security-review:
    maps_to: independent-quality-auditor
    max_parallel: 1
    read_only: true
  best-of-n-runner:
    maps_to: implementer
    max_parallel: 2
    read_only: false
    requires_worktree: true
  igx-researcher:
    maps_to: architect-planner
    max_parallel: 3
    read_only: true
  igx-implementer:
    maps_to: implementer
    max_parallel: 2
    read_only: false
    requires_worktree: true
  igx-reviewer:
    maps_to: reviewer
    max_parallel: 1
    read_only: true
  igx-architect:
    maps_to: architect-planner
    max_parallel: 1
    read_only: false
  igx-integrator:
    maps_to: integrator
    runtime: cursor
    max_parallel: 1
    read_only: false
    requires_worktree: true
