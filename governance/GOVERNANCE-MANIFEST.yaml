# InterGRAX Delivery DevOS (DCP) — governance program manifest.
# Certification flags remain false until external G6 audit (see EVIDENCE-AND-CERTIFICATION.md).

program: intergrax-delivery-devos
version: "1.0.0"
ticket_ssot: governance/tickets/T-IGX-{nn}-{batch}.md

phases:
  GOV-00:
    name: policy-ssot
    status: implemented
    certification_ready: false
  GOV-01:
    name: quality-engine
    status: implemented
    certification_ready: false
  GOV-02:
    name: agent-control-plane
    status: implemented
    certification_ready: false
    note: >-
      Cursor-only igx_gov sync-adapters regenerates MATRIX.md via generate_control_plane_matrix.py;
      Claude/Codex adapter packs ADAPT in a later batch if needed.
  GOV-03:
    name: plan-approval
    status: implemented
    certification_ready: false
  GOV-04:
    name: parallel-execution
    status: implemented
    certification_ready: false
  GOV-05:
    name: ci-tiers-pr-metadata
    status: implemented
    certification_ready: false
  GOV-06:
    name: trusted-policy-pin
    status: deferred
    certification_ready: false
    note: >-
      Optional TRUSTED_POLICY_PIN.yaml + CI pin compare — ADVISORY only; not required for DCP 0–7.
      Do not add CI job until operator requests GOV-06 implementation.
  GOV-07:
    name: evidence-operations
    status: implemented
    certification_ready: false
  GOV-08:
    name: dcp-program-closure
    status: in_progress
    certification_ready: false
    note: >-
      Execution tracked by governance/DCP-CLOSURE-BACKLOG.md (W1–W8).
      global_certification flags remain false until W8 G6 handoff.

global_certification:
  dcp_program_certified: false
  g6_independent_audit_pass: false
  operator_signoff: false

references:
  policy_hierarchy: governance/POLICY-HIERARCHY.md
  policy_registry: governance/policy-registry.yaml
  closure_backlog: governance/DCP-CLOSURE-BACKLOG.md
  agent_control_plane: governance/agent-control-plane/
  tickets: governance/tickets/
  devos_hub: docs/project/technical/devos/README.md
