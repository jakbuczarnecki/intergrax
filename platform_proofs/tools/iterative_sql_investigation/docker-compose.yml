version: "3.9"

# Isolated proof-owned PostgreSQL — do NOT reuse infra/docker/postgresql volumes.
# Start: docker compose -f platform_proofs/tools/iterative_sql_investigation/docker-compose.yml up -d
# Admin DSN: postgresql://proof_admin:proof_admin_local@localhost:5435/iterative_sql_proof
# Runtime DSN: postgresql://proof_runtime:proof_runtime_local@localhost:5435/iterative_sql_proof

services:
  postgresql:
    image: postgres:16.6
    container_name: intergrax-pp-sql-investigation-postgresql
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: proof_admin
      POSTGRES_PASSWORD: proof_admin_local
      POSTGRES_DB: iterative_sql_proof
    volumes:
      - pp_sql_investigation_data:/var/lib/postgresql/data
      - ./sql/bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proof_admin -d iterative_sql_proof"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pp_sql_investigation_data:
