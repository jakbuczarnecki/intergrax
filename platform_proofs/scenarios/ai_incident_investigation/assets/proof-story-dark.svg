<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" role="img">
  <title>AI incident investigation proof story</title>
  <desc>Operational incident through evidence gathering, plausible overload diagnosis, independent falsification, follow-up, and bounded RESOLVED or UNRESOLVED outcomes.</desc>
  <rect width="1100" height="820" fill="#0d1117"/>
  <rect x="24" y="20" width="1052" height="780" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <text x="550" y="58" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#e6edf3">Incident investigation proof story</text>
  <text x="550" y="84" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">Evidence-gated diagnosis  not correlation theater</text>

  <rect x="420" y="108" width="260" height="52" rx="10" fill="#3d1f24" stroke="#f85149" stroke-width="2"/>
  <text x="550" y="140" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Operational incident</text>

  <line x1="550" y1="160" x2="550" y2="182" stroke="#e6edf3" stroke-width="2"/>
  <path d="M550 182 L540 168 L560 168 Z" fill="#e6edf3"/>

  <rect x="420" y="186" width="260" height="52" rx="10" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
  <text x="550" y="218" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Initial evidence</text>

  <line x1="550" y1="238" x2="550" y2="260" stroke="#e6edf3" stroke-width="2"/>
  <path d="M550 260 L540 246 L560 246 Z" fill="#e6edf3"/>

  <rect x="360" y="264" width="380" height="56" rx="10" fill="#3d2f00" stroke="#d29922" stroke-width="2"/>
  <text x="550" y="294" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Plausible diagnosis</text>
  <text x="550" y="312" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">&#8220;volume overload&#8221; (candidate, not final)</text>

  <line x1="550" y1="320" x2="550" y2="348" stroke="#e6edf3" stroke-width="2"/>
  <path d="M550 348 L540 334 L560 334 Z" fill="#e6edf3"/>

  <rect x="340" y="352" width="420" height="52" rx="10" fill="#1c2d4a" stroke="#58a6ff" stroke-width="2"/>
  <text x="550" y="384" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Independent falsification</text>

  <line x1="550" y1="400" x2="550" y2="422" stroke="#e6edf3" stroke-width="2"/>
  <path d="M550 422 L540 408 L560 408 Z" fill="#e6edf3"/>

  <rect x="360" y="426" width="380" height="52" rx="10" fill="#3d1f24" stroke="#f85149" stroke-width="2"/>
  <text x="550" y="456" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Evidence defect found</text>

  <line x1="550" y1="478" x2="550" y2="500" stroke="#e6edf3" stroke-width="2"/>
  <path d="M550 500 L540 486 L560 486 Z" fill="#e6edf3"/>

  <rect x="400" y="504" width="300" height="52" rx="10" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
  <text x="550" y="536" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Targeted follow-up</text>

  <line x1="500" y1="556" x2="320" y2="600" stroke="#e6edf3" stroke-width="2"/>
  <line x1="600" y1="556" x2="780" y2="600" stroke="#e6edf3" stroke-width="2"/>
  <path d="M320 600 L332 588 L336 604 Z" fill="#e6edf3"/>
  <path d="M780 600 L768 588 L764 604 Z" fill="#e6edf3"/>

  <rect x="140" y="608" width="360" height="88" rx="12" fill="#1a3324" stroke="#3fb950" stroke-width="2"/>
  <text x="280" y="642" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">RESOLVED</text>
  <text x="280" y="668" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">Supported bounded diagnosis</text>
  <text x="280" y="688" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">with auditable evidence trail</text>

  <rect x="600" y="608" width="360" height="88" rx="12" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
  <text x="780" y="642" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">UNRESOLVED</text>
  <text x="780" y="668" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">Insufficient distinguishing evidence</text>
  <text x="780" y="688" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">honest refusal  no guessing</text>

  <text x="550" y="758" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">Design-stage conceptual flow  not execution results.</text>
</svg>
