<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" role="img">
  <title>Correlation trap vs evidence-supported diagnosis</title>
  <desc>Left: unsupported volume-delay shortcut. Right: before-during-after comparative evidence supporting sorter degradation diagnosis.</desc>
  <rect width="1100" height="640" fill="#0d1117"/>
  <rect x="24" y="20" width="1052" height="600" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <text x="550" y="56" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#e6edf3">Correlation trap vs evidence-supported diagnosis</text>

  <rect x="48" y="88" width="480" height="480" rx="14" fill="#3d1f24" stroke="#f85149" stroke-width="2"/>
  <text x="280" y="124" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#f85149">What looks obvious</text>

  <rect x="88" y="148" width="400" height="44" rx="8" fill="#21262d" stroke="#f85149" stroke-width="1.5"/>
  <text x="280" y="176" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#e6edf3">Volume +22%</text>

  <line x1="280" y1="196" x2="280" y2="216" stroke="#f85149" stroke-width="2"/>
  <path d="M280 216 L272 202 L288 202 Z" fill="#f85149"/>

  <rect x="88" y="220" width="400" height="44" rx="8" fill="#21262d" stroke="#f85149" stroke-width="1.5"/>
  <text x="280" y="248" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#e6edf3">Delay increases</text>

  <line x1="280" y1="272" x2="280" y2="292" stroke="#f85149" stroke-width="2"/>
  <path d="M280 292 L272 278 L288 278 Z" fill="#f85149"/>

  <rect x="88" y="296" width="400" height="52" rx="8" fill="#3d2f00" stroke="#d29922" stroke-width="1.5"/>
  <text x="280" y="328" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">&#8220;Warehouse overloaded&#8221;</text>

  <text x="280" y="380" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#f85149">&#10005;</text>
  <text x="280" y="408" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#f85149">unsupported shortcut</text>
  <text x="280" y="468" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">Correlation in one window</text>
  <text x="280" y="488" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">does not prove causation</text>

  <rect x="572" y="88" width="480" height="480" rx="14" fill="#1a3324" stroke="#3fb950" stroke-width="2"/>
  <text x="740" y="124" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#3fb950">What follow-up evidence shows</text>

  <rect x="612" y="148" width="400" height="40" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/>
  <text x="740" y="174" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#e6edf3">Sorter #4 degradation</text>

  <line x1="740" y1="192" x2="740" y2="208" stroke="#3fb950" stroke-width="2"/>
  <path d="M740 208 L732 204 L748 204 Z" fill="#3fb950"/>

  <rect x="612" y="212" width="400" height="40" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/>
  <text x="740" y="236" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#e6edf3">Heavy-lane throughput drops</text>

  <line x1="740" y1="252" x2="740" y2="268" stroke="#3fb950" stroke-width="2"/>
  <path d="M740 268 L732 264 L748 264 Z" fill="#3fb950"/>

  <rect x="612" y="272" width="400" height="40" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/>
  <text x="740" y="296" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#e6edf3">Heavy-parcel delays rise</text>

  <line x1="740" y1="312" x2="740" y2="328" stroke="#3fb950" stroke-width="2"/>
  <path d="M740 328 L732 324 L748 324 Z" fill="#3fb950"/>

  <rect x="612" y="332" width="400" height="40" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/>
  <text x="740" y="356" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#e6edf3">Recovery after sorter recovery</text>

  <text x="740" y="404" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#3fb950">&#10003;</text>
  <text x="740" y="428" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#3fb950">best-supported bounded diagnosis</text>
  <text x="740" y="468" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">Before / during / after + comparison</text>
  <text x="740" y="488" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">not another correlation swap</text>

  <text x="550" y="612" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">Conceptual evidence shape  design stage, not fixture numbers.</text>
</svg>
