<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" role="img">
  <title>Verified product identification proof story</title>
  <desc>Incomplete product request against a noisy multi-million-offer catalog through multi-channel retrieval, reranking, evidence verification, and VERIFIED or bounded refusal outcomes.</desc>
  <rect width="1100" height="900" fill="#f6f8fb"/>
  <rect x="24" y="20" width="1052" height="860" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <text x="550" y="58" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#1a1a2e">Verified product identification proof story</text>
  <text x="550" y="84" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">Top search result &#8800; verified product</text>

  <rect x="320" y="108" width="460" height="56" rx="10" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="550" y="134" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#1a1a2e">Incomplete product request</text>
  <text x="550" y="154" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#5b6f82">natural language &#183; partial ID &#183; compatibility constraints</text>

  <line x1="550" y1="164" x2="550" y2="186" stroke="#1a1a2e" stroke-width="2"/>
  <path d="M550 186 L540 172 L560 172 Z" fill="#1a1a2e"/>

  <rect x="280" y="190" width="540" height="56" rx="10" fill="#f0f4f8" stroke="#5b6f82" stroke-width="2"/>
  <text x="550" y="216" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#1a1a2e">3.77M noisy product offers</text>
  <text x="550" y="236" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#5b6f82">heterogeneous IDs &#183; missing fields &#183; near-identical variants</text>

  <line x1="550" y1="246" x2="550" y2="268" stroke="#1a1a2e" stroke-width="2"/>
  <path d="M550 268 L540 254 L560 254 Z" fill="#1a1a2e"/>

  <rect x="300" y="272" width="500" height="56" rx="10" fill="#fff8e1" stroke="#c9a227" stroke-width="2"/>
  <text x="550" y="298" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#1a1a2e">Several convincing candidates</text>
  <text x="550" y="318" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#5b6f82">semantically similar does not mean materially identical</text>

  <line x1="550" y1="328" x2="550" y2="350" stroke="#1a1a2e" stroke-width="2"/>
  <path d="M550 350 L540 336 L560 336 Z" fill="#1a1a2e"/>

  <rect x="260" y="354" width="580" height="56" rx="10" fill="#f0f4f8" stroke="#5b6f82" stroke-width="2"/>
  <text x="550" y="380" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#1a1a2e">Multi-channel retrieval + reranking</text>
  <text x="550" y="400" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#5b6f82">exact &#183; lexical &#183; structured &#183; vector &#8594; recall, not identity</text>

  <line x1="550" y1="410" x2="550" y2="432" stroke="#1a1a2e" stroke-width="2"/>
  <path d="M550 432 L540 418 L560 418 Z" fill="#1a1a2e"/>

  <rect x="300" y="436" width="500" height="56" rx="10" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="550" y="462" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#1a1a2e">Evidence verification</text>
  <text x="550" y="482" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#5b6f82">material constraints vs source catalog fields</text>

  <line x1="500" y1="492" x2="280" y2="540" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="550" y1="492" x2="550" y2="540" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="600" y1="492" x2="820" y2="540" stroke="#1a1a2e" stroke-width="2"/>
  <path d="M280 540 L292 528 L296 544 Z" fill="#1a1a2e"/>
  <path d="M550 540 L540 526 L560 526 Z" fill="#1a1a2e"/>
  <path d="M820 540 L808 528 L804 544 Z" fill="#1a1a2e"/>

  <rect x="80" y="548" width="400" height="88" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="280" y="582" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">VERIFIED</text>
  <text x="280" y="608" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">identity supported by evidence</text>
  <text x="280" y="628" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#5b6f82">RESOLVED envelope</text>

  <rect x="350" y="548" width="400" height="88" rx="12" fill="#f0f4f8" stroke="#5b6f82" stroke-width="2"/>
  <text x="550" y="578" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#1a1a2e">AMBIGUOUS / INSUFFICIENT</text>
  <text x="550" y="602" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">honest abstention</text>
  <text x="550" y="622" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#5b6f82">UNRESOLVED envelope</text>

  <rect x="620" y="548" width="400" height="88" rx="12" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="820" y="582" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">NO_MATCH</text>
  <text x="820" y="608" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">candidates rejected conclusively</text>
  <text x="820" y="628" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#5b6f82">RESOLVED envelope</text>

  <rect x="180" y="668" width="740" height="44" rx="8" fill="#fff8e1" stroke="#c9a227" stroke-width="1.5"/>
  <text x="550" y="696" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#1a1a2e">Trap: accepting top-1 retrieval as verified identity</text>

  <text x="550" y="838" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#5b6f82">Design-stage conceptual flow  not execution results.</text>
</svg>
