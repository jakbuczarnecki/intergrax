<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" role="img">
  <title>Verified product identification proof story</title>
  <desc>Incomplete product request against a noisy multi-million-offer catalog through multi-channel retrieval, reranking, evidence verification, and VERIFIED or bounded refusal outcomes.</desc>
  <rect width="1100" height="900" fill="#0d1117"/>
  <rect x="24" y="20" width="1052" height="860" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <text x="550" y="58" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#e6edf3">Verified product identification proof story</text>
  <text x="550" y="84" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">Top search result &#8800; verified product</text>

  <rect x="320" y="108" width="460" height="56" rx="10" fill="#1c2d4a" stroke="#58a6ff" stroke-width="2"/>
  <text x="550" y="134" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Incomplete product request</text>
  <text x="550" y="154" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">natural language &#183; partial ID &#183; compatibility constraints</text>

  <line x1="550" y1="164" x2="550" y2="186" stroke="#e6edf3" stroke-width="2"/>
  <path d="M550 186 L540 172 L560 172 Z" fill="#e6edf3"/>

  <rect x="280" y="190" width="540" height="56" rx="10" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
  <text x="550" y="216" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">3.77M noisy product offers</text>
  <text x="550" y="236" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">heterogeneous IDs &#183; missing fields &#183; near-identical variants</text>

  <line x1="550" y1="246" x2="550" y2="268" stroke="#e6edf3" stroke-width="2"/>
  <path d="M550 268 L540 254 L560 254 Z" fill="#e6edf3"/>

  <rect x="300" y="272" width="500" height="56" rx="10" fill="#3d2f00" stroke="#d29922" stroke-width="2"/>
  <text x="550" y="298" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Several convincing candidates</text>
  <text x="550" y="318" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">semantically similar does not mean materially identical</text>

  <line x1="550" y1="328" x2="550" y2="350" stroke="#e6edf3" stroke-width="2"/>
  <path d="M550 350 L540 336 L560 336 Z" fill="#e6edf3"/>

  <rect x="260" y="354" width="580" height="56" rx="10" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
  <text x="550" y="380" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Multi-channel retrieval + reranking</text>
  <text x="550" y="400" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">exact &#183; lexical &#183; structured &#183; vector &#8594; recall, not identity</text>

  <line x1="550" y1="410" x2="550" y2="432" stroke="#e6edf3" stroke-width="2"/>
  <path d="M550 432 L540 418 L560 418 Z" fill="#e6edf3"/>

  <rect x="300" y="436" width="500" height="56" rx="10" fill="#1c2d4a" stroke="#58a6ff" stroke-width="2"/>
  <text x="550" y="462" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Evidence verification</text>
  <text x="550" y="482" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">material constraints vs source catalog fields</text>

  <line x1="500" y1="492" x2="280" y2="540" stroke="#e6edf3" stroke-width="2"/>
  <line x1="550" y1="492" x2="550" y2="540" stroke="#e6edf3" stroke-width="2"/>
  <line x1="600" y1="492" x2="820" y2="540" stroke="#e6edf3" stroke-width="2"/>
  <path d="M280 540 L292 528 L296 544 Z" fill="#e6edf3"/>
  <path d="M550 540 L540 526 L560 526 Z" fill="#e6edf3"/>
  <path d="M820 540 L808 528 L804 544 Z" fill="#e6edf3"/>

  <rect x="80" y="548" width="400" height="88" rx="12" fill="#1a3324" stroke="#3fb950" stroke-width="2"/>
  <text x="280" y="582" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">VERIFIED</text>
  <text x="280" y="608" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">identity supported by evidence</text>
  <text x="280" y="628" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">RESOLVED envelope</text>

  <rect x="350" y="548" width="400" height="88" rx="12" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
  <text x="550" y="578" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">AMBIGUOUS / INSUFFICIENT</text>
  <text x="550" y="602" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">honest abstention</text>
  <text x="550" y="622" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">UNRESOLVED envelope</text>

  <rect x="620" y="548" width="400" height="88" rx="12" fill="#3d1f24" stroke="#f85149" stroke-width="2"/>
  <text x="820" y="582" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">NO_MATCH</text>
  <text x="820" y="608" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">candidates rejected conclusively</text>
  <text x="820" y="628" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">RESOLVED envelope</text>

  <rect x="180" y="668" width="740" height="44" rx="8" fill="#3d2f00" stroke="#d29922" stroke-width="1.5"/>
  <text x="550" y="696" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Trap: accepting top-1 retrieval as verified identity</text>

  <text x="550" y="838" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">Design-stage conceptual flow  not execution results.</text>
</svg>
