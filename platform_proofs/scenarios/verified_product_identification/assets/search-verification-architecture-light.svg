<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img">
  <title>Search and verification architecture</title>
  <desc>Multi-channel retrieval through hybrid fusion and reranking to identity verification, emphasizing that top-ranked results are not verified identity.</desc>
  <rect width="1100" height="520" fill="#f6f8fb"/>
  <rect x="24" y="20" width="1052" height="480" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <text x="550" y="54" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#1a1a2e">Search + verification architecture</text>
  <text x="550" y="78" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">Independent channels &#8594; fusion &#8594; rerank &#8594; verify</text>

  <rect x="60" y="108" width="140" height="48" rx="8" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="130" y="138" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#1a1a2e">User query</text>

  <line x1="200" y1="132" x2="230" y2="132" stroke="#1a1a2e" stroke-width="2"/>
  <path d="M230 132 L218 126 L218 138 Z" fill="#1a1a2e"/>

  <rect x="232" y="108" width="180" height="48" rx="8" fill="#f0f4f8" stroke="#5b6f82" stroke-width="2"/>
  <text x="322" y="138" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#1a1a2e">Query understanding</text>

  <line x1="412" y1="132" x2="442" y2="132" stroke="#1a1a2e" stroke-width="2"/>
  <path d="M442 132 L430 126 L430 138 Z" fill="#1a1a2e"/>

  <rect x="444" y="96" width="120" height="40" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="504" y="122" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1a1a2e">EXACT</text>

  <rect x="444" y="142" width="120" height="40" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="504" y="168" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1a1a2e">LEXICAL</text>

  <rect x="576" y="96" width="120" height="40" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="636" y="122" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#1a1a2e">STRUCTURED</text>

  <rect x="576" y="142" width="120" height="40" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="636" y="168" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1a1a2e">VECTOR</text>

  <line x1="696" y1="132" x2="726" y2="132" stroke="#1a1a2e" stroke-width="2"/>
  <path d="M726 132 L714 126 L714 138 Z" fill="#1a1a2e"/>

  <rect x="728" y="108" width="140" height="48" rx="8" fill="#fff8e1" stroke="#c9a227" stroke-width="2"/>
  <text x="798" y="130" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1a1a2e">Hybrid</text>
  <text x="798" y="146" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1a1a2e">fusion</text>

  <line x1="868" y1="132" x2="898" y2="132" stroke="#1a1a2e" stroke-width="2"/>
  <path d="M898 132 L886 126 L886 138 Z" fill="#1a1a2e"/>

  <rect x="900" y="108" width="120" height="48" rx="8" fill="#f0f4f8" stroke="#5b6f82" stroke-width="2"/>
  <text x="960" y="138" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#1a1a2e">Reranker</text>

  <line x1="960" y1="156" x2="960" y2="250" stroke="#1a1a2e" stroke-width="2"/>
  <path d="M960 250 L954 238 L966 238 Z" fill="#1a1a2e"/>

  <rect x="820" y="252" width="280" height="64" rx="10" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="960" y="280" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#1a1a2e">Identity verification</text>
  <text x="960" y="302" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#5b6f82">evidence vs material constraints</text>

  <line x1="820" y1="284" x2="420" y2="284" stroke="#c62828" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="620" y="272" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#c62828">TOP-RANKED &#8800; VERIFIED</text>

  <rect x="80" y="360" width="200" height="56" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="180" y="392" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1a1a2e">VERIFIED</text>

  <rect x="320" y="360" width="200" height="56" rx="10" fill="#f0f4f8" stroke="#5b6f82" stroke-width="2"/>
  <text x="420" y="386" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1a1a2e">AMBIGUOUS /</text>
  <text x="420" y="404" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1a1a2e">INSUFFICIENT</text>

  <rect x="560" y="360" width="200" height="56" rx="10" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="660" y="392" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1a1a2e">NO_MATCH</text>

  <rect x="800" y="360" width="220" height="56" rx="10" fill="#fff8e1" stroke="#c9a227" stroke-width="1.5"/>
  <text x="910" y="386" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#3d4f66">Source truth: record_json</text>
  <text x="910" y="404" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#3d4f66">Derived indexes: search only</text>

  <text x="550" y="478" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#5b6f82">Design-stage reference architecture  not execution results.</text>
</svg>
