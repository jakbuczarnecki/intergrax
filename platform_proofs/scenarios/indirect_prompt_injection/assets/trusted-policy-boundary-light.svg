<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img">
  <title>Trusted policy boundary</title>
  <desc>Untrusted external data may influence model reasoning and tool proposals but cannot reconfigure trusted governance and execution boundaries.</desc>
  <rect width="1100" height="680" fill="#f6f8fb"/>
  <rect x="24" y="20" width="1052" height="640" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <text x="550" y="56" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#1a1a2e">Trusted policy boundary</text>
  <text x="550" y="82" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">Two worlds  influence vs governance</text>

  <rect x="48" y="108" width="480" height="480" rx="14" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="288" y="144" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#c62828">UNTRUSTED DATA</text>

  <rect x="88" y="164" width="400" height="36" rx="8" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/>
  <text x="288" y="188" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#1a1a2e">order notes</text>

  <rect x="88" y="210" width="400" height="36" rx="8" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/>
  <text x="288" y="234" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#1a1a2e">API fields</text>

  <rect x="88" y="256" width="400" height="36" rx="8" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/>
  <text x="288" y="280" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#1a1a2e">external documents</text>

  <rect x="88" y="302" width="400" height="36" rx="8" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/>
  <text x="288" y="326" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#1a1a2e">support content</text>

  <rect x="88" y="348" width="400" height="36" rx="8" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/>
  <text x="288" y="372" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#1a1a2e">malicious instructions</text>

  <line x1="288" y1="396" x2="288" y2="420" stroke="#c62828" stroke-width="2"/>
  <path d="M288 420 L280 406 L296 406 Z" fill="#c62828"/>

  <rect x="88" y="424" width="400" height="52" rx="8" fill="#fff8e1" stroke="#c9a227" stroke-width="1.5"/>
  <text x="288" y="448" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#1a1a2e">may influence</text>
  <text x="288" y="466" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#5b6f82">LLM reasoning / tool proposal</text>

  <text x="288" y="520" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#5b6f82">Data enters the model context</text>
  <text x="288" y="540" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#5b6f82">and may shape what it proposes</text>

  <rect x="572" y="108" width="480" height="480" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="812" y="144" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#2e7d32">TRUSTED GOVERNANCE</text>

  <rect x="612" y="164" width="400" height="36" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="812" y="188" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#1a1a2e">runtime policy bundle</text>

  <rect x="612" y="210" width="400" height="36" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="812" y="234" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#1a1a2e">DeclarativePolicyEnforcer</text>

  <rect x="612" y="256" width="400" height="36" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="812" y="280" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#1a1a2e">RuntimeToolInvoker</text>

  <rect x="612" y="302" width="400" height="36" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="812" y="326" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#1a1a2e">governance configuration</text>

  <line x1="812" y1="348" x2="812" y2="372" stroke="#2e7d32" stroke-width="2"/>
  <path d="M812 372 L804 358 L820 358 Z" fill="#2e7d32"/>

  <rect x="612" y="376" width="400" height="52" rx="8" fill="#eef4ff" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="812" y="400" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#1a1a2e">cannot be reconfigured</text>
  <text x="812" y="418" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#5b6f82">by untrusted retrieved content</text>

  <text x="812" y="468" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#5b6f82">Policy is loaded by trusted host</text>
  <text x="812" y="488" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#5b6f82">before model or data influence</text>

  <line x1="488" y1="348" x2="572" y2="348" stroke="#1a1a2e" stroke-width="2.5"/>
  <line x1="572" y1="348" x2="572" y2="320" stroke="#1a1a2e" stroke-width="2.5"/>
  <line x1="572" y1="320" x2="488" y2="320" stroke="#1a1a2e" stroke-width="2.5"/>
  <text x="530" y="312" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#c62828">&#10005;</text>
  <text x="530" y="368" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#5b6f82">no reconfiguration</text>

  <rect x="180" y="600" width="740" height="44" rx="10" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="550" y="628" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1a1a2e">DATA MAY INFLUENCE THE MODEL. DATA CANNOT RECONFIGURE GOVERNANCE.</text>

  <text x="550" y="662" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#5b6f82">Conceptual boundary  design stage, not execution results.</text>
</svg>
