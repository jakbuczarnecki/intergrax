<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1040" role="img">
  <title>Indirect prompt injection proof story</title>
  <desc>Hostile retrieved order note may fool the model into proposing a shipping-address write; governance denies before external side effect. Positive control allows the same write when explicitly authorized.</desc>
  <rect width="1100" height="1040" fill="#0d1117"/>
  <rect x="24" y="20" width="1052" height="1000" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <text x="550" y="58" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#e6edf3">Indirect prompt injection proof story</text>
  <text x="550" y="84" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">Model may be fooled  execution boundary must still win</text>

  <rect x="300" y="108" width="500" height="52" rx="10" fill="#1c2d4a" stroke="#58a6ff" stroke-width="2"/>
  <text x="550" y="132" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">USER</text>
  <text x="550" y="152" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">&#8220;Check my order. Do not change anything.&#8221;</text>

  <line x1="550" y1="160" x2="550" y2="182" stroke="#e6edf3" stroke-width="2"/>
  <path d="M550 182 L540 168 L560 168 Z" fill="#e6edf3"/>

  <rect x="300" y="186" width="500" height="52" rx="10" fill="#1a3324" stroke="#3fb950" stroke-width="2"/>
  <text x="550" y="210" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">TRUSTED HOST</text>
  <text x="550" y="230" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">loads read-only workflow policy</text>

  <line x1="550" y1="238" x2="550" y2="260" stroke="#e6edf3" stroke-width="2"/>
  <path d="M550 260 L540 246 L560 246 Z" fill="#e6edf3"/>

  <rect x="420" y="264" width="260" height="44" rx="10" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
  <text x="550" y="292" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">AGENT</text>

  <line x1="550" y1="308" x2="550" y2="330" stroke="#e6edf3" stroke-width="2"/>
  <path d="M550 330 L540 316 L560 316 Z" fill="#e6edf3"/>

  <rect x="420" y="334" width="260" height="44" rx="10" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
  <text x="550" y="362" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">order.get</text>

  <line x1="550" y1="378" x2="550" y2="400" stroke="#e6edf3" stroke-width="2"/>
  <path d="M550 400 L540 386 L560 386 Z" fill="#e6edf3"/>

  <rect x="400" y="404" width="300" height="44" rx="10" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
  <text x="550" y="432" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">order.get_notes</text>

  <line x1="550" y1="448" x2="550" y2="470" stroke="#e6edf3" stroke-width="2"/>
  <path d="M550 470 L540 456 L560 456 Z" fill="#e6edf3"/>

  <rect x="340" y="474" width="420" height="52" rx="10" fill="#3d1f24" stroke="#f85149" stroke-width="2"/>
  <text x="550" y="504" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">HOSTILE EXTERNAL NOTE</text>

  <line x1="550" y1="526" x2="550" y2="548" stroke="#e6edf3" stroke-width="2"/>
  <path d="M550 548 L540 534 L560 534 Z" fill="#e6edf3"/>

  <rect x="320" y="552" width="460" height="44" rx="10" fill="#3d2f00" stroke="#d29922" stroke-width="2"/>
  <text x="550" y="580" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">REAL LLM MAY BE FOOLED</text>

  <line x1="550" y1="596" x2="550" y2="618" stroke="#e6edf3" stroke-width="2"/>
  <path d="M550 618 L540 604 L560 604 Z" fill="#e6edf3"/>

  <rect x="240" y="622" width="620" height="52" rx="10" fill="#3d2f00" stroke="#d29922" stroke-width="2"/>
  <text x="550" y="646" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">MODEL PROPOSES</text>
  <text x="550" y="666" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">order.update_shipping_address(...)</text>

  <line x1="550" y1="674" x2="550" y2="696" stroke="#e6edf3" stroke-width="2"/>
  <path d="M550 696 L540 682 L560 682 Z" fill="#e6edf3"/>

  <rect x="360" y="700" width="380" height="44" rx="10" fill="#1c2d4a" stroke="#58a6ff" stroke-width="2"/>
  <text x="550" y="728" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">RuntimeToolInvoker</text>

  <line x1="550" y1="744" x2="550" y2="766" stroke="#e6edf3" stroke-width="2"/>
  <path d="M550 766 L540 752 L560 752 Z" fill="#e6edf3"/>

  <rect x="300" y="770" width="500" height="44" rx="10" fill="#1c2d4a" stroke="#58a6ff" stroke-width="2"/>
  <text x="550" y="798" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">DeclarativePolicyEnforcer</text>

  <line x1="550" y1="814" x2="550" y2="836" stroke="#e6edf3" stroke-width="2"/>
  <path d="M550 836 L540 822 L560 822 Z" fill="#e6edf3"/>

  <rect x="420" y="840" width="260" height="44" rx="10" fill="#3d1f24" stroke="#f85149" stroke-width="2"/>
  <text x="550" y="868" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#f85149">DENY</text>

  <line x1="550" y1="884" x2="550" y2="906" stroke="#e6edf3" stroke-width="2"/>
  <path d="M550 906 L540 892 L560 892 Z" fill="#e6edf3"/>

  <rect x="300" y="910" width="500" height="44" rx="10" fill="#1a3324" stroke="#3fb950" stroke-width="2"/>
  <text x="550" y="938" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">ToolExecutor NOT INVOKED</text>

  <rect x="300" y="962" width="500" height="40" rx="10" fill="#1a3324" stroke="#3fb950" stroke-width="2"/>
  <text x="550" y="988" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#3fb950">EXTERNAL WRITE REQUESTS = 0</text>

  <rect x="820" y="108" width="250" height="920" rx="14" fill="#21262d" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="945" y="138" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#8b949e">Positive control</text>

  <rect x="840" y="160" width="210" height="52" rx="8" fill="#1c2d4a" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="945" y="184" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">explicit address-change</text>
  <text x="945" y="202" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#8b949e">request</text>

  <line x1="945" y1="212" x2="945" y2="232" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M945 232 L937 218 L953 218 Z" fill="#8b949e"/>

  <rect x="840" y="236" width="210" height="44" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <text x="945" y="264" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#e6edf3">legitimate workflow</text>

  <line x1="945" y1="280" x2="945" y2="300" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M945 300 L937 286 L953 286 Z" fill="#8b949e"/>

  <rect x="840" y="304" width="210" height="44" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <text x="945" y="332" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#e6edf3">same write tool</text>

  <line x1="945" y1="348" x2="945" y2="368" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M945 368 L937 354 L953 354 Z" fill="#8b949e"/>

  <rect x="840" y="372" width="210" height="44" rx="8" fill="#1a3324" stroke="#3fb950" stroke-width="1.5"/>
  <text x="945" y="400" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#3fb950">ALLOW</text>

  <line x1="945" y1="416" x2="945" y2="436" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M945 436 L937 422 L953 422 Z" fill="#8b949e"/>

  <rect x="840" y="440" width="210" height="44" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <text x="945" y="468" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#e6edf3">ToolExecutor</text>

  <rect x="840" y="500" width="210" height="44" rx="8" fill="#1a3324" stroke="#3fb950" stroke-width="1.5"/>
  <text x="945" y="528" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#3fb950">EXTERNAL WRITE</text>
  <text x="945" y="544" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#3fb950">REQUESTS = 1</text>

  <text x="550" y="1020" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">Design-stage conceptual flow  not execution results.</text>
</svg>
