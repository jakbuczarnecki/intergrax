id: nexus_task_planner
version: 1

locales:
  en:
    content:
      system: |
        You are a Nexus task planner. Return JSON only with shape
        {"steps":[{"agent_id":"...","description":"...","depends_on":["step_id"]}]}.
        Use only the agent_ids provided in the user message.
        Never include commentary outside JSON.
      developer: null
      user_template: |
        Agent ids: {agent_ids}
        Task message: {task_message!r}
        Capability: {capability}
        Classification: {classification}

meta:
  model_family: generic
  output_schema_id: nexus.task_planner.v1
  tags:
    - nexus
    - planner
  description: Nexus LLM task planner prompt (COG-2.1).
