version: 1
fallback_default: 32000

provider_defaults:
  openai: 128000
  claude: 200000
  gemini: 1000000
  vertex_gemini: 1000000
  mistral: 32000
  ollama: 8192
  groq: 128000
  vllm: 32768
  together: 128000
  fireworks: 128000
  openrouter: 128000
  deepseek: 64000
  xai: 131072
  cohere: 128000
  cohere_native: 128000
  azure_openai: 128000
  azure_ai_inference: 128000
  aws_bedrock: 200000
  llama_cpp: 8192

prefix_rules:
  - prefix: "claude-"
    context_window_tokens: 200000
  - prefix: "gpt-"
    context_window_tokens: 128000
  - prefix: "o1-"
    context_window_tokens: 200000
  - prefix: "o3-"
    context_window_tokens: 200000
  - prefix: "gemini-1.5"
    context_window_tokens: 1000000
  - prefix: "gemini-2"
    context_window_tokens: 1000000
  - prefix: "gemini-"
    context_window_tokens: 128000
  - prefix: "anthropic.claude"
    context_window_tokens: 200000
  - prefix: "anthropic."
    context_window_tokens: 200000
  - prefix: "meta.llama"
    context_window_tokens: 128000
  - prefix: "meta-llama/"
    context_window_tokens: 128000
  - prefix: "mistral."
    context_window_tokens: 128000
  - prefix: "llama3.1"
    context_window_tokens: 16384
  - prefix: "llama3"
    context_window_tokens: 8192
  - prefix: "qwen2.5"
    context_window_tokens: 32768
  - prefix: "qwen2"
    context_window_tokens: 32768
  - prefix: "openai/"
    context_window_tokens: 128000
  - prefix: "anthropic/"
    context_window_tokens: 200000
  - prefix: "google/"
    context_window_tokens: 1000000

models:
