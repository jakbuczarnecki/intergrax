[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["intergrax"]

[project]
name = "Intergrax-ai"
version = "0.1.0"
description = "Source-available Harness AI / Agent OS for teams building governed agent applications - with Nexus orchestration, policy-controlled tools, RAG, memory, trace/evidence, HITL, and runtime boundaries."
readme = "README.md"
license = { text = "Intergrax Evaluation and Collaboration License 1.0" }
requires-python = ">=3.12,<3.13"
keywords = [
  "harness-ai",
  "agent-os",
  "ai-agents",
  "agentic-ai",
  "multi-agent-systems",
  "agent-orchestration",
  "agent-framework",
  "llm",
  "rag",
  "mcp",
  "tool-use",
  "policy-engine",
  "human-in-the-loop",
  "ai-governance",
  "ai-observability",
  "observability",
  "attestation",
  "traceability",
  "source-available",
  "python",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  # -----------------
  # Runtime / Server
  # -----------------
  "torch==2.2.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "starlette>=0.41",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "cryptography>=42.0",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  # -----------------
  # LLM providers
  # -----------------
  "openai>=1.0",
  "anthropic>=0.25",
  "mistralai>=0.4",
  "ollama>=0.1",
  "tiktoken>=0.7",
  "boto3>=1.34",
  "botocore>=1.34",
  "mypy-boto3-bedrock-runtime>=1.34",
  "google-genai>=0.3",
  "cohere>=5.5",
  # -----------------
  # Orchestration
  # -----------------
  "langchain-core>=0.3,<2.0",
  "langchain-openai>=0.3,<2.0",
  "langchain-ollama>=0.2,<2.0",
  # -----------------
  # RAG / Vector DBs
  # -----------------
  "chromadb==1.4.1",
  "qdrant-client>=1.9",
  "pinecone>=3.0",
  "sentence-transformers>=3.0",
  # -----------------
  # Data / parsing
  # -----------------
  "numpy==1.26.4",
  "pandas>=2.1.4,<3.0.0",
  "beautifulsoup4>=4.12",
  "trafilatura>=1.8",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "pytesseract>=0.3",
  "pillow>=11.0",
  "PyMuPDF>=1.23",
  "requests-cache>=1.2",
  # -----------------
  # Media / ingestion
  # -----------------
  "whisper>=1.1",
  "yt-dlp>=2024.0",
  "webvtt-py>=0.4",
  "opencv-python-headless==4.9.0.80",
  "chardet>=5.2,<6",
  # -----------------
  # UI
  # -----------------
  "streamlit>=1.39",
  "fastmcp>=3.3.1",
  "mcp>=1.0",
]

[dependency-groups]
# Keep the default test runner self-contained on a fresh checkout.
# Heavy optional development integrations remain in the explicit ``dev`` extra.
test = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=0.23,<0.24",
]
quality = [
  "ruff",
  "pyright",
]

[tool.uv]
# Resolve for CI (linux) and local dev (win32). Do not restrict to a single OS.
environments = [
  "sys_platform == 'linux'",
  "sys_platform == 'win32'",
]
# ``uv run pytest`` must not fall through to a globally installed pytest.
default-groups = ["test", "quality"]

[tool.uv.workspace]
# Explicit member list — excludes applications/build and non-project folders.
members = [
  "applications/attestation_demo",
  "applications/dispute_sim_application",
  "applications/governed_contractor_application",
  "applications/intergrax_assistant_application",
  "applications/lab_application",
  "applications/legal_application",
  "applications/local_workspace_application",
  "applications/poc_template_application",
  "applications/research_application",
  "agents/boundary_demo",
  "agents/dispute_analyst",
  "agents/dispute_intake",
  "agents/dispute_scenario",
  "agents/dispute_strategist",
  "agents/echo",
  "agents/external_contractor_adapter",
  "agents/intergrax_assistant",
  "agents/lab",
  "agents/legal",
  "agents/local_indexer",
  "agents/local_search",
  "agents/local_synthesizer",
  "agents/organization_worker",
  "agents/problem_radar",
  "agents/research",
  "agents/signoff_probe",
  "agents/vendor_discovery",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }


[project.scripts]
intergrax = "intergrax.cli.main:main"

[project.entry-points."intergrax.context"]
builtin = "intergrax.context.providers.builtin:BuiltinContextPlugin"

[project.optional-dependencies]
rag-langchain-loaders = [
  "langchain-community>=0.3,<0.5",
]
rag-langchain-embeddings = [
  "langchain-ollama>=0.2,<2.0",
]
rag-langchain-splitters = [
  "langchain-text-splitters>=0.3,<2.0",
]
harness-author = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
]
# Optional legacy adapters only — not required for Nexus / Harness runtime.
langgraph-legacy = ["langgraph>=0.0.40"]
# Minimal LLM provider subsets (core package still installs all providers by default).
llm-openai = ["openai>=1.0", "tiktoken>=0.7"]
llm-anthropic = ["anthropic>=0.25", "tiktoken>=0.7"]
llm-mistral = ["mistralai>=0.4", "tiktoken>=0.7"]
llm-ollama = ["ollama>=0.1", "langchain-ollama>=0.2,<2.0", "langchain-core>=0.3,<2.0", "tiktoken>=0.7"]
llm-gemini = ["google-genai>=0.3", "tiktoken>=0.7"]
llm-bedrock = ["boto3>=1.34", "botocore>=1.34", "mypy-boto3-bedrock-runtime>=1.34", "tiktoken>=0.7"]
llm-groq = ["openai>=1.0", "tiktoken>=0.7"]
llm-vllm = ["openai>=1.0", "tiktoken>=0.7"]
llm-compat = ["openai>=1.0", "tiktoken>=0.7"]
llm-vertex = ["google-genai>=0.3", "tiktoken>=0.7"]
llm-cohere-native = ["cohere>=5.5", "tiktoken>=0.7"]
llm-all = [
  "openai>=1.0",
  "anthropic>=0.25",
  "mistralai>=0.4",
  "ollama>=0.1",
  "google-genai>=0.3",
  "boto3>=1.34",
  "botocore>=1.34",
  "mypy-boto3-bedrock-runtime>=1.34",
  "langchain-ollama>=0.2,<2.0",
  "tiktoken>=0.7",
]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=0.23,<0.24",
  "ruff",
  "pyright",
  "redis>=5.0",
  "celery>=5.3",
  "confluent-kafka>=2.3.0",
  "pika>=1.3.2",
  "psycopg[binary]>=3.1",
  "pymysql>=1.1",
  "cassandra-driver>=3.29",
  "azure-identity>=1.19",
  "google-auth>=2.29",
  "databricks-sql-connector>=3.6",
  "pymongo>=4.6",
  "docx2txt>=0.8",
  "unstructured>=0.12",
  "docling[all]==2.76.0",
]
# Minimal deps for GitHub Actions regression gate (no docling / unstructured / linters).
dev-ci = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=0.23,<0.24",
  "pytest-xdist>=3.6,<4",
  "redis>=5.0",
  "celery>=5.3",
]
integrations-sentry = ["sentry-sdk>=2.0"]
integrations-kafka = [
  "confluent-kafka>=2.3.0",
  "redis>=5.0",
]
integrations-mongodb = ["pymongo>=4.6"]
integrations-harness = [
  "sentry-sdk>=2.0",
]
# Optional vendor SDKs for M.12 — install manually when needed (heavy torch/transformers
# conflict with pinned docling/torch). Runtime uses pattern fallback without these packages.
integrations-guardrails = [
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
]
integrations-slack = [
  "slack-sdk>=3.33.4",
  "aiohttp>=3.9",
]

[tool.pytest.ini_options]
testpaths = ["tests", "applications", "agents"]
# Application tests live under ``applications/<app>/tests/`` (discovered via ``testpaths`` ``applications``).
# Repo root on sys.path; Tier-2 product roots are added in repo conftest.py.
pythonpath = [".", "agents", "applications"]
asyncio_mode = "auto"
# Windows: avoid PermissionError on %TEMP%/pytest-of-* (AV/ACL locks). ``build/`` is gitignored.
cache_dir = "build/pytest-cache"

addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--basetemp=build/pytest-basetemp",
  "--import-mode=importlib",
]

markers = [
  "unit: Fast deterministic unit tests (no network, no filesystem side effects).",
  "integration: Deterministic component/integration tests (no network; runtime-level wiring).",
  "network: Tests requiring real external services (LLM APIs, websearch, tools). Not for PR CI.",
  "e2e: End-to-end flows (very few; production-like).",
  "asyncio: Async tests using pytest-asyncio.",
  "gate: Minimal pre-P4.2 regression gate (deterministic, no network).",
  "ci_smoke: Lightweight representative subset for PR/merge CI (<~30s).",
  "no_ci: Excluded from GitHub CI — infra-heavy (FastAPI, SQLite, MCP, sleeps, threading).",
  "agent_os: Agent OS acceptance scenarios (Phase L.5); included in gate.",
  "tier3_scenario: Tier-3 UC-A* scenario matrix coverage (APP-CON-7).",
  "vectorstore_soak: RAG vector-store prod SLO soak against real backends (M-RAG.30); skipped when service unreachable.",
]

filterwarnings = [
  # Keep deprecations visible by default (we'll tighten later)
  "default::DeprecationWarning",
  "default::PendingDeprecationWarning",
  "ignore::requests.exceptions.RequestsDependencyWarning",
  "ignore:intergrax.legacy.rag_answers is archived:DeprecationWarning",

  # Silence known noisy SWIG deprecations seen on Windows (PyMuPDF/fitz and similar).
  "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
