[project]
name = "Intergrax-ai"
version = "0.1.0"
description = "Intergrax is a modular AI runtime and orchestration framework for building deterministic, enterprise-grade AI agents, pipelines, and knowledge-driven systems. It provides a typed execution engine, planning and loop controllers, memory and RAG integration, and production-ready diagnostics for safe and observable AI applications."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  # -----------------
  # Runtime / Server
  # -----------------
  "torch==2.2.2",
  "fastapi>=0.115",
  "starlette>=0.41",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "tqdm>=4.66",

  # -----------------
  # LLM providers
  # -----------------
  "openai>=1.0",
  "anthropic>=0.25",
  "mistralai>=0.4",
  "ollama>=0.1",
  "tiktoken>=0.7",
  "boto3>=1.34",
  "botocore>=1.34",
  "mypy-boto3-bedrock-runtime>=1.34",
  "google-genai>=0.3",
  "cohere>=5.5",

  # -----------------
  # Orchestration
  # -----------------
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langchain-community>=0.3",
  "langchain-openai>=0.3",
  "langchain-ollama>=0.2",
  "langchain-text-splitters>=0.3",
  "langgraph>=0.0.40",

  # -----------------
  # RAG / Vector DBs
  # -----------------
  "chromadb==1.4.1",
  "qdrant-client>=1.9",
  "pinecone>=3.0",
  "sentence-transformers>=3.0",

  # -----------------
  # Data / parsing
  # -----------------
  "numpy==1.26.4",
  "pandas>=2.1.4,<3.0.0",
  "beautifulsoup4>=4.12",
  "trafilatura>=1.8",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "pytesseract>=0.3",
  "pillow>=11.0",
  "PyMuPDF>=1.23",
  "requests-cache>=1.2",
  "tavily-python>=0.5",

  # -----------------
  # Media / ingestion
  # -----------------
  "whisper>=1.1",
  "yt-dlp>=2024.0",
  "webvtt-py>=0.4",
  "opencv-python-headless==4.9.0.80",
  "chardet>=5.2",

  # -----------------
  # UI
  # -----------------
  "streamlit>=1.39",    
]

[tool.uv]
environments = ["sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }


[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=0.23,<0.24",
  "ruff",
  "pyright",
  "redis>=5.0",
  "celery>=5.3",
  "confluent-kafka>=2.3.0",
  "pika>=1.3.2",
  "docx2txt>=0.8",
  "unstructured>=0.12",
  "docling[all]==2.76.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]

markers = [
  "unit: Fast deterministic unit tests (no network, no filesystem side effects).",
  "integration: Deterministic component/integration tests (no network; runtime-level wiring).",
  "network: Tests requiring real external services (LLM APIs, websearch, tools). Not for PR CI.",
  "e2e: End-to-end flows (very few; production-like).",
  "asyncio: Async tests using pytest-asyncio.",
]

filterwarnings = [
  # Keep deprecations visible by default (we'll tighten later)
  "default::DeprecationWarning",
  "default::PendingDeprecationWarning",

  # Silence known noisy SWIG deprecations seen on Windows (PyMuPDF/fitz and similar).
  "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]