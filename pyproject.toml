[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["intergrax"]

[project]
name = "Intergrax-ai"
version = "0.1.0"
description = "Source-available Harness AI / Agent OS for teams building governed agent applications - with Nexus orchestration, policy-controlled tools, RAG, memory, trace/evidence, HITL, and runtime boundaries."
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12,<3.13"
keywords = [
  "harness-ai",
  "agent-os",
  "ai-agents",
  "agentic-ai",
  "multi-agent-systems",
  "agent-orchestration",
  "agent-framework",
  "llm",
  "rag",
  "mcp",
  "tool-use",
  "policy-engine",
  "human-in-the-loop",
  "ai-governance",
  "ai-observability",
  "observability",
  "attestation",
  "traceability",
  "source-available",
  "python",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  # -----------------
  # Runtime / Server
  # -----------------
  "torch==2.2.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "starlette>=0.41",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "cryptography>=42.0",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  # -----------------
  # LLM providers
  # -----------------
  "openai>=1.0",
  "anthropic>=0.25",
  "mistralai>=0.4",
  "ollama>=0.1",
  "tiktoken>=0.7",
  "boto3>=1.34",
  "botocore>=1.34",
  "mypy-boto3-bedrock-runtime>=1.34",
  "google-genai>=0.3",
  "cohere>=5.5",
  # -----------------
  # Orchestration
  # -----------------
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langchain-community>=0.3",
  "langchain-openai>=0.3",
  "langchain-ollama>=0.2",
  "langchain-text-splitters>=0.3",
  # -----------------
  # RAG / Vector DBs
  # -----------------
  "chromadb==1.4.1",
  "qdrant-client>=1.9",
  "pinecone>=3.0",
  "sentence-transformers>=3.0",
  # -----------------
  # Data / parsing
  # -----------------
  "numpy==1.26.4",
  "pandas>=2.1.4,<3.0.0",
  "beautifulsoup4>=4.12",
  "trafilatura>=1.8",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "pytesseract>=0.3",
  "pillow>=11.0",
  "PyMuPDF>=1.23",
  "requests-cache>=1.2",
  # -----------------
  # Media / ingestion
  # -----------------
  "whisper>=1.1",
  "yt-dlp>=2024.0",
  "webvtt-py>=0.4",
  "opencv-python-headless==4.9.0.80",
  "chardet>=5.2,<6",
  # -----------------
  # UI
  # -----------------
  "streamlit>=1.39",
  "fastmcp>=3.3.1",
  "mcp>=1.0",
]

[tool.uv]
# Resolve for CI (linux) and local dev (win32). Do not restrict to a single OS.
environments = [
  "sys_platform == 'linux'",
  "sys_platform == 'win32'",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }


[project.scripts]
intergrax = "intergrax.cli:main"
