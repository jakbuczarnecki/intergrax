schema_version: 1
status: active
purpose: >-
  Structured source data for maintainer-curated public GitHub issue drafts.
  This single canonical file defines active and expanded public-adoption issue waves.
  It does not create GitHub Issues by itself.

safety:
  creates_real_github_issues: false
  requires_explicit_apply_flag: true
  dry_run_should_be_default: true
  source_available_proprietary_notice_required: true
  do_not_create:
    - production_support_issues
    - sla_or_support_commitment_issues
    - commercial_use_permission_issues
    - redistribution_or_derivative_work_permission_issues
    - public_security_vulnerability_reports
    - broad_feature_request_issues_detached_from_architecture_or_product_validation_scope
    - help_wanted_or_good_first_issue_tasks
    - hosted_saas_or_pricing_issues

waves:
  wave_1:
    description: >-
      First curated public issue wave for proof-path feedback, documentation clarity,
      evidence and trace inspection, attestation feedback, and qualified design-partner discovery.
    open_now: true
    labels_policy: use_existing_template_labels_only
    issues:
      - id: readme-quick-start
        order: 1
        github_issue_number: 186
        github_issue_url: https://github.com/jakbuczarnecki/intergrax/issues/186
        title: "Proof path feedback: README quick start"
        template: proof_path_feedback.yml
        labels: [feedback, triage]
        category: proof_path_feedback
        primary_audience: [first-time evaluator, platform engineer, technical reviewer]
        goal: Validate whether an external evaluator can follow the README quick start path without internal project knowledge.
        risk: low
        body: |
          ## Purpose

          We are looking for first-run feedback from external evaluators following the README quick start path.

          Please report where the path was clear, where it was unclear, and which command or expectation did not match your environment.

          ## Useful feedback

          - which steps worked as expected
          - where the instructions became unclear
          - which command failed, if any
          - relevant command output, with secrets redacted
          - your environment: OS, Python version, uv version, branch or commit
          - what would make the first-run path easier to evaluate

          ## Out of scope

          This issue is not for production support, commercial use requests, broad feature requests, license debates, security vulnerabilities, or requests for free implementation work.

          Intergrax is source-available/proprietary. Evaluation feedback does not grant production, redistribution, derivative-work, commercial-use, or support rights.

      - id: first-time-evaluator-docs
        order: 2
        github_issue_number: 187
        github_issue_url: https://github.com/jakbuczarnecki/intergrax/issues/187
        title: "Documentation clarity: first-time evaluator path"
        template: documentation_feedback.yml
        labels: [documentation, triage]
        category: documentation_clarity
        primary_audience: [first-time evaluator, AI systems architect, technical reviewer, potential design partner]
        goal: Validate whether the public repository clearly explains what Intergrax is, what it is not, who it is for, and where an evaluator should start.
        risk: low
        body: |
          ## Purpose

          We are looking for documentation feedback from first-time evaluators.

          Please share where the project became clear, where it became confusing, and whether the distinction between agent, harness, Nexus, application, policy, trace, and evidence was understandable.

          ## Useful feedback

          - the first document you opened
          - where the project became clear
          - where the project became confusing
          - which term, diagram, or boundary was hardest to understand
          - whether the source-available/proprietary collaboration model was clear
          - what link, section, diagram, or wording would improve the first-time evaluator path

          ## Out of scope

          This issue is not for broad feature requests, production support, commercial use requests, license debates, implementation tasks, or general product brainstorming.

          Intergrax is source-available/proprietary. Documentation feedback does not create partnership, support, production-use, commercial-use, redistribution, or derivative-work rights.

      - id: evidence-trace-inspection
        order: 3
        github_issue_number: 188
        github_issue_url: https://github.com/jakbuczarnecki/intergrax/issues/188
        title: "Proof path feedback: evidence and trace inspection"
        template: proof_path_feedback.yml
        labels: [feedback, triage]
        category: proof_path_feedback
        primary_audience: [platform engineer, observability builder, governance engineer, technical reviewer]
        goal: Validate whether trace and evidence outputs are understandable to external reviewers.
        risk: medium
        body: |
          ## Purpose

          We are looking for feedback on the public trace and evidence inspection path.

          Please inspect available trace or evidence outputs and report whether an external evaluator can understand what happened during a run, which records were produced, and which fields need better explanation.

          ## Useful feedback

          - which trace or evidence output you inspected
          - whether the output was understandable without internal project knowledge
          - which fields were clear or unclear
          - whether ordering, lineage, run identifiers, or step identifiers were understandable
          - what diagram, example, or field explanation would make inspection easier

          ## Out of scope

          This issue is not a production audit request, compliance attestation request, production certification claim, commercial use request, or broad observability feature request.

          Intergrax is source-available/proprietary. Feedback does not grant production, redistribution, derivative-work, commercial-use, or support rights.

      - id: boundaryattest-case-study-feedback
        order: 4
        github_issue_number: 189
        github_issue_url: https://github.com/jakbuczarnecki/intergrax/issues/189
        title: "Attestation integration feedback: BoundaryAttest case study"
        template: integration_proposal.yml
        labels: [integration, triage]
        category: attestation_boundary_events_feedback
        primary_audience: [attestation integrator, auditability builder, governance engineer, security-oriented platform engineer]
        goal: Collect technical feedback on the BoundaryAttest case study and Intergrax Execution Boundary Export pattern.
        risk: medium_high
        body: |
          ## Purpose

          We are looking for technical feedback on the BoundaryAttest attestation case study and the Intergrax Execution Boundary Export pattern.

          Please focus on trust model clarity, boundary event shape, receipt mapping, signature or verification explanation, and the separation between Intergrax host claims and external partner claims.

          ## Useful feedback

          - whether the event/receipt boundary is clear
          - whether the host-attestation role is clear
          - whether the case study avoids overclaiming
          - which terms or fields need better explanation
          - what diagram, example, field table, or verification note would help

          ## Out of scope

          This issue is not for security vulnerability disclosure, production deployment requests, commercial licensing requests, compliance certification requests, broad feature requests, or requests to bundle external projects.

          Intergrax is source-available/proprietary. Feedback does not grant production, redistribution, derivative-work, commercial-use, or support rights.

      - id: governed-agent-applications-design-partner
        order: 5
        github_issue_number: 190
        github_issue_url: https://github.com/jakbuczarnecki/intergrax/issues/190
        title: "Design partner interest: governed agent applications"
        template: design_partner_interest.yml
        labels: [design-partner, triage]
        category: design_partner_interest
        primary_audience: [AI product teams, platform teams, agent application builders, governance-focused teams, potential design partners]
        goal: Create a controlled public entry point for people or teams evaluating governed agent applications where Intergrax may be relevant.
        risk: medium
        body: |
          ## Purpose

          We are looking for design-partner interest from people or teams building governed agent applications.

          This track is for evaluating whether Intergrax fits real product needs where agents require policy-bound execution, trace and evidence, human-in-the-loop checkpoints, controlled tool use, repeatable proof paths, and maintainable orchestration.

          ## What to share

          - what kind of agent application you are building or evaluating
          - which governance, runtime, evidence, or integration problem matters most
          - what would make a design-partner conversation useful
          - what proof path or evaluation would validate fit
          - preferred contact method

          Do not include confidential information, private credentials, customer data, or secrets in this public issue.

          ## Not a commitment

          Submitting interest does not create a partnership, implementation commitment, SLA, support obligation, production-use permission, commercial-use permission, redistribution rights, derivative-work rights, or guaranteed acceptance of proposed work.

  wave_2:
    description: >-
      Second curated public issue wave for deeper architecture clarity, trace/evidence export feedback,
      Local Knowledge Workspace alpha design-partner discovery, and MCP integration-shape feedback.
    open_now: true
    labels_policy: use_existing_template_labels_only
    issues:
      - id: harness-ai-mental-model-docs
        order: 1
        github_issue_number: 191
        github_issue_url: https://github.com/jakbuczarnecki/intergrax/issues/191
        title: "Documentation clarity: Harness AI mental model"
        template: documentation_feedback.yml
        labels: [documentation, triage]
        category: documentation_clarity
        primary_audience: [architecture reviewer, technical evaluator, documentation reviewer]
        goal: Validate whether external readers understand the core Intergrax Harness AI mental model.
        risk: low
        body: |
          ## Purpose

          We are looking for documentation feedback on the core Intergrax Harness AI mental model.

          Please review whether the public docs explain the intended separation between agents deciding, the harness executing, Nexus orchestrating, applications hosting, policies constraining execution, and trace/evidence making execution reviewable.

          ## Useful feedback

          - which document or section helped most
          - where the mental model became clear or confusing
          - which terms need sharper definitions
          - whether diagrams, examples, or shorter explanations would help
          - whether the distinction between agent, harness, Nexus, and application is understandable

          ## Out of scope

          This issue is not for broad feature requests, implementation tasks, production support, commercial use requests, license debates, or requests to redesign the architecture without a concrete documentation-friction example.

      - id: trace-evidence-export-surfaces
        order: 2
        github_issue_number: 192
        github_issue_url: https://github.com/jakbuczarnecki/intergrax/issues/192
        title: "Integration feedback: trace and evidence export surfaces"
        template: integration_proposal.yml
        labels: [integration, triage]
        category: integration_feedback
        primary_audience: [observability builder, governance engineer, integration reviewer]
        goal: Understand which external systems could meaningfully consume Intergrax trace and evidence outputs.
        risk: medium
        body: |
          ## Purpose

          We are looking for technical feedback on possible trace and evidence export surfaces for Intergrax.

          ## Useful feedback

          - what kind of external system you would expect to consume Intergrax trace or evidence
          - which fields are essential, unclear, or missing
          - whether the current public trace/evidence path is enough to evaluate integration potential
          - what export shape would be easiest to review
          - what should remain out of scope

          ## Important boundary

          This issue is about integration-surface feedback. It is not a commitment to implement a specific exporter, vendor integration, dashboard, or hosted observability product.

      - id: local-knowledge-workspace-alpha
        order: 3
        github_issue_number: 193
        github_issue_url: https://github.com/jakbuczarnecki/intergrax/issues/193
        title: "Design partner interest: Local Knowledge Workspace alpha"
        template: design_partner_interest.yml
        labels: [design-partner, triage]
        category: product_validation_track
        primary_audience: [product team, local knowledge workflow evaluator, controlled-RAG user, design partner]
        goal: Understand whether a local, controlled knowledge workspace built on Intergrax solves a real problem.
        risk: medium
        body: |
          ## Purpose

          We are looking for design-partner feedback on the Local Knowledge Workspace alpha direction.

          The goal is to understand whether a local, controlled knowledge workspace built on Intergrax solves a real problem for teams or individuals working with private documents, local knowledge, retrieval, and reviewable AI workflows.

          ## Useful feedback

          - what local knowledge problem you are trying to solve
          - what kind of documents or knowledge sources matter
          - what would make an alpha evaluation useful
          - which privacy, control, trace, or reviewability expectations matter
          - which proof path would help validate fit

          Do not include confidential data, private credentials, customer data, or secrets in this public issue.

      - id: mcp-controlled-task-surface
        order: 4
        github_issue_number: 194
        github_issue_url: https://github.com/jakbuczarnecki/intergrax/issues/194
        title: "Integration feedback: MCP as a controlled Intergrax task surface"
        template: integration_proposal.yml
        labels: [integration, triage]
        category: integration_feedback
        primary_audience: [MCP reviewer, integration builder, agent tool-surface evaluator]
        goal: Understand how MCP-style integration should map to Intergrax task intake, tool access, policy, HITL, trace, evidence, and controlled execution.
        risk: medium_high
        body: |
          ## Purpose

          We are looking for feedback on MCP as a controlled task or tool surface for Intergrax.

          The goal is not to collect a broad MCP wishlist. The goal is to understand how MCP-style integration should map to task intake, policy, human-in-the-loop checkpoints, trace, evidence, and controlled execution.

          ## Useful feedback

          - which MCP-style use case matters to you
          - whether it should be treated as task intake, tool access, or both
          - what policy or approval boundaries would be required
          - what trace or evidence should be produced
          - what should remain explicitly out of scope
          - what would make a small proof path useful

          ## Important boundary

          This issue is about integration-shape feedback. It is not a commitment to implement broad MCP support or a specific MCP server/client integration.

  wave_3:
    description: >-
      Architecture discussion wave for public feedback on the core Intergrax Harness AI /
      Agent OS model and its most important architectural boundaries.
    open_now: true
    labels_policy: use_existing_template_labels_only
    issues:
      - id: harness-ai-not-agent-framework
        order: 1
        title: "Architecture discussion: Intergrax as Harness AI, not an agent framework"
        template: documentation_feedback.yml
        labels: [documentation, triage]
        category: architecture_discussion
        primary_audience: [AI systems architect, agent platform engineer, technical evaluator]
        goal: Validate whether the public narrative makes the Harness AI positioning clear.
        risk: low
        body: |
          ## Purpose

          We are looking for architecture feedback on the core Intergrax positioning: Intergrax is intended to be a Harness AI / Agent OS platform, not only another agent framework.

          ## Useful feedback

          - whether the Harness AI positioning is clear
          - whether the difference between an agent framework, an Agent OS, and a harness is understandable
          - whether "the harness is the product" is supported by the public documentation
          - which document, diagram, or phrase made the model clearer
          - which part still sounds like a normal agent framework

          ## Out of scope

          This issue is not for broad feature requests, production support, commercial use requests, license debates, or implementation tasks.

      - id: four-tier-boundary-model
        order: 2
        title: "Architecture discussion: four-tier boundary model"
        template: documentation_feedback.yml
        labels: [documentation, triage]
        category: architecture_discussion
        primary_audience: [AI systems architect, platform engineer, technical reviewer]
        goal: Validate whether the Tier-0 / Tier-1 / Tier-2 / Tier-3 model is understandable and useful.
        risk: low
        body: |
          ## Purpose

          We are looking for feedback on the Intergrax four-tier architecture model: Tier-0 Platform, Tier-1 Nexus Runtime, Tier-2 Agents, and Tier-3 Applications.

          ## Useful feedback

          - whether the four-tier model is clear
          - which tier boundary is hardest to understand
          - whether the model helps avoid agent god objects
          - whether tools, skills, integrations, agents, and applications appear to live in the right places
          - what example or diagram would make the boundary model easier to evaluate

          ## Out of scope

          This issue is not for implementation requests, broad redesign proposals, production support, commercial use requests, or license debates.

      - id: nexus-as-agent-os
        order: 3
        title: "Architecture discussion: Nexus as Agent OS"
        template: documentation_feedback.yml
        labels: [documentation, triage]
        category: architecture_discussion
        primary_audience: [multi-agent runtime developer, platform engineer, AI systems architect]
        goal: Validate whether Nexus is understood as a runtime / Agent OS layer rather than an agent.
        risk: medium
        body: |
          ## Purpose

          We are looking for feedback on the Nexus role in Intergrax.

          ## Useful feedback

          - whether Nexus is clearly separated from agent cognition
          - whether the execution path is understandable
          - whether the Agent OS metaphor helps or confuses
          - what a public proof path should show to make Nexus credible
          - where the current documentation over-explains or under-explains Nexus

          ## Out of scope

          This issue is not for production support, broad feature requests, implementation tasks, or requests to redesign the runtime without a concrete architecture-clarity concern.

      - id: policy-first-agent-execution
        order: 4
        title: "Architecture discussion: policy-first agent execution"
        template: documentation_feedback.yml
        labels: [feedback, triage]
        category: architecture_discussion
        primary_audience: [governance engineer, platform engineer, AI product team]
        goal: Validate whether policy-first execution is visible, trustworthy, and understandable.
        risk: medium
        body: |
          ## Purpose

          We are looking for feedback on the policy-first execution model in Intergrax.

          ## Useful feedback

          - whether policy-first execution is clear
          - which policy checkpoints should be visible to evaluators
          - whether HITL appears connected to policy decisions
          - what would make governed execution trustworthy
          - which policy concepts need sharper examples

          ## Out of scope

          This issue is not for security vulnerability disclosure, production certification requests, commercial use requests, compliance approval, or broad feature requests.

      - id: tool-skill-integration-separation
        order: 5
        title: "Architecture discussion: Tool / Skill / Integration separation"
        template: integration_proposal.yml
        labels: [integration, triage]
        category: architecture_discussion
        primary_audience: [integration builder, agent platform engineer, MCP reviewer]
        goal: Validate whether the Integration -> Tool -> Skill -> Agent separation is clear and useful.
        risk: medium
        body: |
          ## Purpose

          We are looking for feedback on one of the core Intergrax architecture boundaries: Integration is not Tool, Tool is not Skill, and Skill is not Agent.

          ## Useful feedback

          - whether the Integration -> Tool -> Skill -> Agent model is understandable
          - whether the distinction between a tool and a skill is clear
          - whether integration providers appear properly isolated from agents
          - how this model should relate to MCP or function schemas
          - which examples would make the separation more concrete

          ## Out of scope

          This issue is not a request to implement a specific integration, MCP server, vendor connector, or tool catalog entry.

      - id: context-engineering-runtime-layer
        order: 6
        title: "Architecture discussion: context engineering as a first-class runtime layer"
        template: documentation_feedback.yml
        labels: [feedback, triage]
        category: architecture_discussion
        primary_audience: [context engineering reviewer, RAG engineer, platform engineer]
        goal: Validate whether Intergrax presents context assembly as a governed runtime concern, not prompt stuffing.
        risk: medium
        body: |
          ## Purpose

          We are looking for feedback on context engineering as a first-class Intergrax runtime layer.

          ## Useful feedback

          - whether context engineering is visible enough in public architecture docs
          - which context signals matter most: budget, relevance, freshness, confidence, provenance, compression, trimming
          - what a public proof path should expose about context assembly
          - where RAG, memory, and policy should enter the context pipeline
          - what would make context assembly auditable

          ## Out of scope

          This issue is not for broad prompt-engineering requests, production support, hosted-product roadmap discussions, or implementation tasks.

      - id: governed-rag-memory-boundaries
        order: 7
        title: "Architecture discussion: governed RAG and memory boundaries"
        template: documentation_feedback.yml
        labels: [feedback, triage]
        category: architecture_discussion
        primary_audience: [RAG engineer, knowledge workflow evaluator, governance engineer]
        goal: Validate whether the boundaries between RAG, memory, and context are understandable.
        risk: medium
        body: |
          ## Purpose

          We are looking for feedback on how Intergrax separates governed RAG, memory, and context engineering.

          ## Useful feedback

          - whether the boundary between RAG, memory, and context is clear
          - what a reviewer should inspect to trust retrieval outputs
          - which memory scopes matter most for governed agent applications
          - what proof path would validate local/private knowledge workflows
          - what citations, provenance, or retention details should be visible

          ## Out of scope

          This issue is not for requests to ingest private data, production support, commercial use requests, security-sensitive disclosure, or broad feature requests.

      - id: agent-contracts-production-readiness
        order: 8
        title: "Architecture discussion: agent contracts and production readiness"
        template: documentation_feedback.yml
        labels: [feedback, triage]
        category: architecture_discussion
        primary_audience: [agent platform engineer, AI product team, architecture reviewer]
        goal: Validate whether agents are understood as contracted lifecycle-managed components.
        risk: medium
        body: |
          ## Purpose

          We are looking for feedback on agent contracts and production-readiness boundaries.

          ## Useful feedback

          - whether AgentContract is clear enough
          - which metadata should be mandatory before an agent becomes production-candidate
          - whether lifecycle states such as experimental, certified, deprecated, and retired are useful
          - what evidence should support agent readiness
          - what would make agent lifecycle governance credible

          ## Out of scope

          This issue is not a production certification request, not an implementation task, and not a promise to accept external agent implementations.

  wave_4:
    description: >-
      Product and application validation wave for public discussion around scaffolded or early
      Intergrax applications, agent pipelines, and possible business use cases.
    open_now: true
    labels_policy: use_existing_template_labels_only
    issues:
      - id: legal-contract-review-application
        order: 1
        title: "Design partner interest: Legal contract review application"
        template: design_partner_interest.yml
        labels: [design-partner, triage]
        category: product_validation_track
        primary_audience: [legal operations evaluator, AI product team, design partner]
        goal: Validate whether a governed legal contract review application solves a real workflow problem.
        risk: medium_high
        body: |
          ## Purpose

          We are looking for product-validation feedback on a possible Legal contract review application built on Intergrax.

          The goal is not to provide legal advice. The goal is to understand which contract-review workflows could benefit from governed AI assistance, traceability, review artifacts, and human approval points.

          ## Useful feedback

          - what contract review workflow is painful today
          - whether useful outputs would include summaries, risk tables, clause maps, negotiation notes, or review checklists
          - which steps must remain human-reviewed
          - what trace or evidence would make the workflow trustworthy
          - what proof path would make this product direction worth evaluating

          Do not include confidential contracts, private client information, credentials, secrets, or privileged material in this public issue.

      - id: research-summarization-pipeline
        order: 2
        title: "Design partner interest: Research and summarization pipeline"
        template: design_partner_interest.yml
        labels: [design-partner, triage]
        category: product_validation_track
        primary_audience: [researcher, knowledge worker, AI product team, design partner]
        goal: Validate whether traceable research and summarization workflows are valuable beyond a simple chatbot.
        risk: medium
        body: |
          ## Purpose

          We are looking for product-validation feedback on a governed research and summarization pipeline.

          ## Useful feedback

          - what research workflows are painful today
          - whether traceable research plus summary is more useful than a normal chatbot
          - what should be cited, logged, reviewed, or rejected
          - what output format is most useful: report, memo, briefing, table, or knowledge card
          - what evaluation path would prove quality

          Do not include confidential research data, private credentials, customer data, or secrets in this public issue.

      - id: dispute-simulation-workspace
        order: 3
        title: "Design partner interest: Dispute Simulation Workspace"
        template: design_partner_interest.yml
        labels: [design-partner, triage]
        category: product_validation_track
        primary_audience: [dispute preparation evaluator, legal operations evaluator, AI product team, design partner]
        goal: Validate whether a dispute-preparation and scenario-simulation workspace has real business value.
        risk: high
        body: |
          ## Purpose

          We are looking for product-validation feedback on a possible Dispute Simulation Workspace built on Intergrax.

          The goal is not to provide legal advice or predict court outcomes. The goal is to understand whether structured intake, argument analysis, strategy mapping, and scenario review could support dispute preparation workflows.

          ## Useful feedback

          - whether a dispute-preparation workspace would be useful
          - what intake should extract from documents
          - whether outputs such as timeline, argument matrix, risk map, contradiction list, or scenario variants would be useful
          - what would make scenario simulation credible instead of speculative
          - which parts must remain human-reviewed

          Do not include confidential case details, privileged material, customer data, credentials, or secrets in this public issue.

      - id: intergrax-assistant-harness-chat-hub
        order: 4
        title: "Product discussion: Intergrax Assistant as harness chat hub"
        template: design_partner_interest.yml
        labels: [feedback, triage]
        category: product_validation_track
        primary_audience: [AI product team, platform evaluator, conversational UX reviewer]
        goal: Validate whether a conversational hub is a useful entry point into a governed Agent OS.
        risk: medium
        body: |
          ## Purpose

          We are looking for product and UX feedback on Intergrax Assistant as a conversational hub for the harness.

          ## Useful feedback

          - whether a harness platform should expose a conversational hub
          - when the hub should answer directly versus delegate to specialists
          - what users should see: agent choice, policy decision, trace, confidence, evidence
          - whether this should remain a lab interface or become a product shell
          - what would make delegation understandable to users

          ## Out of scope

          This issue is not for production support, broad chatbot feature requests, commercial use requests, hosted-product pricing, or implementation tasks.

      - id: problem-radar-vendor-discovery
        order: 5
        title: "Product discussion: ProblemRadar and VendorDiscovery agents"
        template: design_partner_interest.yml
        labels: [feedback, triage]
        category: product_validation_track
        primary_audience: [founder, product strategist, B2B platform evaluator, design partner]
        goal: Validate whether agents for business problem discovery and vendor discovery solve a real founder or platform workflow.
        risk: medium
        body: |
          ## Purpose

          We are looking for feedback on possible ProblemRadar and VendorDiscovery agents.

          ## Useful feedback

          - what kind of business problem discovery workflow would be useful
          - whether the agent should look for pain points, vendor gaps, procurement signals, market changes, or partner candidates
          - what evidence should support a detected business problem
          - what would make vendor discovery trustworthy
          - what should be reviewed by a human before any outreach

          Do not include confidential business data, private customer information, credentials, or secrets in this public issue.

      - id: lab-application-universal-proof-environment
        order: 6
        title: "Product discussion: Lab application as universal proof environment"
        template: proof_path_feedback.yml
        labels: [feedback, triage]
        category: proof_path_feedback
        primary_audience: [first-time evaluator, platform engineer, developer experience reviewer]
        goal: Validate whether the lab application is useful as a universal public evaluation environment.
        risk: low
        body: |
          ## Purpose

          We are looking for feedback on the Intergrax lab application as a universal proof environment.

          ## Useful feedback

          - whether the lab application is useful as a public evaluation environment
          - which debug endpoints should be most visible
          - whether every product application should have a lab-mode proof path
          - what a first-time evaluator should inspect first
          - what would make the lab feel like a real harness validation surface

          ## Out of scope

          This issue is not for production support, hosted-lab requests, commercial use requests, or broad feature requests unrelated to public proof-path clarity.

  wave_5:
    description: >-
      Deep technical discussion wave for advanced architecture topics that may become useful
      once the public proof path and architecture narrative have enough external reviewers.
    open_now: true
    labels_policy: use_existing_template_labels_only
    issues:
      - id: registry-driven-capability-resolution
        order: 1
        title: "Architecture discussion: registry-driven capability resolution"
        template: documentation_feedback.yml
        labels: [feedback, triage]
        category: deep_technical_discussion
        primary_audience: [platform engineer, plugin ecosystem builder, architecture reviewer]
        goal: Validate whether registry-driven resolution is understandable and valuable.
        risk: medium
        body: |
          ## Purpose

          We are looking for feedback on registry-driven capability resolution in Intergrax.

          Please share which registry concepts are clear, which are missing, and what would make registry-driven discovery, versioning, lifecycle state, compatibility, and runtime resolution easier to evaluate.

          ## Out of scope

          This issue is not for implementation tasks, broad feature requests, production support, or commercial use requests.

      - id: capability-graph-blast-radius
        order: 2
        title: "Architecture discussion: capability graph and blast-radius analysis"
        template: documentation_feedback.yml
        labels: [feedback, triage]
        category: deep_technical_discussion
