<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img">
  <title>Platform diagnostic backbone</title>
  <desc>Strategic map of applications, scenarios, workers through execution spine to central diagnostics.</desc>
  <rect width="1200" height="720" fill="#f6f8fb"/>
  <rect x="24" y="24" width="1152" height="672" rx="20" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="600" y="58" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#1a1a2e">Platform diagnostic backbone</text>
  <text x="200" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">APPLICATIONS</text>
  <text x="420" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">SCENARIOS</text>
  <text x="820" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">WORKERS</text>
  <line x1="200" y1="145" x2="600" y2="200" stroke="#1a5fb4" stroke-width="2"/>
  <line x1="420" y1="145" x2="600" y2="200" stroke="#1a5fb4" stroke-width="2"/>
  <line x1="820" y1="145" x2="600" y2="200" stroke="#1a5fb4" stroke-width="2"/>
  <rect x="350" y="200" width="500" height="56" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="600" y="232" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">EXECUTION SPINE</text>
  <line x1="600" y1="256" x2="600" y2="300" stroke="#7c3aed" stroke-width="2"/>
  <rect x="350" y="300" width="500" height="56" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="600" y="332" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">RUNTIME EVENTS</text>
  <line x1="600" y1="356" x2="600" y2="400" stroke="#2e7d32" stroke-width="2"/>
  <rect x="300" y="400" width="600" height="64" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="600" y="438" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">CENTRAL DIAGNOSTICS</text>
  <line x1="450" y1="464" x2="350" y2="520" stroke="#ef6c00" stroke-width="2"/>
  <line x1="750" y1="464" x2="850" y2="520" stroke="#ef6c00" stroke-width="2"/>
  <rect x="180" y="520" width="340" height="64" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="350" y="556" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Problems</text>
  <rect x="680" y="520" width="340" height="64" rx="10" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="850" y="556" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Read / API</text>
  <rect x="900" y="300" width="240" height="100" rx="10" fill="#fafafa" stroke="#6c757d" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1020" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#3d4f66">Observability</text>
  <text x="1020" y="365" text-anchor="middle" font-size="12" fill="#3d4f66">parallel consumer</text>
  <text x="1020" y="385" text-anchor="middle" font-size="12" fill="#3d4f66">of RuntimeEvents</text>
  <line x1="850" y1="328" x2="900" y2="350" stroke="#6c757d" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="600" y="660" text-anchor="middle" font-size="14" fill="#3d4f66">NATIVE adoption: 4 PRODUCT hosts + 1 initialized scenario + LKW worker</text>
</svg>
