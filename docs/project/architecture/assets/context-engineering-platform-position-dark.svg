<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img">
  <title>Intergrax Context Engineering platform position</title>
  <desc>Conceptual diagram showing Memory recall, RAG retrieval, tool outputs, runtime state, policy, and workspace inputs feeding Context Engineering, which collects, ranks, budgets, and formats a bounded model context for the Agent or LLM.</desc>
  <rect width="1200" height="920" fill="#0d1117"/>
  <rect x="32" y="28" width="1136" height="864" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="30" font-weight="700" fill="#e6edf3">Intergrax Context Engineering &#8212; platform position</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" fill="#8b949e">Sources feed assembly &#8212; CE does not own storage, retrieval, or tool execution</text>

  <rect x="72" y="140" width="280" height="52" rx="10" fill="#1a3324" stroke="#3fb950" stroke-width="2"/>
  <text x="212" y="172" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Memory recall</text>

  <rect x="72" y="206" width="280" height="52" rx="10" fill="#1c2d4a" stroke="#58a6ff" stroke-width="2"/>
  <text x="212" y="238" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">RAG retrieval</text>

  <rect x="72" y="272" width="280" height="52" rx="10" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
  <text x="212" y="304" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Tool outputs</text>

  <rect x="72" y="338" width="280" height="52" rx="10" fill="#2d1f47" stroke="#a371f7" stroke-width="2"/>
  <text x="212" y="370" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Runtime / graph state</text>

  <rect x="72" y="404" width="280" height="52" rx="10" fill="#3d2817" stroke="#f0883e" stroke-width="2"/>
  <text x="212" y="436" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Policy / instructions</text>

  <rect x="72" y="470" width="280" height="52" rx="10" fill="#164e63" stroke="#22d3ee" stroke-width="2"/>
  <text x="212" y="502" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Attachments / workspace</text>

  <line x1="352" y1="166" x2="400" y2="320" stroke="#8b949e" stroke-width="2"/>
  <path d="M400 320 L392 306 L408 308 Z" fill="#8b949e"/>
  <line x1="352" y1="232" x2="400" y2="330" stroke="#8b949e" stroke-width="2"/>
  <line x1="352" y1="298" x2="400" y2="340" stroke="#8b949e" stroke-width="2"/>
  <line x1="352" y1="364" x2="400" y2="350" stroke="#8b949e" stroke-width="2"/>
  <line x1="352" y1="430" x2="400" y2="360" stroke="#8b949e" stroke-width="2"/>
  <line x1="352" y1="496" x2="400" y2="370" stroke="#8b949e" stroke-width="2"/>

  <rect x="400" y="260" width="400" height="200" rx="18" fill="#3d3520" stroke="#d4a72c" stroke-width="2.5"/>
  <text x="600" y="296" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#e6edf3">Context Engineering</text>
  <text x="600" y="324" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">collect &#183; rank &#183; filter &#183; budget</text>
  <text x="600" y="348" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">degrade &#183; format &#183; provenance</text>
  <rect x="440" y="368" width="320" height="68" rx="10" fill="#0d1117" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="600" y="396" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Bounded model context</text>
  <text x="600" y="420" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">messages + provenance + budget diag</text>

  <line x1="800" y1="360" x2="848" y2="360" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M848 360 L834 350 L834 370 Z" fill="#e6edf3"/>

  <rect x="848" y="300" width="280" height="120" rx="14" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
  <text x="988" y="348" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#e6edf3">Agent / LLM</text>
  <text x="988" y="378" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" fill="#8b949e">one execution step</text>

  <rect x="400" y="560" width="400" height="88" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="600" y="592" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#8b949e">Configuration input (Tier-3)</text>
  <text x="600" y="618" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#6e7681">ContextProfile &#183; presets &#183; context_plugins[]</text>
  <line x1="600" y1="560" x2="600" y2="460" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M600 460 L594 474 L606 474 Z" fill="#30363d"/>

  <text x="600" y="720" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" fill="#8b949e">CE assembles model-facing context &#8212; it does not own Memory stores, RAG indexes, or tool execution.</text>
  <text x="600" y="868" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#6e7681">Conceptual architecture &#8212; not a runtime class diagram.</text>
</svg>
