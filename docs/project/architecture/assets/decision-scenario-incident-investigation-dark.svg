<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img">
  <title>Incident investigation scenario</title>
  <desc>Signals through verification to ACCEPTED or UNRESOLVED.</desc>
  <rect width="1200" height="700" fill="#0d1117"/>
  <rect x="24" y="24" width="1152" height="652" rx="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  
  <text x="600" y="58" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#e6edf3">AI Incident Investigation — Decision path</text>
  <text x="600" y="620" text-anchor="middle" font-size="14" fill="#8b949e">Decision quality ≠ authorization — UNRESOLVED is valid</text>
  <rect x="80" y="120" width="110" height="52" rx="10" fill="#eef4ff" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="135" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#e6edf3">signals</text>
  <rect x="210" y="120" width="110" height="52" rx="10" fill="#eef4ff" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="265" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#e6edf3">hypotheses</text>
  <rect x="340" y="120" width="110" height="52" rx="10" fill="#eef4ff" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="395" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#e6edf3">evidence</text>
  <rect x="470" y="120" width="110" height="52" rx="10" fill="#eef4ff" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="525" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#e6edf3">candidate</text>
  <rect x="600" y="120" width="110" height="52" rx="10" fill="#eef4ff" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="655" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#e6edf3">verify</text>
  <rect x="730" y="120" width="110" height="52" rx="10" fill="#eef4ff" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="785" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#e6edf3">challenge</text>
  <rect x="860" y="120" width="110" height="52" rx="10" fill="#eef4ff" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="915" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#e6edf3">revision</text>
  <rect x="990" y="120" width="110" height="52" rx="10" fill="#eef4ff" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="1045" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#e6edf3">ACCEPTED / UNRESOLVED</text>
</svg>
