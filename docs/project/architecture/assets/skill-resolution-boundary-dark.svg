<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" role="img">
  <title>Intergrax skill resolution boundary</title>
  <desc>Conceptual diagram: SkillProfile and AgentContract skills resolve through SkillResolver into capability requirements; ToolRuntime still executes actions.</desc>
  <rect width="1200" height="1040" fill="#0d1117"/>
  <rect x="32" y="28" width="1136" height="984" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="30" font-weight="700" fill="#e6edf3">Intergrax Skills &#8212; composition vs execution</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" fill="#8b949e">Skills compose capability requirements; Tools execute actions</text>

  <rect x="460" y="130" width="280" height="44" rx="10" fill="#1c2d4a" stroke="#58a6ff" stroke-width="2"/>
  <text x="600" y="158" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">SkillProfile</text>

  <line x1="600" y1="174" x2="600" y2="198" stroke="#484f58" stroke-width="2"/>
  <path d="M600 198 L594 184 L606 184 Z" fill="#484f58"/>

  <rect x="460" y="198" width="280" height="44" rx="10" fill="#21262d" stroke="#484f58" stroke-width="2"/>
  <text x="600" y="226" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">SkillRegistry</text>

  <line x1="600" y1="242" x2="600" y2="266" stroke="#484f58" stroke-width="2"/>
  <path d="M600 266 L594 252 L606 252 Z" fill="#484f58"/>

  <rect x="400" y="266" width="400" height="44" rx="10" fill="#21262d" stroke="#484f58" stroke-width="2"/>
  <text x="600" y="294" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">AgentContract.skills[]</text>

  <line x1="600" y1="310" x2="600" y2="334" stroke="#484f58" stroke-width="2"/>
  <path d="M600 334 L594 320 L606 320 Z" fill="#484f58"/>

  <rect x="420" y="334" width="360" height="52" rx="12" fill="#1a2e1f" stroke="#3fb950" stroke-width="2.5"/>
  <text x="600" y="366" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">SkillResolver</text>

  <line x1="600" y1="386" x2="600" y2="410" stroke="#3fb950" stroke-width="2"/>
  <path d="M600 410 L594 396 L606 396 Z" fill="#3fb950"/>

  <rect x="360" y="410" width="480" height="56" rx="12" fill="#1c2128" stroke="#3fb950" stroke-width="2"/>
  <text x="600" y="442" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">ResolvedSkillPack</text>

  <rect x="180" y="486" width="260" height="52" rx="10" fill="#21262d" stroke="#484f58" stroke-width="2"/>
  <text x="310" y="518" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">tool_ids</text>

  <rect x="470" y="486" width="260" height="52" rx="10" fill="#21262d" stroke="#484f58" stroke-width="2"/>
  <text x="600" y="518" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">prompt refs</text>

  <rect x="760" y="486" width="260" height="52" rx="10" fill="#21262d" stroke="#484f58" stroke-width="2"/>
  <text x="890" y="518" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">policy refs</text>

  <line x1="600" y1="466" x2="310" y2="486" stroke="#484f58" stroke-width="1.5"/>
  <line x1="600" y1="466" x2="600" y2="486" stroke="#484f58" stroke-width="1.5"/>
  <line x1="600" y1="466" x2="890" y2="486" stroke="#484f58" stroke-width="1.5"/>

  <line x1="600" y1="538" x2="600" y2="562" stroke="#484f58" stroke-width="2"/>
  <path d="M600 562 L594 548 L606 548 Z" fill="#484f58"/>

  <rect x="360" y="562" width="480" height="52" rx="12" fill="#2d2410" stroke="#d29922" stroke-width="2"/>
  <text x="600" y="594" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">AgentContract.allowed_tools</text>

  <line x1="600" y1="614" x2="600" y2="638" stroke="#484f58" stroke-width="2"/>
  <path d="M600 638 L594 624 L606 624 Z" fill="#484f58"/>

  <rect x="300" y="638" width="600" height="52" rx="12" fill="#21262d" stroke="#484f58" stroke-width="2"/>
  <text x="600" y="670" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">ToolProfile / runtime policy / Governance</text>

  <line x1="600" y1="690" x2="600" y2="714" stroke="#484f58" stroke-width="2"/>
  <path d="M600 714 L594 700 L606 700 Z" fill="#484f58"/>

  <rect x="420" y="714" width="360" height="56" rx="14" fill="#1a2e1f" stroke="#3fb950" stroke-width="2.5"/>
  <text x="600" y="748" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">ToolRuntime</text>

  <rect x="320" y="468" width="560" height="36" rx="8" fill="#3d1f12" stroke="#f0883e" stroke-width="1.5"/>
  <text x="600" y="491" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#f0883e">Skills compose capabilities. Tools execute actions.</text>

  <text x="600" y="820" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" fill="#8b949e">SkillResolver is deterministic &#8212; no LLM calls.</text>
  <text x="600" y="980" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">Conceptual architecture &#8212; not a runtime class diagram.</text>
</svg>
