<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img">
  <title>Intergrax Elastic Capacity Plane control loop</title>
  <desc>Capacity pressure flows through CapacitySignal, ScalingPolicy, ScalingEvaluator, ScalingActionPlan, governance and HITL, ScalingProvisioner to Kubernetes replicas, Celery workers, or runtime ceiling, then capacity evidence.</desc>
  <rect width="1200" height="980" fill="#f6f8fb"/>
  <rect x="32" y="28" width="1136" height="924" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#1a1a2e">Elastic Capacity Plane &#8212; control loop</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#3d4f66">Backpressure limits work &#183; scaling changes capacity</text>

  <rect x="420" y="132" width="360" height="52" rx="12" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="600" y="164" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e">Capacity pressure</text>

  <line x1="600" y1="184" x2="600" y2="212" stroke="#1a1a2e" stroke-width="2.5"/>
  <path d="M600 212 L590 198 L610 198 Z" fill="#1a1a2e"/>

  <rect x="380" y="220" width="440" height="48" rx="12" fill="#ffffff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="600" y="250" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#1a1a2e">CapacitySignal</text>

  <line x1="600" y1="272" x2="600" y2="300" stroke="#1a1a2e" stroke-width="2"/>
  <path d="M600 300 L590 286 L610 286 Z" fill="#1a1a2e"/>

  <rect x="380" y="308" width="440" height="48" rx="12" fill="#ffffff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="600" y="338" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#1a1a2e">ScalingPolicy</text>

  <line x1="600" y1="360" x2="600" y2="388" stroke="#1a1a2e" stroke-width="2"/>
  <path d="M600 388 L590 374 L610 374 Z" fill="#1a1a2e"/>

  <rect x="380" y="396" width="440" height="48" rx="12" fill="#ffffff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="600" y="426" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#1a1a2e">ScalingEvaluator</text>

  <line x1="600" y1="448" x2="600" y2="476" stroke="#1a1a2e" stroke-width="2"/>
  <path d="M600 476 L590 460 L610 460 Z" fill="#1a1a2e"/>

  <rect x="360" y="484" width="480" height="48" rx="12" fill="#fff8e1" stroke="#c9a227" stroke-width="2.5"/>
  <text x="600" y="514" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#1a1a2e">ScalingActionPlan</text>

  <line x1="600" y1="536" x2="600" y2="564" stroke="#c9a227" stroke-width="2"/>
  <path d="M600 564 L590 550 L610 550 Z" fill="#c9a227"/>

  <rect x="380" y="572" width="440" height="48" rx="12" fill="#f0fdf4" stroke="#2da44e" stroke-width="2"/>
  <text x="600" y="602" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#1a1a2e">Governance / HITL</text>

  <line x1="600" y1="624" x2="600" y2="648" stroke="#2da44e" stroke-width="2"/>
  <path d="M600 648 L590 636 L610 636 Z" fill="#2da44e"/>

  <rect x="360" y="656" width="480" height="52" rx="14" fill="#fff8e1" stroke="#c9a227" stroke-width="2.5"/>
  <text x="600" y="688" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">ScalingProvisioner</text>

  <line x1="600" y1="704" x2="600" y2="728" stroke="#c9a227" stroke-width="2"/>
  <line x1="200" y1="728" x2="1000" y2="728" stroke="#c9a227" stroke-width="2"/>
  <line x1="200" y1="728" x2="200" y2="756" stroke="#c9a227" stroke-width="2"/>
  <line x1="600" y1="728" x2="600" y2="756" stroke="#c9a227" stroke-width="2"/>
  <line x1="1000" y1="728" x2="1000" y2="756" stroke="#c9a227" stroke-width="2"/>

  <rect x="120" y="760" width="160" height="56" rx="10" fill="#ffffff" stroke="#c9a227" stroke-width="2"/>
  <text x="200" y="784" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#1a1a2e">K8s replicas</text>
  <text x="200" y="802" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#3d4f66">SCALE_K8S_DEPLOYMENT</text>

  <rect x="520" y="760" width="160" height="56" rx="10" fill="#ffffff" stroke="#c9a227" stroke-width="2"/>
  <text x="600" y="784" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#1a1a2e">Celery workers</text>
  <text x="600" y="802" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#3d4f66">SCALE_CELERY_WORKERS</text>

  <rect x="920" y="760" width="160" height="56" rx="10" fill="#ffffff" stroke="#c9a227" stroke-width="2"/>
  <text x="1000" y="784" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#1a1a2e">Runtime ceiling</text>
  <text x="1000" y="802" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#3d4f66">RAISE_ORCHESTRATION_CEILING</text>

  <line x1="200" y1="816" x2="200" y2="840" stroke="#c9a227" stroke-width="2"/>
  <line x1="600" y1="816" x2="600" y2="840" stroke="#c9a227" stroke-width="2"/>
  <line x1="1000" y1="816" x2="1000" y2="840" stroke="#c9a227" stroke-width="2"/>
  <line x1="200" y1="840" x2="1000" y2="840" stroke="#c9a227" stroke-width="2"/>
  <line x1="600" y1="840" x2="600" y2="868" stroke="#1a5fb4" stroke-width="2.5"/>
  <path d="M600 868 L590 846 L610 846 Z" fill="#1a5fb4"/>

  <rect x="420" y="876" width="360" height="48" rx="12" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="600" y="906" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#1a1a2e">Capacity evidence</text>

  <rect x="80" y="132" width="280" height="72" rx="10" fill="#fef2f2" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="200" y="158" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#cf222e">Backpressure</text>
  <text x="200" y="182" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#3d4f66">limits work inside current capacity</text>
</svg>
