<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img">
  <title>Intergrax Experimentation and promotion loop</title>
  <desc>Conceptual diagram: candidate flows through experiment, simulation or execution, trace and evaluation, baseline comparison, promotion gates, then qualify or reject before hosting.</desc>
  <rect width="1200" height="980" fill="#0d1117"/>
  <rect x="32" y="28" width="1136" height="924" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#e6edf3">Experimentation &#38; Developer Experience</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#8b949e">Laboratory workflow &#8212; qualify candidates before production activation</text>

  <rect x="470" y="132" width="260" height="48" rx="12" fill="#1c2d4a" stroke="#58a6ff" stroke-width="2"/>
  <text x="600" y="162" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">CANDIDATE</text>

  <line x1="600" y1="180" x2="600" y2="204" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 204 L590 190 L610 190 Z" fill="#e6edf3"/>

  <rect x="420" y="208" width="360" height="48" rx="12" fill="#2d2411" stroke="#d4a72c" stroke-width="2"/>
  <text x="600" y="238" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Experiment</text>

  <line x1="600" y1="256" x2="600" y2="280" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 280 L590 266 L610 266 Z" fill="#e6edf3"/>

  <rect x="340" y="284" width="520" height="56" rx="12" fill="#21262d" stroke="#6e7681" stroke-width="2"/>
  <text x="600" y="310" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Simulation / execution (lab)</text>
  <text x="600" y="330" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">Nexus harness &#183; stub agents &#183; trace capture</text>

  <line x1="600" y1="340" x2="600" y2="364" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 364 L590 350 L610 350 Z" fill="#e6edf3"/>

  <rect x="360" y="368" width="480" height="56" rx="12" fill="#1a2e1a" stroke="#3fb950" stroke-width="2"/>
  <text x="600" y="394" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Trace + evaluation evidence</text>
  <text x="600" y="414" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">Observability authority &#183; online eval bridge</text>

  <line x1="600" y1="424" x2="600" y2="448" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 448 L590 434 L610 434 Z" fill="#e6edf3"/>

  <rect x="300" y="452" width="240" height="48" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="2"/>
  <text x="420" y="482" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Baseline</text>

  <rect x="660" y="452" width="240" height="48" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="780" y="482" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Candidate</text>

  <line x1="420" y1="500" x2="600" y2="536" stroke="#6e7681" stroke-width="2"/>
  <line x1="780" y1="500" x2="600" y2="536" stroke="#58a6ff" stroke-width="2"/>

  <rect x="380" y="540" width="440" height="48" rx="12" fill="#2d2411" stroke="#d4a72c" stroke-width="2"/>
  <text x="600" y="570" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Compare evidence (same scenarios)</text>

  <line x1="600" y1="588" x2="600" y2="612" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 612 L590 598 L610 598 Z" fill="#e6edf3"/>

  <rect x="380" y="616" width="440" height="56" rx="14" fill="#3d1f24" stroke="#f85149" stroke-width="2.5"/>
  <text x="600" y="642" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Promotion gates (G0&#8211;G2)</text>
  <text x="600" y="662" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">qualification boundary &#8212; not deployment</text>

  <line x1="600" y1="672" x2="600" y2="696" stroke="#f85149" stroke-width="2"/>
  <line x1="320" y1="696" x2="880" y2="696" stroke="#f85149" stroke-width="2"/>
  <line x1="320" y1="696" x2="320" y2="724" stroke="#f85149" stroke-width="2"/>
  <line x1="880" y1="696" x2="880" y2="724" stroke="#f85149" stroke-width="2"/>

  <rect x="220" y="728" width="200" height="48" rx="10" fill="#1a2e1a" stroke="#3fb950" stroke-width="2"/>
  <text x="320" y="758" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Qualify</text>

  <rect x="780" y="728" width="200" height="48" rx="10" fill="#3d1f24" stroke="#f85149" stroke-width="2"/>
  <text x="880" y="758" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Reject</text>

  <line x1="320" y1="776" x2="320" y2="804" stroke="#3fb950" stroke-width="2"/>
  <path d="M320 804 L310 790 L330 790 Z" fill="#3fb950"/>

  <rect x="180" y="808" width="280" height="56" rx="12" fill="#1c2d4a" stroke="#58a6ff" stroke-width="2"/>
  <text x="320" y="834" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Hosting / deployment</text>
  <text x="320" y="854" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">separate domain</text>

  <rect x="120" y="888" width="960" height="48" rx="10" fill="#3d2a14" stroke="#db6d28" stroke-width="2"/>
  <text x="600" y="918" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#ffa657">Experiment evidence &#8800; deployment permission</text>

  <text x="600" y="968" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#6e7681">Conceptual architecture &#8212; laboratory optimizes learning speed; production optimizes governed repeatability.</text>
</svg>
