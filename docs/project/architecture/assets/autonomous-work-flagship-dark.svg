<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img">
  <title>Intergrax Autonomous Work flagship architecture</title>
  <desc>Virtual Worker owns business responsibility and goals, wakes on events or schedules, dispatches governed executions through agents and tools, classifies obstacles, may use CodeCraft and sandbox verification, and remains responsible after each execution. Governance and observability bound the path.</desc>
  <rect width="1200" height="980" fill="#0d1117"/>
  <rect x="32" y="28" width="1136" height="924" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="30" font-weight="700" fill="#e6edf3">Autonomous Work in Intergrax</text>
  <text x="600" y="106" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" fill="#8b949e">Persistent Virtual Workers own responsibility and goals across many governed executions</text>

  <rect x="360" y="130" width="480" height="64" rx="14" fill="#1b2f23" stroke="#3fb950" stroke-width="2"/>
  <text x="600" y="158" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">Business Responsibility / Goals</text>
  <text x="600" y="182" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">durable ownership, not a single task prompt</text>

  <line x1="600" y1="194" x2="600" y2="222" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 222 L590 208 L610 208 Z" fill="#e6edf3"/>

  <rect x="390" y="226" width="420" height="72" rx="16" fill="#2d2418" stroke="#d29922" stroke-width="2.5"/>
  <text x="600" y="256" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#e6edf3">Virtual Worker</text>
  <text x="600" y="282" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">not Agent · not Execution · not Principal</text>

  <line x1="600" y1="298" x2="600" y2="326" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 326 L590 312 L610 312 Z" fill="#e6edf3"/>

  <rect x="250" y="330" width="700" height="58" rx="12" fill="#132236" stroke="#388bfd" stroke-width="2"/>
  <text x="600" y="364" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">events · schedule · proactive goal evaluation</text>

  <line x1="600" y1="388" x2="600" y2="416" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 416 L590 402 L610 402 Z" fill="#e6edf3"/>

  <rect x="420" y="420" width="360" height="56" rx="12" fill="#261b33" stroke="#a371f7" stroke-width="2"/>
  <text x="600" y="454" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Work / WorkItem</text>

  <line x1="600" y1="476" x2="600" y2="504" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 504 L590 490 L610 490 Z" fill="#e6edf3"/>

  <rect x="360" y="508" width="480" height="64" rx="14" fill="#12263a" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="600" y="538" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#e6edf3">Governed Execution</text>
  <text x="600" y="562" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">authority and policy bound every operation</text>

  <line x1="600" y1="572" x2="600" y2="600" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 600 L590 586 L610 586 Z" fill="#e6edf3"/>

  <rect x="220" y="604" width="760" height="56" rx="12" fill="#1c2128" stroke="#6e7681" stroke-width="2"/>
  <text x="600" y="638" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">Agents / Tools / Skills / Integrations</text>

  <line x1="600" y1="660" x2="600" y2="688" stroke="#f85149" stroke-width="2.5"/>
  <path d="M600 688 L590 674 L610 674 Z" fill="#f85149"/>
  <text x="600" y="710" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#f85149">obstacle?</text>

  <line x1="600" y1="710" x2="430" y2="724" stroke="#f85149" stroke-width="2"/>
  <path d="M430 724 L438 712 L422 716 Z" fill="#f85149"/>

  <rect x="300" y="724" width="260" height="64" rx="12" fill="#2d1b1b" stroke="#f85149" stroke-width="2"/>
  <text x="430" y="752" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Recovery Controller</text>
  <text x="430" y="776" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">classify · replan · escalate</text>

  <line x1="430" y1="788" x2="430" y2="806" stroke="#f85149" stroke-width="2"/>
  <path d="M430 806 L422 794 L438 794 Z" fill="#f85149"/>

  <rect x="300" y="810" width="260" height="40" rx="10" fill="#1b2f23" stroke="#3fb950" stroke-width="1.5"/>
  <text x="430" y="836" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">reuse existing capability</text>

  <line x1="430" y1="850" x2="430" y2="862" stroke="#e6edf3" stroke-width="1.5"/>
  <line x1="230" y1="862" x2="620" y2="862" stroke="#e6edf3" stroke-width="1.5"/>

  <line x1="230" y1="862" x2="230" y2="874" stroke="#3fb950" stroke-width="2"/>
  <path d="M230 874 L222 862 L238 862 Z" fill="#3fb950"/>
  <text x="230" y="888" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#3fb950">successful</text>
  <rect x="130" y="894" width="200" height="36" rx="10" fill="#1b2f23" stroke="#3fb950" stroke-width="1.5"/>
  <text x="230" y="918" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">resume original work</text>

  <line x1="620" y1="862" x2="620" y2="874" stroke="#d29922" stroke-width="2"/>
  <path d="M620 874 L612 862 L628 862 Z" fill="#d29922"/>
  <text x="620" y="888" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#d29922">capability gap</text>

  <rect x="540" y="894" width="100" height="36" rx="8" fill="#2d2418" stroke="#d29922" stroke-width="1.5"/>
  <text x="590" y="918" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#e6edf3">CodeCraft</text>
  <line x1="640" y1="912" x2="658" y2="912" stroke="#d29922" stroke-width="1.5"/>
  <path d="M658 912 L646 906 L646 918 Z" fill="#d29922"/>
  <rect x="662" y="894" width="130" height="36" rx="8" fill="#2d2418" stroke="#d29922" stroke-width="1.5"/>
  <text x="727" y="918" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Sandbox + Verify</text>
  <line x1="792" y1="912" x2="810" y2="912" stroke="#3fb950" stroke-width="1.5"/>
  <path d="M810 912 L798 906 L798 918 Z" fill="#3fb950"/>
  <rect x="814" y="894" width="180" height="36" rx="8" fill="#1b2f23" stroke="#3fb950" stroke-width="1.5"/>
  <text x="904" y="918" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">resume original work</text>

  <rect x="72" y="150" width="200" height="520" rx="14" fill="#2a1520" stroke="#db61a2" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="172" y="186" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#f778ba">Governance</text>
  <text x="172" y="210" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#f778ba">Authority</text>
  <text x="172" y="250" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">bounds actions</text>
  <text x="172" y="272" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">across executions</text>

  <rect x="928" y="150" width="200" height="520" rx="14" fill="#221a33" stroke="#a371f7" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1028" y="186" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#d2a8ff">Observability</text>
  <text x="1028" y="210" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#d2a8ff">Evidence</text>
  <text x="1028" y="250" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">records facts</text>
  <text x="1028" y="272" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">and worker state</text>

  <text x="600" y="940" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">Target architecture - runtime implementation not started.</text>
