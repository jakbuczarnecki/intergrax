<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img">
  <title>Verification stage composition</title>
  <desc>Plugin stages composed by pipeline orchestrator with typed contracts.</desc>
  <rect width="1200" height="800" fill="#f6f8fb"/>
  <rect x="32" y="28" width="1136" height="744" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#1a1a2e">Stage / Plugin Composition</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#3d4f66">Typed contracts — no universal payload dict</text>
  <rect x="100" y="160" width="200" height="64" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="200" y="188" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Stage plugin</text>
  <text x="200" y="208" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">schema</text>
  <rect x="340" y="160" width="200" height="64" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="440" y="188" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Stage plugin</text>
  <text x="440" y="208" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">rules</text>
  <rect x="580" y="160" width="200" height="64" rx="12" fill="#fff8e1" stroke="#c9a227" stroke-width="2"/>
  <text x="680" y="188" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Stage plugin</text>
  <text x="680" y="208" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">evidence</text>
  <rect x="820" y="160" width="200" height="64" rx="12" fill="#fff8e1" stroke="#c9a227" stroke-width="2"/>
  <text x="920" y="188" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Stage plugin</text>
  <text x="920" y="208" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">semantic</text>
  <rect x="220" y="300" width="760" height="64" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="600" y="328" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Verification Pipeline orchestrator</text>
  <text x="600" y="348" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">ordered composition · short-circuit rules</text>
  <text x="600" y="430" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">Future registered plugins extend pipeline — lifecycle unaware of internals</text>
  <text x="600" y="460" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">Online / shadow / offline evaluation consume results — stay outside pipeline ownership</text>
