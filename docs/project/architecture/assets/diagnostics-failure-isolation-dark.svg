<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img">
  <title>Diagnostic failure isolation</title>
  <desc>Business execution success survives Problem Store outage with failure evidence recorded.</desc>
  <rect width="1200" height="650" fill="#0d1117"/>
  <rect x="24" y="24" width="1152" height="602" rx="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="600" y="58" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#e6edf3">Failure isolation  business vs diagnostics</text>
  <rect x="400" y="110" width="400" height="72" rx="12" fill="#1a3d2e" stroke="#3fb950" stroke-width="2"/>
  <text x="600" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#e6edf3">Business execution</text>
  <text x="600" y="172" text-anchor="middle" font-size="14" fill="#8b949e">SUCCESS (canonical outcome)</text>
  <line x1="500" y1="182" x2="350" y2="280" stroke="#3fb950" stroke-width="2"/>
  <line x1="700" y1="182" x2="850" y2="280" stroke="#f0883e" stroke-width="2"/>
  <rect x="150" y="280" width="400" height="100" rx="12" fill="#1f2937" stroke="#58a6ff" stroke-width="2"/>
  <text x="350" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">RuntimeEvents persisted</text>
  <text x="350" y="358" text-anchor="middle" font-size="13" fill="#8b949e">canonical execution evidence survives</text>
  <rect x="650" y="280" width="400" height="100" rx="12" fill="#3d1f24" stroke="#f85149" stroke-width="2"/>
  <text x="850" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">Problem Store DOWN</text>
  <text x="850" y="358" text-anchor="middle" font-size="13" fill="#8b949e">write fails visibly  no silent drop</text>
  <line x1="850" y1="380" x2="850" y2="440" stroke="#f85149" stroke-width="2"/>
  <rect x="550" y="440" width="600" height="80" rx="12" fill="#3d2a14" stroke="#f0883e" stroke-width="2"/>
  <text x="850" y="472" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">Diagnostic subsystem failure evidence</text>
  <text x="850" y="500" text-anchor="middle" font-size="13" fill="#8b949e">RuntimeEvent records degradation  business result unchanged</text>
  <text x="600" y="580" text-anchor="middle" font-size="15" fill="#8b949e">Problem persistence failure does not create implicit replay queue</text>
</svg>
