<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img">
  <title>Intergrax Memory platform position</title>
  <desc>Conceptual diagram showing execution and session state flowing into Memory stores, Context Engineering assembling model context from Memory and RAG retrieval, and the Agent or LLM consuming the result.</desc>
  <rect width="1200" height="820" fill="#f6f8fb"/>
  <rect x="32" y="28" width="1136" height="764" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <text x="600" y="78" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="30" font-weight="700" fill="#1a1a2e">Intergrax Memory &#8212; platform position</text>
  <text x="600" y="112" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" fill="#3d4f66">Persisted state and recall &#8212; separate from document retrieval and context assembly</text>

  <rect x="420" y="140" width="360" height="72" rx="14" fill="#eef4ff" stroke="#4a6fa5" stroke-width="2"/>
  <text x="600" y="172" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#1a1a2e">Execution / Session</text>
  <text x="600" y="198" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" fill="#3d4f66">turns, task runs, checkpoints</text>

  <line x1="600" y1="212" x2="600" y2="248" stroke="#1a1a2e" stroke-width="2.5"/>
  <path d="M600 248 L590 234 L610 234 Z" fill="#1a1a2e"/>

  <rect x="300" y="252" width="600" height="148" rx="18" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="600" y="288" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="26" font-weight="700" fill="#1a1a2e">Memory</text>
  <text x="600" y="318" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#3d4f66">What should the system remember across execution boundaries?</text>
  <rect x="340" y="336" width="220" height="48" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="450" y="366" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#1a1a2e">Session / task state</text>
  <rect x="640" y="336" width="220" height="48" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="750" y="366" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#1a1a2e">Durable LTM / episodic</text>

  <line x1="600" y1="400" x2="600" y2="436" stroke="#1a1a2e" stroke-width="2.5"/>
  <path d="M600 436 L590 422 L610 422 Z" fill="#1a1a2e"/>

  <rect x="260" y="440" width="680" height="88" rx="16" fill="#fff8e1" stroke="#c9a227" stroke-width="2.5"/>
  <text x="600" y="476" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#1a1a2e">Context Engineering</text>
  <text x="600" y="506" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#3d4f66">What information enters the model context now &#8212; under budget and provenance</text>

  <line x1="450" y1="528" x2="450" y2="560" stroke="#2e7d32" stroke-width="2"/>
  <path d="M450 560 L442 548 L458 548 Z" fill="#2e7d32"/>
  <line x1="750" y1="528" x2="750" y2="560" stroke="#1a5fb4" stroke-width="2"/>
  <path d="M750 560 L742 548 L758 548 Z" fill="#1a5fb4"/>

  <rect x="300" y="564" width="300" height="72" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="450" y="596" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Memory recall</text>
  <text x="450" y="620" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">session, LTM, episodic, task KV</text>

  <rect x="600" y="564" width="300" height="72" rx="12" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="750" y="596" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">RAG retrieval</text>
  <text x="750" y="620" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">external / document knowledge</text>

  <line x1="600" y1="636" x2="600" y2="672" stroke="#1a1a2e" stroke-width="2.5"/>
  <path d="M600 672 L590 658 L610 658 Z" fill="#1a1a2e"/>

  <rect x="420" y="676" width="360" height="72" rx="14" fill="#f0f4f8" stroke="#5b6f82" stroke-width="2"/>
  <text x="600" y="708" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#1a1a2e">Agent / LLM</text>
  <text x="600" y="734" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" fill="#3d4f66">governed turn execution</text>

  <text x="600" y="792" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#5b6f82">Conceptual architecture &#8212; not a runtime class diagram.</text>
</svg>
