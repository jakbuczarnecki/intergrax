<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img">
  <title>Intergrax Unified Execution Runtime lifecycle</title>
  <desc>Conceptual diagram: Nexus decides what executes; UER defines how execution behaves. Task to Run to Attempt hierarchy with retry, RuntimeEvents on every transition, and subscribers for policy, observability, recovery, and HITL.</desc>
  <rect width="1200" height="900" fill="#f6f8fb"/>
  <rect x="32" y="28" width="1136" height="844" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#1a1a2e">Unified Execution Runtime &#8212; lifecycle</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#3d4f66">Nexus decides what executes &#183; UER defines how execution behaves</text>

  <rect x="180" y="128" width="360" height="64" rx="12" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="360" y="158" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#1a1a2e">Nexus</text>
  <text x="360" y="180" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">What should execute next?</text>

  <rect x="660" y="128" width="360" height="64" rx="12" fill="#fff8e1" stroke="#c9a227" stroke-width="2"/>
  <text x="840" y="158" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#1a1a2e">UER</text>
  <text x="840" y="180" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">How execution behaves</text>

  <rect x="470" y="220" width="260" height="56" rx="12" fill="#f0f4f8" stroke="#5b6f82" stroke-width="2"/>
  <text x="600" y="246" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">TASK</text>
  <text x="600" y="266" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">user / system intent</text>

  <line x1="600" y1="276" x2="600" y2="304" stroke="#1a1a2e" stroke-width="2.5"/>
  <path d="M600 304 L590 290 L610 290 Z" fill="#1a1a2e"/>

  <rect x="470" y="308" width="260" height="56" rx="12" fill="#f0f4f8" stroke="#5b6f82" stroke-width="2"/>
  <text x="600" y="334" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">RUN</text>
  <text x="600" y="354" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">one execution lifecycle</text>

  <line x1="520" y1="364" x2="380" y2="400" stroke="#1a1a2e" stroke-width="2"/>
  <path d="M380 400 L392 388 L396 404 Z" fill="#1a1a2e"/>
  <line x1="680" y1="364" x2="820" y2="400" stroke="#1a1a2e" stroke-width="2"/>
  <path d="M820 400 L808 388 L804 404 Z" fill="#1a1a2e"/>

  <rect x="200" y="404" width="360" height="200" rx="14" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="380" y="434" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e">Attempt 1</text>
  <text x="380" y="462" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">execute</text>
  <text x="380" y="486" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">RuntimeEvents</text>
  <text x="380" y="510" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#c62828" font-weight="600">failure</text>
  <text x="380" y="580" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#5b6f82">same TaskId + RunId</text>

  <rect x="640" y="404" width="360" height="200" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="820" y="434" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e">Attempt 2</text>
  <text x="820" y="462" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">retry / resume</text>
  <text x="820" y="486" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">execute &#183; validate</text>
  <text x="820" y="510" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#2e7d32" font-weight="600">complete</text>
  <text x="820" y="580" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#5b6f82">new AttemptId on retry</text>

  <path d="M560 504 Q600 540 640 504" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="600" y="548" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#c62828">retry</text>

  <line x1="600" y1="604" x2="600" y2="636" stroke="#1a1a2e" stroke-width="2.5"/>
  <path d="M600 636 L590 622 L610 622 Z" fill="#1a1a2e"/>

  <rect x="220" y="644" width="760" height="72" rx="14" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="600" y="674" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Every transition &#8594; RuntimeEvent</text>
  <text x="600" y="698" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">policy &#183; observability &#183; recovery &#183; HITL</text>

  <line x1="320" y1="716" x2="320" y2="748" stroke="#1a5fb4" stroke-width="2"/>
  <line x1="480" y1="716" x2="480" y2="748" stroke="#1a5fb4" stroke-width="2"/>
  <line x1="720" y1="716" x2="720" y2="748" stroke="#1a5fb4" stroke-width="2"/>
  <line x1="880" y1="716" x2="880" y2="748" stroke="#1a5fb4" stroke-width="2"/>

  <rect x="240" y="752" width="160" height="44" rx="8" fill="#ffffff" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="320" y="780" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#1a1a2e">Policy</text>
  <rect x="400" y="752" width="160" height="44" rx="8" fill="#ffffff" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="480" y="780" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#1a1a2e">Observability</text>
  <rect x="640" y="752" width="160" height="44" rx="8" fill="#ffffff" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="720" y="780" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#1a1a2e">Recovery</text>
  <rect x="800" y="752" width="160" height="44" rx="8" fill="#ffffff" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="880" y="780" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#1a1a2e">HITL</text>

  <text x="600" y="848" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#5b6f82">Conceptual lifecycle &#8212; not a runtime state enum.</text>
</svg>
