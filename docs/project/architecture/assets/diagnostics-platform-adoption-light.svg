<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img">
  <title>Application and scenario diagnostic adoption</title>
  <desc>Canonical paths through HarnessHostRuntime and ScenarioRuntimeBaseline versus forbidden local bypasses.</desc>
  <rect width="1200" height="700" fill="#f6f8fb"/>
  <rect x="24" y="24" width="1152" height="652" rx="20" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="600" y="58" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#1a1a2e">Application + scenario adoption paths</text>
  <rect x="80" y="110" width="420" height="90" rx="12" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="290" y="145" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a2e">Tier-3 Application</text>
  <text x="290" y="175" text-anchor="middle" font-size="14" fill="#3d4f66">factory ’ build_harness_host_runtime</text>
  <rect x="700" y="110" width="420" height="90" rx="12" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="910" y="145" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a2e">Scenario application</text>
  <text x="910" y="175" text-anchor="middle" font-size="14" fill="#3d4f66">ScenarioRuntimeBaseline facade</text>
  <line x1="290" y1="200" x2="290" y2="260" stroke="#1a5fb4" stroke-width="2"/>
  <line x1="910" y1="200" x2="910" y2="260" stroke="#1a5fb4" stroke-width="2"/>
  <rect x="140" y="260" width="300" height="70" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="290" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Central Diagnostics</text>
  <rect x="720" y="260" width="300" height="70" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="870" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Central Diagnostics</text>
  <line x1="290" y1="330" x2="600" y2="400" stroke="#2e7d32" stroke-width="2"/>
  <line x1="870" y1="330" x2="600" y2="400" stroke="#2e7d32" stroke-width="2"/>
  <rect x="350" y="400" width="500" height="64" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="600" y="438" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a2e">Shared terminal trigger + ProblemPersistence</text>
  <rect x="80" y="500" width="1040" height="140" rx="12" fill="#fafafa" stroke="#c62828" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="600" y="535" text-anchor="middle" font-size="16" font-weight="700" fill="#c62828">Forbidden bypass (conformance gates reject)</text>
  <text x="200" y="575" font-size="14" fill="#3d4f66">local GraphExecutor</text>
  <text x="480" y="575" font-size="14" fill="#3d4f66">local DiagnosticOrchestrator</text>
  <text x="800" y="575" font-size="14" fill="#3d4f66">local Problem Store</text>
  <text x="350" y="610" font-size="14" fill="#3d4f66">manual NexusLoop() in factory</text>
  <text x="720" y="610" font-size="14" fill="#3d4f66">manual terminal RuntimeEvent publisher</text>
</svg>
