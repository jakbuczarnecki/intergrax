  <text x="780" y="880" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e">rollback</text>

  <rect x="120" y="940" width="960" height="72" rx="14" fill="#fff8e1" stroke="#c9a227" stroke-width="2"/>
  <text x="600" y="972" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e">Adaptation is versioned promotion, not silent mutation.</text>
