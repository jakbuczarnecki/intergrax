<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img">
  <title>Challenge revision boundary</title>
  <desc>Verification challenges flow to Decision Lifecycle revision creating new versions.</desc>
  <rect width="1200" height="760" fill="#0d1117"/>
  <rect x="32" y="28" width="1136" height="704" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#e6edf3">Challenge → Revision Boundary</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#8b949e">Verification proposes — Lifecycle revises</text>
  <rect x="140" y="170" width="280" height="56" rx="12" fill="#2d1f47" stroke="#a371f7" stroke-width="2"/>
  <text x="280" y="204" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Verification Result</text>
  <line x1="420" y1="198" x2="500" y2="198" stroke="#58a6ff" stroke-width="2"/>
  <path d="M500 198 L494 184 L506 184 Z" fill="#58a6ff"/>
  <rect x="500" y="170" width="220" height="56" rx="12" fill="#3d1f24" stroke="#f85149" stroke-width="2"/>
  <text x="610" y="204" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Challenge / revision request</text>
  <line x1="720" y1="198" x2="800" y2="198" stroke="#58a6ff" stroke-width="2"/>
  <path d="M800 198 L794 184 L806 184 Z" fill="#58a6ff"/>
  <rect x="800" y="170" width="260" height="56" rx="12" fill="#3d2a14" stroke="#db6d28" stroke-width="2"/>
  <text x="930" y="204" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Decision Lifecycle Revision</text>
  <line x1="930" y1="226" x2="930" y2="280" stroke="#58a6ff" stroke-width="2"/>
  <path d="M930 280 L924 266 L936 266 Z" fill="#58a6ff"/>
  <rect x="800" y="280" width="260" height="56" rx="12" fill="#1f2a44" stroke="#58a6ff" stroke-width="2"/>
  <text x="930" y="314" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">New Decision Version</text>
  <text x="600" y="400" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">Bounded revision loop — separate from technical retry</text>
  <text x="600" y="430" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">Verification does NOT mutate candidate versions in place</text>
</svg>
