<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img">
  <title>Participant independence</title>
  <desc>Producer verifier separation and configurable context visibility for deliberation participants.</desc>
  <rect width="1200" height="780" fill="#f6f8fb"/>
  <rect x="32" y="28" width="1136" height="724" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#1a1a2e">Participant Independence & Context Visibility</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#3d4f66">Configured roles — not hard-coded personas</text>
  <rect x="120" y="160" width="240" height="72" rx="12" fill="#fff8e1" stroke="#c9a227" stroke-width="2"/>
  <text x="240" y="188" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Producer profile</text>
  <text x="240" y="208" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">generates proposal</text>
  <rect x="420" y="160" width="240" height="72" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="540" y="188" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Verifier profile</text>
  <text x="540" y="208" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">independent model/provider</text>
  <rect x="720" y="160" width="360" height="72" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="900" y="188" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Context visibility policy</text>
  <text x="900" y="208" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">what each role may see</text>
  <text x="600" y="320" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">Meaningful independence — self-judge modes must be explicit</text>
  <text x="600" y="350" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">Role configuration via strategy contract — not giant if-strategy branches</text>
</svg>
