<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img">
  <title>Intergrax Unified Execution Runtime lifecycle</title>
  <desc>Conceptual diagram: Nexus decides what executes; UER defines how execution behaves. Task to Run to Attempt hierarchy with retry, RuntimeEvents on every transition, and subscribers for policy, observability, recovery, and HITL.</desc>
  <rect width="1200" height="900" fill="#0d1117"/>
  <rect x="32" y="28" width="1136" height="844" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#e6edf3">Unified Execution Runtime &#8212; lifecycle</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#8b949e">Nexus decides what executes &#183; UER defines how execution behaves</text>

  <rect x="180" y="128" width="360" height="64" rx="12" fill="#1c2d4a" stroke="#58a6ff" stroke-width="2"/>
  <text x="360" y="158" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">Nexus</text>
  <text x="360" y="180" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">What should execute next?</text>

  <rect x="660" y="128" width="360" height="64" rx="12" fill="#3d2f00" stroke="#d29922" stroke-width="2"/>
  <text x="840" y="158" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">UER</text>
  <text x="840" y="180" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">How execution behaves</text>

  <rect x="470" y="220" width="260" height="56" rx="12" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
  <text x="600" y="246" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">TASK</text>
  <text x="600" y="266" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">user / system intent</text>

  <line x1="600" y1="276" x2="600" y2="304" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 304 L590 290 L610 290 Z" fill="#e6edf3"/>

  <rect x="470" y="308" width="260" height="56" rx="12" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
  <text x="600" y="334" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">RUN</text>
  <text x="600" y="354" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">one execution lifecycle</text>

  <line x1="520" y1="364" x2="380" y2="400" stroke="#e6edf3" stroke-width="2"/>
  <path d="M380 400 L392 388 L396 404 Z" fill="#e6edf3"/>
  <line x1="680" y1="364" x2="820" y2="400" stroke="#e6edf3" stroke-width="2"/>
  <path d="M820 400 L808 388 L804 404 Z" fill="#e6edf3"/>

  <rect x="200" y="404" width="360" height="200" rx="14" fill="#3d1f24" stroke="#f85149" stroke-width="2"/>
  <text x="380" y="434" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Attempt 1</text>
  <text x="380" y="462" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">execute</text>
  <text x="380" y="486" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">RuntimeEvents</text>
  <text x="380" y="510" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#f85149" font-weight="600">failure</text>
  <text x="380" y="580" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">same TaskId + RunId</text>

  <rect x="640" y="404" width="360" height="200" rx="14" fill="#1a3324" stroke="#3fb950" stroke-width="2"/>
  <text x="820" y="434" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Attempt 2</text>
  <text x="820" y="462" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">retry / resume</text>
  <text x="820" y="486" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">execute &#183; validate</text>
  <text x="820" y="510" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3fb950" font-weight="600">complete</text>
  <text x="820" y="580" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">new AttemptId on retry</text>

  <path d="M560 504 Q600 540 640 504" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="600" y="548" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#f85149">retry</text>

  <line x1="600" y1="604" x2="600" y2="636" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 636 L590 622 L610 622 Z" fill="#e6edf3"/>

  <rect x="220" y="644" width="760" height="72" rx="14" fill="#1c2d4a" stroke="#58a6ff" stroke-width="2"/>
  <text x="600" y="674" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Every transition &#8594; RuntimeEvent</text>
  <text x="600" y="698" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">policy &#183; observability &#183; recovery &#183; HITL</text>

  <line x1="320" y1="716" x2="320" y2="748" stroke="#58a6ff" stroke-width="2"/>
  <line x1="480" y1="716" x2="480" y2="748" stroke="#58a6ff" stroke-width="2"/>
  <line x1="720" y1="716" x2="720" y2="748" stroke="#58a6ff" stroke-width="2"/>
  <line x1="880" y1="716" x2="880" y2="748" stroke="#58a6ff" stroke-width="2"/>

  <rect x="240" y="752" width="160" height="44" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="320" y="780" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#e6edf3">Policy</text>
  <rect x="400" y="752" width="160" height="44" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="480" y="780" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#e6edf3">Observability</text>
  <rect x="640" y="752" width="160" height="44" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="720" y="780" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#e6edf3">Recovery</text>
  <rect x="800" y="752" width="160" height="44" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="880" y="780" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#e6edf3">HITL</text>

  <text x="600" y="848" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">Conceptual lifecycle &#8212; not a runtime state enum.</text>
</svg>
