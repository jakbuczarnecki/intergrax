<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img">
  <title>Intergrax Nexus Execution Flow</title>
  <desc>Conceptual task path: Client through Tier-3 Host, UnifiedTaskRunner, NexusLoop, intake, planning, graph execution, AgentRouter, AgentEngine and UAEP, Context and Tools, decision, retry HITL handoff merge, to TaskResult.</desc>
  <rect width="1200" height="980" fill="#f6f8fb"/>
  <rect x="32" y="28" width="1136" height="924" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#1a1a2e">Nexus Execution Flow &#8212; Task to TaskResult</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#3d4f66">Unified Execution Runtime defines how execution behaves &#183; Nexus defines how a task moves through the platform</text>

  <rect x="470" y="128" width="260" height="52" rx="12" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="600" y="158" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e">Client / Surface</text>
  <text x="600" y="176" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#3d4f66">HTTP &#183; MCP &#183; queue &#183; scheduler</text>

  <line x1="600" y1="180" x2="600" y2="200" stroke="#1a1a2e" stroke-width="2.5"/>
  <path d="M600 200 L590 186 L610 186 Z" fill="#1a1a2e"/>

  <rect x="470" y="204" width="260" height="48" rx="12" fill="#f0f4f8" stroke="#5b6f82" stroke-width="2"/>
  <text x="600" y="234" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#1a1a2e">Tier-3 Host</text>

  <line x1="600" y1="252" x2="600" y2="268" stroke="#1a1a2e" stroke-width="2.5"/>
  <path d="M600 268 L590 244 L610 244 Z" fill="#1a1a2e"/>

  <rect x="430" y="272" width="340" height="48" rx="12" fill="#f0f4f8" stroke="#5b6f82" stroke-width="2"/>
  <text x="600" y="300" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#1a1a2e">UnifiedTaskRunner</text>

  <line x1="600" y1="280" x2="600" y2="268" stroke="#1a1a2e" stroke-width="2.5"/>

  <line x1="600" y1="320" x2="600" y2="336" stroke="#1a1a2e" stroke-width="2.5"/>
  <path d="M600 336 L590 322 L610 322 Z" fill="#1a1a2e"/>

  <rect x="430" y="340" width="340" height="56" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="600" y="368" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#1a1a2e">NexusLoop</text>
  <text x="600" y="388" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">Tier-1 control-flow coordinator</text>

  <line x1="360" y1="396" x2="360" y2="420" stroke="#2e7d32" stroke-width="2"/>
  <line x1="600" y1="396" x2="600" y2="420" stroke="#2e7d32" stroke-width="2"/>
  <line x1="840" y1="396" x2="840" y2="420" stroke="#2e7d32" stroke-width="2"/>

  <rect x="260" y="424" width="200" height="48" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="360" y="452" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#1a1a2e">Intake</text>

  <rect x="500" y="424" width="200" height="48" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="600" y="452" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#1a1a2e">Plan</text>

  <rect x="740" y="424" width="200" height="48" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="840" y="452" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#1a1a2e">Graph</text>

  <line x1="840" y1="472" x2="600" y2="500" stroke="#2e7d32" stroke-width="2"/>
  <path d="M600 500 L612 488 L612 504 Z" fill="#2e7d32"/>

  <rect x="430" y="504" width="340" height="48" rx="12" fill="#fff8e1" stroke="#c9a227" stroke-width="2"/>
  <text x="600" y="534" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#1a1a2e">AgentRouter</text>

  <line x1="600" y1="552" x2="600" y2="568" stroke="#1a1a2e" stroke-width="2.5"/>
  <path d="M600 568 L590 556 L610 556 Z" fill="#1a1a2e"/>

  <rect x="380" y="572" width="440" height="56" rx="14" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="600" y="600" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">AgentEngine / UAEP</text>
  <text x="600" y="620" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">steps inside one graph node</text>

  <line x1="480" y1="628" x2="400" y2="656" stroke="#1a5fb4" stroke-width="2"/>
  <line x1="720" y1="628" x2="800" y2="656" stroke="#1a5fb4" stroke-width="2"/>

  <rect x="280" y="660" width="240" height="48" rx="10" fill="#ffffff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="400" y="688" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#1a1a2e">Context Engineering</text>

  <rect x="680" y="660" width="240" height="48" rx="10" fill="#ffffff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="800" y="688" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#1a1a2e">Tools / LLM</text>

  <line x1="400" y1="708" x2="520" y2="736" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="800" y1="708" x2="680" y2="736" stroke="#1a1a2e" stroke-width="2"/>

  <rect x="430" y="740" width="340" height="48" rx="12" fill="#f0f4f8" stroke="#5b6f82" stroke-width="2"/>
  <text x="600" y="770" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#1a1a2e">Validation / Decision</text>

  <line x1="600" y1="788" x2="600" y2="804" stroke="#1a1a2e" stroke-width="2.5"/>
  <path d="M600 804 L590 810 L610 810 Z" fill="#1a1a2e"/>

  <rect x="300" y="812" width="600" height="48" rx="12" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="600" y="840" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">retry &#183; HITL &#183; handoff &#183; merge &#183; partial result</text>

  <line x1="600" y1="860" x2="600" y2="876" stroke="#1a1a2e" stroke-width="2.5"/>
  <path d="M600 876 L590 862 L610 862 Z" fill="#1a1a2e"/>

  <rect x="430" y="880" width="340" height="52" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="600" y="912" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#1a1a2e">TaskResult</text>

  <text x="600" y="952" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#5b6f82">Conceptual control-flow &#8212; not a runtime class diagram.</text>
</svg>
