<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img">
  <title>Intergrax Agent Contracts and Assembly</title>
  <desc>Conceptual diagram: AgentContract declares capabilities, permissions, and limits; author implements domain behavior via on_next_step; platform executes through Policy, Tools, Memory gateways, HarnessKernel, AgentRuntime, and Nexus routing.</desc>
  <rect width="1200" height="980" fill="#f6f8fb"/>
  <rect x="32" y="28" width="1136" height="924" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#1a1a2e">Intergrax Agent Contracts &#38; Assembly</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#3d4f66">Contract declares &#183; author decides &#183; platform executes safely</text>

  <rect x="430" y="132" width="340" height="52" rx="12" fill="#fff8e1" stroke="#c9a227" stroke-width="2.5"/>
  <text x="600" y="164" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#1a1a2e">AgentContract</text>

  <line x1="600" y1="184" x2="600" y2="208" stroke="#c9a227" stroke-width="2"/>
  <line x1="200" y1="208" x2="1000" y2="208" stroke="#c9a227" stroke-width="2"/>
  <line x1="200" y1="208" x2="200" y2="232" stroke="#c9a227" stroke-width="2"/>
  <line x1="600" y1="208" x2="600" y2="232" stroke="#c9a227" stroke-width="2"/>
  <line x1="1000" y1="208" x2="1000" y2="232" stroke="#c9a227" stroke-width="2"/>

  <rect x="120" y="236" width="160" height="44" rx="10" fill="#ffffff" stroke="#c9a227" stroke-width="2"/>
  <text x="200" y="264" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#1a1a2e">Capabilities</text>

  <rect x="520" y="236" width="160" height="44" rx="10" fill="#ffffff" stroke="#c9a227" stroke-width="2"/>
  <text x="600" y="264" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#1a1a2e">Permissions</text>

  <rect x="920" y="236" width="160" height="44" rx="10" fill="#ffffff" stroke="#c9a227" stroke-width="2"/>
  <text x="1000" y="264" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#1a1a2e">Limits / risk</text>

  <line x1="600" y1="280" x2="600" y2="304" stroke="#1a1a2e" stroke-width="2.5"/>
  <path d="M600 304 L590 290 L610 290 Z" fill="#1a1a2e"/>

  <rect x="360" y="308" width="480" height="48" rx="12" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="600" y="338" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#1a1a2e">Agent implementation (author domain behavior)</text>

  <line x1="600" y1="348" x2="600" y2="372" stroke="#1a1a2e" stroke-width="2.5"/>
  <path d="M600 372 L590 358 L610 358 Z" fill="#1a1a2e"/>

  <rect x="400" y="376" width="400" height="48" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="600" y="406" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">on_next_step()</text>

  <line x1="600" y1="424" x2="600" y2="448" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="200" y1="448" x2="1000" y2="448" stroke="#5b6f82" stroke-width="2"/>
  <line x1="200" y1="448" x2="200" y2="472" stroke="#5b6f82" stroke-width="2"/>
  <line x1="600" y1="448" x2="600" y2="472" stroke="#5b6f82" stroke-width="2"/>
  <line x1="1000" y1="448" x2="1000" y2="472" stroke="#5b6f82" stroke-width="2"/>

  <rect x="120" y="476" width="160" height="44" rx="10" fill="#ffffff" stroke="#5b6f82" stroke-width="2"/>
