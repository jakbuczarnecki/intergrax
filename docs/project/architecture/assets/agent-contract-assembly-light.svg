  <rect x="520" y="476" width="160" height="44" rx="10" fill="#ffffff" stroke="#5b6f82" stroke-width="2"/>
  <text x="600" y="504" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#1a1a2e">Tools</text>

  <rect x="920" y="476" width="160" height="44" rx="10" fill="#ffffff" stroke="#5b6f82" stroke-width="2"/>
  <text x="1000" y="504" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#1a1a2e">Memory</text>

  <line x1="600" y1="528" x2="600" y2="552" stroke="#1a1a2e" stroke-width="2.5"/>
  <path d="M600 552 L590 538 L610 538 Z" fill="#1a1a2e"/>

  <rect x="380" y="556" width="440" height="48" rx="12" fill="#f0f4f8" stroke="#5b6f82" stroke-width="2"/>
  <text x="600" y="586" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e">HarnessKernel</text>

  <line x1="600" y1="604" x2="600" y2="628" stroke="#1a1a2e" stroke-width="2.5"/>
  <path d="M600 628 L590 614 L610 614 Z" fill="#1a1a2e"/>

  <rect x="400" y="632" width="400" height="48" rx="12" fill="#f0f4f8" stroke="#5b6f82" stroke-width="2"/>
  <text x="600" y="658" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e">AgentRuntime</text>

  <line x1="600" y1="680" x2="600" y2="704" stroke="#1a1a2e" stroke-width="2.5"/>
  <path d="M600 704 L590 710 L610 710 Z" fill="#1a1a2e"/>

  <rect x="430" y="708" width="340" height="48" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="600" y="738" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Nexus</text>

  <rect x="120" y="792" width="960" height="72" rx="12" fill="#eef4ff" stroke="#1a5fb4" stroke-width="1.5"/>
  <text x="600" y="822" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#1a1a2e">Author owns domain behavior &#160;&#160;&#183;&#160;&#160; Platform owns safe execution</text>
  <text x="600" y="852" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">Agent &#8800; runtime &#8212; Nexus decides when / where the agent runs</text>

  <text x="600" y="928" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#5b6f82">Conceptual architecture &#8212; not a class diagram.</text>
</svg>
