<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img">
  <title>Intergrax Modality three planes</title>
  <desc>Conceptual diagram: Modality splits into Plane A generative LLM reasoning, Plane B media-to-knowledge ingest, and Plane C dedicated model inference behind ToolRuntime. Multimodal does not mean one runtime path.</desc>
  <rect width="1200" height="820" fill="#f6f8fb"/>
  <rect x="32" y="28" width="1136" height="764" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="30" font-weight="700" fill="#1a1a2e">Intergrax Modality &#8212; three execution planes</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" fill="#3d4f66">Multimodal does not mean one runtime path</text>

  <rect x="480" y="128" width="240" height="56" rx="12" fill="#f0f4f8" stroke="#5b6f82" stroke-width="2"/>
  <text x="600" y="162" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#1a1a2e">MODALITY</text>

  <line x1="600" y1="184" x2="600" y2="208" stroke="#1a1a2e" stroke-width="2.5"/>
  <line x1="220" y1="208" x2="980" y2="208" stroke="#1a1a2e" stroke-width="2.5"/>
  <line x1="220" y1="208" x2="220" y2="232" stroke="#1a1a2e" stroke-width="2.5"/>
  <line x1="600" y1="208" x2="600" y2="232" stroke="#1a1a2e" stroke-width="2.5"/>
  <line x1="980" y1="208" x2="980" y2="232" stroke="#1a1a2e" stroke-width="2.5"/>

  <rect x="80" y="236" width="280" height="88" rx="14" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2.5"/>
  <text x="220" y="268" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#1a1a2e">Plane A</text>
  <text x="220" y="294" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">Generative multimodal LLM</text>
  <text x="220" y="312" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#5b6f82">reason over media in dialog</text>

  <rect x="460" y="236" width="280" height="88" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="600" y="268" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#1a1a2e">Plane B</text>
  <text x="600" y="294" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">Media &#8594; knowledge</text>
  <text x="600" y="312" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#5b6f82">ingest, parse, transcribe</text>

  <rect x="840" y="236" width="280" height="88" rx="14" fill="#fff8e1" stroke="#c9a227" stroke-width="2.5"/>
  <text x="980" y="268" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#1a1a2e">Plane C</text>
  <text x="980" y="294" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">Dedicated ML inference</text>
  <text x="980" y="312" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#5b6f82">CV, classical ML, speech tools</text>

  <line x1="220" y1="324" x2="220" y2="352" stroke="#1a5fb4" stroke-width="2"/>
  <line x1="600" y1="324" x2="600" y2="352" stroke="#2e7d32" stroke-width="2"/>
  <line x1="980" y1="324" x2="980" y2="352" stroke="#c9a227" stroke-width="2"/>

  <rect x="100" y="356" width="240" height="48" rx="10" fill="#ffffff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="220" y="386" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1a1a2e">LLMAdapter</text>

  <rect x="480" y="356" width="240" height="48" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="600" y="386" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1a1a2e">parsers / loaders</text>

  <rect x="860" y="356" width="240" height="48" rx="10" fill="#ffffff" stroke="#c9a227" stroke-width="2"/>
  <text x="980" y="386" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#1a1a2e">model_inference</text>

  <line x1="220" y1="404" x2="220" y2="428" stroke="#1a5fb4" stroke-width="2"/>
  <line x1="600" y1="404" x2="600" y2="428" stroke="#2e7d32" stroke-width="2"/>
  <line x1="980" y1="404" x2="980" y2="428" stroke="#c9a227" stroke-width="2"/>

  <rect x="100" y="432" width="240" height="48" rx="10" fill="#f0f4f8" stroke="#5b6f82" stroke-width="1.5"/>
  <text x="220" y="462" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#1a1a2e">reasoning</text>

  <rect x="480" y="432" width="240" height="48" rx="10" fill="#f0f4f8" stroke="#5b6f82" stroke-width="1.5"/>
  <text x="600" y="462" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#1a1a2e">RAG / knowledge</text>

  <rect x="860" y="432" width="240" height="48" rx="10" fill="#f0f4f8" stroke="#5b6f82" stroke-width="1.5"/>
  <text x="980" y="462" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#1a1a2e">Tools</text>

  <line x1="980" y1="480" x2="980" y2="504" stroke="#c9a227" stroke-width="2"/>
  <path d="M980 504 L970 490 L990 490 Z" fill="#c9a227"/>

  <rect x="860" y="508" width="240" height="48" rx="10" fill="#ffffff" stroke="#c9a227" stroke-width="2"/>
  <text x="980" y="538" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e">ToolRuntime</text>

  <rect x="180" y="600" width="840" height="56" rx="12" fill="#fef3f2" stroke="#cf222e" stroke-width="2"/>
  <text x="600" y="634" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e">Multimodal reasoning &#8800; media ingest &#8800; dedicated inference</text>

  <text x="600" y="700" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">Plane A &#8594; reason over media &#160;&#160;|&#160;&#160; Plane B &#8594; turn media into knowledge &#160;&#160;|&#160;&#160; Plane C &#8594; run specialized models</text>
  <text x="600" y="728" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#5b6f82">Integration supplies backend substrate; Modality defines execution plane and agent access path</text>
</svg>
