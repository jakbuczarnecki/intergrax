<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" role="img">
  <title>Verification Pipeline</title>
  <desc>Composable verification stages from structural through probabilistic to Verification Result.</desc>
  <rect width="1200" height="1040" fill="#f6f8fb"/>
  <rect x="32" y="28" width="1136" height="984" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#1a1a2e">Verification Pipeline</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#3d4f66">Composable stages — deterministic before probabilistic</text>
  <rect x="420" y="130" width="360" height="44" rx="12" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="600" y="158" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Candidate Decision Version</text>
  <line x1="600" y1="174" x2="600" y2="198" stroke="#1a5fb4" stroke-width="2"/>
  <path d="M600 198 L594 184 L606 184 Z" fill="#1a5fb4"/>
  <rect x="280" y="198" width="640" height="52" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="600" y="230" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Structural / schema verification</text>
  <line x1="600" y1="250" x2="600" y2="274" stroke="#1a5fb4" stroke-width="2"/>
  <path d="M600 274 L594 260 L606 260 Z" fill="#1a5fb4"/>
  <rect x="280" y="274" width="640" height="52" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="600" y="306" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Deterministic validation</text>
  <line x1="600" y1="326" x2="600" y2="350" stroke="#1a5fb4" stroke-width="2"/>
  <path d="M600 350 L594 336 L606 336 Z" fill="#1a5fb4"/>
  <rect x="260" y="350" width="680" height="52" rx="12" fill="#fff8e1" stroke="#c9a227" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="600" y="382" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Evidence verification</text>
  <line x1="600" y1="402" x2="600" y2="426" stroke="#1a5fb4" stroke-width="2"/>
  <path d="M600 426 L594 412 L606 412 Z" fill="#1a5fb4"/>
  <rect x="260" y="426" width="680" height="52" rx="12" fill="#fff8e1" stroke="#c9a227" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="600" y="458" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Semantic / trajectory / independent</text>
  <line x1="600" y1="478" x2="600" y2="502" stroke="#1a5fb4" stroke-width="2"/>
  <path d="M600 502 L594 488 L606 488 Z" fill="#1a5fb4"/>
  <rect x="360" y="502" width="480" height="52" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="600" y="534" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Verification Result</text>
  <text x="600" y="600" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">Verification checks — does not finalize, authorize, execute, or own global retry</text>
  <text x="600" y="630" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">Producer / verifier independence required for probabilistic stages</text>
</svg>
