<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img">
  <title>Disagreement synthesis</title>
  <desc>Structured disagreement preserved through synthesis to verification.</desc>
  <rect width="1200" height="820" fill="#0d1117"/>
  <rect x="32" y="28" width="1136" height="764" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#e6edf3">Disagreement → Synthesis</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#8b949e">Preserve dissent — synthesis is not erasure</text>
  <rect x="160" y="170" width="880" height="56" rx="12" fill="#2d1f47" stroke="#a371f7" stroke-width="2"/>
  <text x="600" y="204" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Structured disagreement artifact</text>
  <rect x="120" y="270" width="240" height="48" rx="12" fill="#1f2a44" stroke="#58a6ff" stroke-width="2"/>
  <text x="240" y="300" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">positions</text>
  <rect x="400" y="270" width="240" height="48" rx="12" fill="#1f2a44" stroke="#58a6ff" stroke-width="2"/>
  <text x="520" y="300" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">alternatives</text>
  <rect x="680" y="270" width="240" height="48" rx="12" fill="#1f2a44" stroke="#58a6ff" stroke-width="2"/>
  <text x="800" y="300" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">unresolved questions</text>
  <line x1="600" y1="318" x2="600" y2="360" stroke="#58a6ff" stroke-width="2"/>
  <path d="M600 360 L594 346 L606 346 Z" fill="#58a6ff"/>
  <rect x="280" y="360" width="640" height="56" rx="12" fill="#1b3a1f" stroke="#3fb950" stroke-width="2"/>
  <text x="600" y="388" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Synthesis candidate</text>
  <text x="600" y="408" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">feeds Verification — not final authority alone</text>
  <text x="600" y="480" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">UNRESOLVED remains valid when synthesis cannot reconcile conflict</text>
</svg>
