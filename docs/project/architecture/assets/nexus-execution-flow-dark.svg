<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img">
  <title>Intergrax Nexus Execution Flow</title>
  <desc>Conceptual task path: Client through Tier-3 Host, UnifiedTaskRunner, NexusLoop, intake, planning, graph execution, AgentRouter, AgentEngine and UAEP, Context and Tools, decision, retry HITL handoff merge, to TaskResult.</desc>
  <rect width="1200" height="980" fill="#0d1117"/>
  <rect x="32" y="28" width="1136" height="924" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#e6edf3">Nexus Execution Flow &#8212; Task to TaskResult</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#8b949e">Unified Execution Runtime defines how execution behaves &#183; Nexus defines how a task moves through the platform</text>

  <rect x="470" y="128" width="260" height="52" rx="12" fill="#1c2d4a" stroke="#58a6ff" stroke-width="2"/>
  <text x="600" y="158" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Client / Surface</text>
  <text x="600" y="176" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">HTTP &#183; MCP &#183; queue &#183; scheduler</text>

  <line x1="600" y1="180" x2="600" y2="200" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 200 L590 186 L610 186 Z" fill="#e6edf3"/>

  <rect x="470" y="204" width="260" height="48" rx="12" fill="#21262d" stroke="#484f58" stroke-width="2"/>
  <text x="600" y="234" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Tier-3 Host</text>

  <line x1="600" y1="252" x2="600" y2="268" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 268 L590 244 L610 244 Z" fill="#e6edf3"/>

  <rect x="430" y="272" width="340" height="48" rx="12" fill="#21262d" stroke="#484f58" stroke-width="2"/>
  <text x="600" y="300" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">UnifiedTaskRunner</text>

  <line x1="600" y1="320" x2="600" y2="336" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 336 L590 322 L610 322 Z" fill="#e6edf3"/>

  <rect x="430" y="340" width="340" height="56" rx="14" fill="#1a3324" stroke="#3fb950" stroke-width="2.5"/>
  <text x="600" y="368" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">NexusLoop</text>
  <text x="600" y="388" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">Tier-1 control-flow coordinator</text>

  <line x1="360" y1="396" x2="360" y2="420" stroke="#3fb950" stroke-width="2"/>
  <line x1="600" y1="396" x2="600" y2="420" stroke="#3fb950" stroke-width="2"/>
  <line x1="840" y1="396" x2="840" y2="420" stroke="#3fb950" stroke-width="2"/>

  <rect x="260" y="424" width="200" height="48" rx="10" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="360" y="452" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Intake</text>

  <rect x="500" y="424" width="200" height="48" rx="10" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="600" y="452" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Plan</text>

  <rect x="740" y="424" width="200" height="48" rx="10" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="840" y="452" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Graph</text>

  <line x1="840" y1="472" x2="600" y2="500" stroke="#3fb950" stroke-width="2"/>
  <path d="M600 500 L612 488 L612 504 Z" fill="#3fb950"/>

  <rect x="430" y="504" width="340" height="48" rx="12" fill="#3d2f1f" stroke="#d29922" stroke-width="2"/>
  <text x="600" y="534" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">AgentRouter</text>

  <line x1="600" y1="552" x2="600" y2="568" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 568 L590 556 L610 556 Z" fill="#e6edf3"/>

  <rect x="380" y="572" width="440" height="56" rx="14" fill="#1c2d4a" stroke="#58a6ff" stroke-width="2"/>
  <text x="600" y="600" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">AgentEngine / UAEP</text>
  <text x="600" y="620" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">steps inside one graph node</text>

  <line x1="480" y1="628" x2="400" y2="656" stroke="#58a6ff" stroke-width="2"/>
  <line x1="720" y1="628" x2="800" y2="656" stroke="#58a6ff" stroke-width="2"/>

  <rect x="280" y="660" width="240" height="48" rx="10" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="400" y="688" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Context Engineering</text>

  <rect x="680" y="660" width="240" height="48" rx="10" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="800" y="688" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Tools / LLM</text>

  <line x1="400" y1="708" x2="520" y2="736" stroke="#e6edf3" stroke-width="2"/>
  <line x1="800" y1="708" x2="680" y2="736" stroke="#e6edf3" stroke-width="2"/>

  <rect x="430" y="740" width="340" height="48" rx="12" fill="#21262d" stroke="#484f58" stroke-width="2"/>
  <text x="600" y="770" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">Validation / Decision</text>

  <line x1="600" y1="788" x2="600" y2="804" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 804 L590 810 L610 810 Z" fill="#e6edf3"/>

  <rect x="300" y="812" width="600" height="48" rx="12" fill="#3d1f1f" stroke="#f85149" stroke-width="1.5"/>
  <text x="600" y="840" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">retry &#183; HITL &#183; handoff &#183; merge &#183; partial result</text>

  <line x1="600" y1="860" x2="600" y2="876" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 876 L590 862 L610 862 Z" fill="#e6edf3"/>

  <rect x="430" y="880" width="340" height="52" rx="14" fill="#1a3324" stroke="#3fb950" stroke-width="2.5"/>
  <text x="600" y="912" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">TaskResult</text>

  <text x="600" y="952" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">Conceptual control-flow &#8212; not a runtime class diagram.</text>
</svg>
