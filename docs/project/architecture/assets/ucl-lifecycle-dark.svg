<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" role="img">
  <title>Intergrax Unified Context Lifecycle &#8212; ownership and runtime flow</title>
  <desc>Conceptual diagram: Memory owns durable ledger and revisions; Context Engineering produces ContextPlan and global budget; Nexus coordinates artifact lookup with reuse on hit or reservation and create on miss; Token Optimization executes bounded internal transformation only on create; final compile returns to Context Engineering before the Agent or LLM.</desc>
  <rect width="1200" height="1040" fill="#0d1117"/>
  <rect x="32" y="28" width="1136" height="984" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <text x="600" y="68" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#e6edf3">Unified Context Lifecycle &#8212; ownership + runtime flow</text>
  <text x="600" y="98" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" fill="#8b949e">Cross-domain coordination &#8212; UCL is not a second context engine, memory store, or summarizer</text>

  <rect x="420" y="120" width="360" height="56" rx="12" fill="#1a3324" stroke="#3fb950" stroke-width="2"/>
  <text x="600" y="144" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">Memory</text>
  <text x="600" y="166" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Durable ledger + revisions</text>

  <line x1="600" y1="176" x2="600" y2="204" stroke="#8b949e" stroke-width="2"/>
  <path d="M600 204 L594 190 L606 190 Z" fill="#8b949e"/>

  <rect x="420" y="204" width="360" height="56" rx="12" fill="#3d3419" stroke="#d4a72c" stroke-width="2"/>
  <text x="600" y="228" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">Context Engineering</text>
  <text x="600" y="250" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">ContextPlan + global budget</text>

  <line x1="600" y1="260" x2="600" y2="288" stroke="#8b949e" stroke-width="2"/>
  <path d="M600 288 L594 274 L606 274 Z" fill="#8b949e"/>

  <rect x="420" y="288" width="360" height="56" rx="12" fill="#1c2d4a" stroke="#58a6ff" stroke-width="2"/>
  <text x="600" y="312" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">Nexus</text>
  <text x="600" y="334" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Lifecycle coordination</text>

  <line x1="600" y1="344" x2="600" y2="372" stroke="#8b949e" stroke-width="2"/>
  <path d="M600 372 L594 358 L606 358 Z" fill="#8b949e"/>

  <rect x="460" y="372" width="280" height="44" rx="10" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
  <text x="600" y="400" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Artifact lookup</text>

  <line x1="600" y1="416" x2="600" y2="444" stroke="#8b949e" stroke-width="2"/>
  <line x1="600" y1="444" x2="320" y2="444" stroke="#8b949e" stroke-width="2"/>
  <line x1="600" y1="444" x2="880" y2="444" stroke="#8b949e" stroke-width="2"/>
  <line x1="320" y1="444" x2="320" y2="472" stroke="#8b949e" stroke-width="2"/>
  <line x1="880" y1="444" x2="880" y2="472" stroke="#8b949e" stroke-width="2"/>
  <path d="M320 472 L314 458 L326 458 Z" fill="#8b949e"/>
  <path d="M880 472 L874 458 L886 458 Z" fill="#8b949e"/>

  <rect x="180" y="472" width="280" height="52" rx="10" fill="#1a3324" stroke="#3fb950" stroke-width="2"/>
  <text x="320" y="496" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">HIT</text>
  <text x="320" y="516" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3fb950">REUSE_ARTIFACT</text>

  <rect x="740" y="472" width="280" height="52" rx="10" fill="#3d2817" stroke="#f0883e" stroke-width="2"/>
  <text x="880" y="496" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">MISS</text>
  <text x="880" y="516" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#f0883e">Reservation &#8594; CREATE</text>

  <line x1="880" y1="524" x2="880" y2="552" stroke="#f0883e" stroke-width="2"/>
  <path d="M880 552 L874 538 L886 538 Z" fill="#f0883e"/>

  <rect x="740" y="552" width="280" height="52" rx="10" fill="#2d1f47" stroke="#a371f7" stroke-width="2"/>
  <text x="880" y="576" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Token Optimization</text>
  <text x="880" y="596" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">INTERNAL_OPTIMIZATION_CALL only</text>

  <line x1="320" y1="524" x2="320" y2="640" stroke="#3fb950" stroke-width="2"/>
  <line x1="880" y1="604" x2="880" y2="640" stroke="#a371f7" stroke-width="2"/>
  <line x1="320" y1="640" x2="880" y2="640" stroke="#8b949e" stroke-width="2"/>
  <line x1="600" y1="640" x2="600" y2="668" stroke="#8b949e" stroke-width="2"/>
  <path d="M600 668 L594 654 L606 654 Z" fill="#8b949e"/>

  <rect x="420" y="668" width="360" height="52" rx="12" fill="#3d3419" stroke="#d4a72c" stroke-width="2"/>
  <text x="600" y="692" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Final CE compile</text>
  <text x="600" y="712" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">preflight + model-facing integrity</text>

  <line x1="600" y1="720" x2="600" y2="748" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 748 L594 734 L606 734 Z" fill="#e6edf3"/>

  <rect x="460" y="748" width="280" height="56" rx="14" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
  <text x="600" y="782" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">Agent / LLM</text>

  <rect x="120" y="840" width="420" height="44" rx="10" fill="#1a3324" stroke="#3fb950" stroke-width="2"/>
  <text x="330" y="868" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#3fb950">EPHEMERAL_ASSEMBLY &#8212; integrated</text>

  <rect x="660" y="840" width="420" height="44" rx="10" fill="#21262d" stroke="#484f58" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="870" y="868" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#8b949e">DURABLE_COMPACTION &#8212; runtime not implemented</text>

  <text x="600" y="930" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">Agent/LLM does not consume the artifact repository directly &#8212; CE compiles the final model context.</text>
  <text x="600" y="1000" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">Conceptual architecture &#8212; not a runtime class diagram.</text>
</svg>
