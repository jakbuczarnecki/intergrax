<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100" role="img">
  <title>Decision System flagship architecture</title>
  <desc>Application through Nexus Decision Lifecycle to Authoritative Decision with Policy, HITL, Execution, Observability, and Diagnostics boundaries.</desc>
  <rect width="1200" height="1100" fill="#f6f8fb"/>
  <rect x="32" y="28" width="1136" height="1044" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#1a1a2e">Intergrax Decision System</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#3d4f66">Nexus executes Decision Lifecycle — not a second runtime</text>
  <rect x="480" y="130" width="240" height="44" rx="12" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="600" y="158" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Application</text>
  <line x1="600" y1="174" x2="600" y2="198" stroke="#1a5fb4" stroke-width="2"/>
  <path d="M600 198 L594 184 L606 184 Z" fill="#1a5fb4"/>
  <rect x="420" y="198" width="360" height="48" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="600" y="226" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Nexus</text>
  <text x="600" y="246" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">execution owner</text>
  <line x1="600" y1="246" x2="600" y2="270" stroke="#1a5fb4" stroke-width="2"/>
  <path d="M600 270 L594 256 L606 256 Z" fill="#1a5fb4"/>
  <rect x="300" y="270" width="600" height="56" rx="12" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2.5"/>
  <text x="600" y="298" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Decision Lifecycle</text>
  <text x="600" y="318" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">proposal → verify → resolve</text>
  <line x1="600" y1="326" x2="600" y2="350" stroke="#1a5fb4" stroke-width="2"/>
  <path d="M600 350 L594 336 L606 336 Z" fill="#1a5fb4"/>
  <rect x="180" y="350" width="220" height="52" rx="12" fill="#fff8e1" stroke="#c9a227" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="290" y="378" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Strategy</text>
  <text x="290" y="398" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">Council / Single / Rule</text>
  <rect x="420" y="350" width="220" height="52" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="530" y="378" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Verification</text>
  <text x="530" y="398" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">compositional pipeline</text>
  <rect x="660" y="350" width="220" height="52" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="770" y="378" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Revision / Adjudication</text>
  <text x="770" y="398" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">bounded</text>
  <line x1="600" y1="402" x2="600" y2="430" stroke="#1a5fb4" stroke-width="2"/>
  <path d="M600 430 L594 416 L606 416 Z" fill="#1a5fb4"/>
  <rect x="360" y="430" width="480" height="52" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="600" y="458" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Authoritative Decision</text>
  <text x="600" y="478" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">versioned · immutable lineage</text>
  <rect x="80" y="530" width="200" height="80" rx="12" fill="#f6f8fb" stroke="#9e9e9e" stroke-width="2"/>
  <text x="180" y="558" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Policy</text>
  <text x="180" y="578" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">authorization</text>
  <rect x="300" y="530" width="200" height="80" rx="12" fill="#f6f8fb" stroke="#9e9e9e" stroke-width="2"/>
  <text x="400" y="558" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">HITL</text>
  <text x="400" y="578" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">human authority</text>
  <rect x="520" y="530" width="200" height="80" rx="12" fill="#f6f8fb" stroke="#9e9e9e" stroke-width="2"/>
  <text x="620" y="558" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Execution</text>
  <text x="620" y="578" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">Nexus side effects</text>
  <rect x="740" y="530" width="200" height="80" rx="12" fill="#f6f8fb" stroke="#9e9e9e" stroke-width="2"/>
  <text x="840" y="558" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Observability</text>
  <text x="840" y="578" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">audit trail</text>
  <rect x="960" y="530" width="160" height="80" rx="12" fill="#f6f8fb" stroke="#9e9e9e" stroke-width="2"/>
  <text x="1040" y="558" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Diagnostics</text>
  <text x="1040" y="578" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">detect / classify</text>
  <text x="600" y="660" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">Decision correctness ≠ permission to execute ≠ execution itself</text>
  <text x="600" y="690" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">Diagnostics may feed investigation — does not own Decision System</text>
  <text x="600" y="1020" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">TARGET ARCHITECTURE — implementation pending; Critic path is CURRENT production snapshot</text>
</svg>
