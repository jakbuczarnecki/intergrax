<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img">
  <title>Intergrax Agent Contracts and Assembly</title>
  <desc>Conceptual diagram: AgentContract declares capabilities, permissions, and limits; author implements domain behavior via on_next_step; platform executes through Policy, Tools, Memory gateways, HarnessKernel, AgentRuntime, and Nexus routing.</desc>
  <rect width="1200" height="980" fill="#0d1117"/>
  <rect x="32" y="28" width="1136" height="924" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#e6edf3">Intergrax Agent Contracts &#38; Assembly</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#8b949e">Contract declares &#183; author decides &#183; platform executes safely</text>

  <rect x="430" y="132" width="340" height="52" rx="12" fill="#2d2411" stroke="#d4a72c" stroke-width="2.5"/>
  <text x="600" y="164" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">AgentContract</text>

  <line x1="600" y1="184" x2="600" y2="208" stroke="#d4a72c" stroke-width="2"/>
  <line x1="200" y1="208" x2="1000" y2="208" stroke="#d4a72c" stroke-width="2"/>
  <line x1="200" y1="208" x2="200" y2="232" stroke="#d4a72c" stroke-width="2"/>
  <line x1="600" y1="208" x2="600" y2="232" stroke="#d4a72c" stroke-width="2"/>
  <line x1="1000" y1="208" x2="1000" y2="232" stroke="#d4a72c" stroke-width="2"/>

  <rect x="120" y="236" width="160" height="44" rx="10" fill="#161b22" stroke="#d4a72c" stroke-width="2"/>
  <text x="200" y="264" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Capabilities</text>

  <rect x="520" y="236" width="160" height="44" rx="10" fill="#161b22" stroke="#d4a72c" stroke-width="2"/>
  <text x="600" y="264" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Permissions</text>

  <rect x="920" y="236" width="160" height="44" rx="10" fill="#161b22" stroke="#d4a72c" stroke-width="2"/>
  <text x="1000" y="264" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Limits / risk</text>

  <line x1="600" y1="280" x2="600" y2="304" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 304 L590 290 L610 290 Z" fill="#e6edf3"/>

  <rect x="360" y="308" width="480" height="48" rx="12" fill="#1c2d4a" stroke="#58a6ff" stroke-width="2"/>
  <text x="600" y="338" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Agent implementation (author domain behavior)</text>

  <line x1="600" y1="348" x2="600" y2="372" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 372 L590 358 L610 358 Z" fill="#e6edf3"/>

  <rect x="400" y="376" width="400" height="48" rx="12" fill="#1a2e1f" stroke="#3fb950" stroke-width="2.5"/>
  <text x="600" y="406" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">on_next_step()</text>

  <line x1="600" y1="424" x2="600" y2="448" stroke="#e6edf3" stroke-width="2"/>
  <line x1="200" y1="448" x2="1000" y2="448" stroke="#6e7681" stroke-width="2"/>
  <line x1="200" y1="448" x2="200" y2="472" stroke="#6e7681" stroke-width="2"/>
  <line x1="600" y1="448" x2="600" y2="472" stroke="#6e7681" stroke-width="2"/>
  <line x1="1000" y1="448" x2="1000" y2="472" stroke="#6e7681" stroke-width="2"/>

  <rect x="120" y="476" width="160" height="44" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="2"/>
  <text x="200" y="504" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Policy</text>

  <rect x="520" y="476" width="160" height="44" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="2"/>
  <text x="600" y="504" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Tools</text>

  <rect x="920" y="476" width="160" height="44" rx="10" fill="#161b22" stroke="#6e7681" stroke-width="2"/>
  <text x="1000" y="504" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#e6edf3">Memory</text>

  <line x1="600" y1="528" x2="600" y2="552" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 552 L590 538 L610 538 Z" fill="#e6edf3"/>

  <rect x="380" y="556" width="440" height="48" rx="12" fill="#21262d" stroke="#6e7681" stroke-width="2"/>
  <text x="600" y="586" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">HarnessKernel</text>

  <line x1="600" y1="604" x2="600" y2="628" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 628 L590 614 L610 614 Z" fill="#e6edf3"/>

  <rect x="400" y="632" width="400" height="48" rx="12" fill="#21262d" stroke="#6e7681" stroke-width="2"/>
  <text x="600" y="658" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">AgentRuntime</text>

  <line x1="600" y1="680" x2="600" y2="704" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 704 L590 710 L610 710 Z" fill="#e6edf3"/>

  <rect x="430" y="708" width="340" height="48" rx="12" fill="#1a2e1f" stroke="#3fb950" stroke-width="2.5"/>
  <text x="600" y="738" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Nexus</text>

  <rect x="120" y="792" width="960" height="72" rx="12" fill="#1c2d4a" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="600" y="822" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Author owns domain behavior &#160;&#160;&#183;&#160;&#160; Platform owns safe execution</text>
  <text x="600" y="852" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">Agent &#8800; runtime &#8212; Nexus decides when / where the agent runs</text>

  <text x="600" y="928" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#6e7681">Conceptual architecture &#8212; not a class diagram.</text>
</svg>
