<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img">
  <title>Decision vs Authorization vs Execution</title>
  <desc>Three-way separation of decision quality, permission, and runtime action.</desc>
  <rect width="1200" height="900" fill="#0d1117"/>
  <rect x="32" y="28" width="1136" height="844" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#e6edf3">Decision ≠ Authorization ≠ Execution</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#8b949e">Three separate platform responsibilities</text>
  <rect x="120" y="160" width="300" height="120" rx="12" fill="#1f2a44" stroke="#58a6ff" stroke-width="2"/>
  <text x="270" y="188" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Authoritative Decision</text>
  <text x="270" y="208" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">What did the system conclude?</text>
  <rect x="450" y="160" width="300" height="120" rx="12" fill="#2d1f47" stroke="#a371f7" stroke-width="2"/>
  <text x="600" y="188" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Execution Authorization</text>
  <text x="600" y="208" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">May this action proceed now?</text>
  <rect x="780" y="160" width="300" height="120" rx="12" fill="#3d2a14" stroke="#db6d28" stroke-width="2"/>
  <text x="930" y="188" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Execution</text>
  <text x="930" y="208" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">What did Nexus actually do?</text>
  <rect x="120" y="340" width="960" height="64" rx="12" fill="#1b3a1f" stroke="#3fb950" stroke-width="2"/>
  <text x="600" y="368" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Decision System</text>
  <text x="600" y="388" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">lifecycle · verification · revision · adjudication</text>
  <rect x="120" y="440" width="460" height="64" rx="12" fill="#21262d" stroke="#6e7681" stroke-width="2"/>
  <text x="350" y="468" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Governance / Policy Engine</text>
  <text x="350" y="488" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">authorization records</text>
  <rect x="620" y="440" width="460" height="64" rx="12" fill="#21262d" stroke="#6e7681" stroke-width="2"/>
  <text x="850" y="468" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Nexus Execution Runtime</text>
  <text x="850" y="488" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">side effects · checkpoints</text>
  <text x="600" y="560" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">A correct decision may still be blocked or require human approval</text>
  <text x="600" y="590" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">Approval for v1 does NOT authorize v2 — version binding is mandatory</text>
  <text x="600" y="620" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">No loose context dict as authority identity</text>
</svg>
