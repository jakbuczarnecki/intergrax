<text x="600" y="888" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#526579">Canonical conceptual architecture — see UNIFIED_EXECUTION_ARCHITECTURE.md for normative semantics.</text>
