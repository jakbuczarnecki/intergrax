<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img">
  <title>Decision version lineage</title>
  <desc>Version progression from candidate through challenge and verification to authoritative decision with parallel branches.</desc>
  <rect width="1200" height="700" fill="#f6f8fb"/>
  <rect x="32" y="28" width="1136" height="644" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#1a1a2e">Decision Version Lineage</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#3d4f66">Immutable audit trail — never overwrite history</text>
  <rect x="80" y="150" width="160" height="48" rx="12" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="160" y="180" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">v1 candidate</text>
  <line x1="240" y1="174" x2="300" y2="174" stroke="#1a5fb4" stroke-width="2"/>
  <path d="M300 174 L294 160 L306 160 Z" fill="#1a5fb4"/>
  <rect x="300" y="150" width="180" height="48" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="390" y="180" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">challenge</text>
  <line x1="480" y1="174" x2="540" y2="174" stroke="#1a5fb4" stroke-width="2"/>
  <path d="M540 174 L534 160 L546 160 Z" fill="#1a5fb4"/>
  <rect x="540" y="150" width="160" height="48" rx="12" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="620" y="180" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">v2 revised</text>
  <line x1="700" y1="174" x2="760" y2="174" stroke="#1a5fb4" stroke-width="2"/>
  <path d="M760 174 L754 160 L766 160 Z" fill="#1a5fb4"/>
  <rect x="760" y="150" width="180" height="48" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="850" y="180" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">verification</text>
  <line x1="940" y1="174" x2="1000" y2="174" stroke="#1a5fb4" stroke-width="2"/>
  <path d="M1000 174 L994 160 L1006 160 Z" fill="#1a5fb4"/>
  <rect x="1000" y="138" width="160" height="72" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="1080" y="180" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#1a1a2e">v3 authoritative</text>
  <rect x="200" y="280" width="200" height="48" rx="12" fill="#fff8e1" stroke="#c9a227" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="300" y="310" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">v2A branch</text>
  <rect x="200" y="360" width="200" height="48" rx="12" fill="#fff8e1" stroke="#c9a227" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="300" y="390" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">v2B branch</text>
  <text x="600" y="460" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">Parallel proposals preserve both branches — no last-write-wins</text>
  <text x="600" y="490" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">Competing branches → adjudicate · preserve conflict · or UNRESOLVED</text>
  <text x="600" y="520" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">Every Verification Result, Challenge, Approval binds Decision ID + Version + scope + tenant</text>
</svg>
