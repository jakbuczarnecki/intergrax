<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Intergrax Execution Core</title>
<desc id="desc">Executive architecture view: one public execute boundary creates governed Execution work. Direct inference and agentic execution do not require Nexus; orchestration uses Nexus to schedule child Executions. Identity, governance, budget, observability, diagnostics and recovery apply across the execution tree.</desc>
<rect width="1200" height="800" fill="#f6f8fb"/>
<rect x="30" y="24" width="1140" height="752" rx="24" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<text x="600" y="70" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="32" font-weight="700" fill="#1a1a2e">Intergrax Execution Core</text>
<text x="600" y="102" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" fill="#526579">One governed execution model — from a single model call to nested multi-agent orchestration</text>
<rect x="420" y="132" width="360" height="60" rx="14" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
<text x="600.0" y="160.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Application / Product</text>
<text x="600.0" y="183.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#526579">asks WHAT should be done</text>
<line x1="600" y1="192" x2="600" y2="225" stroke="#334155" stroke-width="2.2"/>
<path d="M600,225 L594.4,216.7 L605.6,216.7 Z" fill="#334155"/>
<rect x="430" y="230" width="340" height="62" rx="14" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
<text x="600.0" y="259.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">execution.execute(...)</text>
<text x="600.0" y="282.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#526579">one public execution boundary</text>
<line x1="600" y1="292" x2="600" y2="330" stroke="#334155" stroke-width="2.2"/>
<path d="M600,330 L594.4,321.7 L605.6,321.7 Z" fill="#334155"/>
<rect x="410" y="335" width="380" height="68" rx="14" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
<text x="600.0" y="367.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#1a1a2e">EXECUTION</text>
<text x="600.0" y="390.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#526579">independent schedulable / governable work unit</text>
<line x1="600" y1="403" x2="255" y2="470" stroke="#334155" stroke-width="2.2"/>
<path d="M255,470 L262.1,462.9 L264.2,473.9 Z" fill="#334155"/>
<line x1="600" y1="403" x2="600" y2="470" stroke="#334155" stroke-width="2.2"/>
<path d="M600,470 L594.4,461.7 L605.6,461.7 Z" fill="#334155"/>
<line x1="600" y1="403" x2="945" y2="470" stroke="#334155" stroke-width="2.2"/>
<path d="M945,470 L935.8,473.9 L937.9,462.9 Z" fill="#334155"/>
<rect x="115" y="475" width="280" height="82" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="255.0" y="514.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Inference</text>
<text x="255.0" y="537.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#526579">direct model / structured output</text>
<rect x="460" y="475" width="280" height="82" rx="14" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
<text x="600.0" y="514.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Agentic</text>
<text x="600.0" y="537.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#526579">AgentEngine → UAEP</text>
<rect x="805" y="475" width="280" height="82" rx="14" fill="#fff8e1" stroke="#b88900" stroke-width="2"/>
<text x="945.0" y="514.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Orchestration</text>
<text x="945.0" y="537.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#526579">Nexus decides WHAT executes next</text>
<line x1="945" y1="557" x2="945" y2="605" stroke="#334155" stroke-width="2.2"/>
<path d="M945,605 L939.4,596.7 L950.6,596.7 Z" fill="#334155"/>
<rect x="820" y="610" width="250" height="62" rx="14" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
<text x="945.0" y="639.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#1a1a2e">Child Executions</text>
<text x="945.0" y="662.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#526579">same Run / Attempt tree</text>
<text x="600" y="655" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#526579">Nexus appears only when orchestration is required; it does not replace the execution lifecycle.</text>
<text x="600" y="690" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#526579">Shared guarantees across every Execution</text>
<rect x="75" y="710" width="145" height="44" rx="14" fill="#f0f4f8" stroke="#5b6f82" stroke-width="2"/>
<text x="147.5" y="738.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1a1a2e">Identity</text>
<rect x="250" y="710" width="145" height="44" rx="14" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
<text x="322.5" y="738.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1a1a2e">Governance</text>
<rect x="425" y="710" width="145" height="44" rx="14" fill="#fff8e1" stroke="#b88900" stroke-width="2"/>
<text x="497.5" y="738.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1a1a2e">Budget</text>
<rect x="600" y="710" width="145" height="44" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="672.5" y="738.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1a1a2e">Observability</text>
<rect x="775" y="710" width="145" height="44" rx="14" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
<text x="847.5" y="738.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1a1a2e">Diagnostics</text>
<rect x="950" y="710" width="145" height="44" rx="14" fill="#f0f4f8" stroke="#5b6f82" stroke-width="2"/>
<text x="1022.5" y="738.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1a1a2e">Recovery</text>
</svg>