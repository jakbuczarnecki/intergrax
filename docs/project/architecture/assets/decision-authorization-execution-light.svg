<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img">
  <title>Decision vs Authorization vs Execution</title>
  <desc>Three-way separation of decision quality, permission, and runtime action.</desc>
  <rect width="1200" height="900" fill="#f6f8fb"/>
  <rect x="32" y="28" width="1136" height="844" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#1a1a2e">Decision ≠ Authorization ≠ Execution</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#3d4f66">Three separate platform responsibilities</text>
  <rect x="120" y="160" width="300" height="120" rx="12" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="270" y="188" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e">Authoritative Decision</text>
  <text x="270" y="208" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">What did the system conclude?</text>
  <rect x="450" y="160" width="300" height="120" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="600" y="188" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e">Execution Authorization</text>
  <text x="600" y="208" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">May this action proceed now?</text>
  <rect x="780" y="160" width="300" height="120" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="930" y="188" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e">Execution</text>
  <text x="930" y="208" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">What did Nexus actually do?</text>
  <rect x="120" y="340" width="960" height="64" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="600" y="368" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Decision System</text>
  <text x="600" y="388" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">lifecycle · verification · revision · adjudication</text>
  <rect x="120" y="440" width="460" height="64" rx="12" fill="#f6f8fb" stroke="#9e9e9e" stroke-width="2"/>
  <text x="350" y="468" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Governance / Policy Engine</text>
  <text x="350" y="488" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">authorization records</text>
  <rect x="620" y="440" width="460" height="64" rx="12" fill="#f6f8fb" stroke="#9e9e9e" stroke-width="2"/>
  <text x="850" y="468" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Nexus Execution Runtime</text>
  <text x="850" y="488" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">side effects · checkpoints</text>
  <text x="600" y="560" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">A correct decision may still be blocked or require human approval</text>
  <text x="600" y="590" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">Approval for v1 does NOT authorize v2 — version binding is mandatory</text>
  <text x="600" y="620" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">No loose context dict as authority identity</text>
</svg>
