  <line x1="550" y1="632" x2="550" y2="660" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M550 660 L540 646 L560 646 Z" fill="#e6edf3"/>

  <rect x="280" y="664" width="540" height="52" rx="12" fill="#2b1f33" stroke="#a371f7" stroke-width="2"/>
  <text x="550" y="696" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Agent / Governed Execution</text>

  <line x1="550" y1="716" x2="550" y2="744" stroke="#3fb950" stroke-width="2"/>
  <path d="M550 744 L540 730 L560 730 Z" fill="#3fb950"/>
  <text x="550" y="768" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#3fb950">result</text>

  <line x1="350" y1="784" x2="200" y2="820" stroke="#3fb950" stroke-width="1.5"/>
  <rect x="60" y="820" width="280" height="44" rx="10" fill="#1b2f23" stroke="#3fb950" stroke-width="1.5"/>
  <text x="200" y="848" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">valuable state ’ Memory / Worker state</text>

  <line x1="550" y1="784" x2="550" y2="820" stroke="#d29922" stroke-width="1.5"/>
  <rect x="410" y="820" width="280" height="44" rx="10" fill="#2d2418" stroke="#d29922" stroke-width="1.5"/>
  <text x="550" y="848" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">artifact ’ canonical artifact lifecycle</text>

  <line x1="750" y1="784" x2="900" y2="820" stroke="#6e7681" stroke-width="1.5"/>
  <rect x="760" y="820" width="280" height="44" rx="10" fill="#21262d" stroke="#6e7681" stroke-width="1.5"/>
  <text x="900" y="848" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#e6edf3">transient context ’ discard</text>

  <line x1="550" y1="864" x2="550" y2="878" stroke="#d29922" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="550" y="896" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#d29922">Worker sleeps / resumes later ’ restore orientation</text>

  <path d="M900 360 Q980 360 980 330 Q980 300 900 300" fill="none" stroke="#d29922" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M900 300 L912 306 L906 294 Z" fill="#d29922"/>
