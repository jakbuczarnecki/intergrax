<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 920" role="img">
  <title>Autonomous Work Long-Horizon Work Continuity</title>
  <desc>Effectively unbounded information space feeds selective retrieval into Work Continuity State; Context Engineering assembles bounded active context for governed execution; durable results persist while transient context is discarded before worker sleep and later orientation restore.</desc>
  <rect width="1100" height="920" fill="#0d1117"/>
  <rect x="24" y="20" width="1052" height="880" rx="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <text x="550" y="58" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#e6edf3">Long-Horizon Work Continuity</text>
  <text x="550" y="86" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" fill="#8b949e">Unbounded information space ` unbounded model context · persistent responsibility ` persistent prompt</text>

  <rect x="80" y="110" width="940" height="150" rx="16" fill="#1c2128" stroke="#484f58" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="550" y="142" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">EFFECTIVELY UNBOUNDED INFORMATION SPACE</text>
  <text x="200" y="178" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">Memory</text>
  <text x="330" y="178" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">RAG / Knowledge</text>
  <text x="470" y="178" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">Work history</text>
  <text x="610" y="178" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">Execution history</text>
  <text x="750" y="178" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">Files · Emails</text>
  <text x="200" y="210" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">APIs</text>
  <text x="360" y="210" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">Business systems</text>
  <text x="530" y="210" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">Artifacts</text>
  <text x="720" y="210" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">Tools · Integrations</text>

  <line x1="550" y1="260" x2="550" y2="290" stroke="#58a6ff" stroke-width="2.5"/>
  <path d="M550 290 L540 276 L560 276 Z" fill="#58a6ff"/>
  <text x="550" y="318" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#58a6ff">selective retrieval</text>

  <rect x="260" y="330" width="580" height="110" rx="14" fill="#2d2418" stroke="#d29922" stroke-width="2.5"/>
  <text x="550" y="362" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">WORK CONTINUITY STATE</text>
  <text x="550" y="388" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">where am I? · what is open? · what was learned? · what is next?</text>
  <text x="550" y="412" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#6e7681">Autonomous Work owns orientation semantics  not memory storage or context assembly</text>

  <line x1="550" y1="440" x2="550" y2="468" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M550 468 L540 454 L560 454 Z" fill="#e6edf3"/>

  <rect x="220" y="472" width="660" height="72" rx="14" fill="#1c2333" stroke="#6e7fd4" stroke-width="2"/>
  <text x="550" y="504" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">CONTEXT ENGINEERING</text>
  <text x="550" y="528" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">select · rank · budget · provenance</text>

  <line x1="550" y1="544" x2="550" y2="572" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M550 572 L540 558 L560 558 Z" fill="#e6edf3"/>

  <rect x="300" y="576" width="500" height="56" rx="12" fill="#132236" stroke="#388bfd" stroke-width="2"/>
