<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img">
  <title>Diagnostic failure isolation</title>
  <desc>Business execution success survives Problem Store outage with failure evidence recorded.</desc>
  <rect width="1200" height="650" fill="#f6f8fb"/>
  <rect x="24" y="24" width="1152" height="602" rx="20" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="600" y="58" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#1a1a2e">Failure isolation  business vs diagnostics</text>
  <rect x="400" y="110" width="400" height="72" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="600" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">Business execution</text>
  <text x="600" y="172" text-anchor="middle" font-size="14" fill="#3d4f66">SUCCESS (canonical outcome)</text>
  <line x1="500" y1="182" x2="350" y2="280" stroke="#2e7d32" stroke-width="2"/>
  <line x1="700" y1="182" x2="850" y2="280" stroke="#ef6c00" stroke-width="2"/>
  <rect x="150" y="280" width="400" height="100" rx="12" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="350" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">RuntimeEvents persisted</text>
  <text x="350" y="358" text-anchor="middle" font-size="13" fill="#3d4f66">canonical execution evidence survives</text>
  <rect x="650" y="280" width="400" height="100" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="850" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Problem Store DOWN</text>
  <text x="850" y="358" text-anchor="middle" font-size="13" fill="#3d4f66">write fails visibly  no silent drop</text>
  <line x1="850" y1="380" x2="850" y2="440" stroke="#c62828" stroke-width="2"/>
  <rect x="550" y="440" width="600" height="80" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="850" y="472" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a2e">Diagnostic subsystem failure evidence</text>
  <text x="850" y="500" text-anchor="middle" font-size="13" fill="#3d4f66">RuntimeEvent records degradation  business result unchanged</text>
  <text x="600" y="580" text-anchor="middle" font-size="15" fill="#3d4f66">Problem persistence failure does not create implicit replay queue</text>
</svg>
