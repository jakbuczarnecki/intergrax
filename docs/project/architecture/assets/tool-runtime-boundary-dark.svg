<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img">
  <title>Intergrax tool runtime boundary</title>
  <desc>Conceptual diagram: agent or model tool intent passes through layered effective tool access, then ToolRuntime enforcement, RuntimeToolInvoker, and handlers to integrations or backends. Intent is not execution.</desc>
  <rect width="1200" height="980" fill="#0d1117"/>
  <rect x="32" y="28" width="1136" height="924" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="30" font-weight="700" fill="#e6edf3">Intergrax Tools &#8212; intent vs execution</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" fill="#8b949e">Every real tool call crosses the runtime enforcement boundary</text>

  <rect x="420" y="130" width="360" height="52" rx="12" fill="#21262d" stroke="#484f58" stroke-width="2"/>
  <text x="600" y="162" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#e6edf3">Agent / LLM / Planner</text>

  <line x1="600" y1="182" x2="600" y2="210" stroke="#484f58" stroke-width="2"/>
  <path d="M600 210 L594 196 L606 196 Z" fill="#484f58"/>

  <rect x="460" y="210" width="280" height="44" rx="10" fill="#1c2d4a" stroke="#388bfd" stroke-width="2"/>
  <text x="600" y="238" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">tool intent</text>

  <line x1="600" y1="254" x2="600" y2="282" stroke="#484f58" stroke-width="2"/>
  <path d="M600 282 L594 268 L606 268 Z" fill="#484f58"/>

  <rect x="220" y="282" width="760" height="132" rx="14" fill="#2d333b" stroke="#d4a72c" stroke-width="2"/>
  <text x="600" y="312" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Effective tool access (narrowing layers)</text>
  <text x="600" y="340" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">AgentContract &#183; Skill bindings &#183; ToolProfile &#183; Runtime policy &#183; Modality / scope</text>
  <text x="600" y="366" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#8b949e">Each layer may narrow access &#8212; none may expand upstream allowlists</text>

  <line x1="600" y1="414" x2="600" y2="442" stroke="#484f58" stroke-width="2"/>
  <path d="M600 442 L594 428 L606 428 Z" fill="#484f58"/>

  <rect x="360" y="442" width="480" height="64" rx="14" fill="#1a3d2e" stroke="#3fb950" stroke-width="2.5"/>
  <text x="600" y="478" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#e6edf3">ToolRuntime</text>

  <rect x="280" y="520" width="640" height="56" rx="10" fill="#1a2e22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="600" y="552" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">validation &#183; policy &#183; trace &#183; scope &#183; idempotency &#183; timeout &#183; retry</text>

  <line x1="600" y1="576" x2="600" y2="604" stroke="#3fb950" stroke-width="2"/>
  <path d="M600 604 L594 590 L606 590 Z" fill="#3fb950"/>

  <rect x="380" y="604" width="440" height="52" rx="12" fill="#21262d" stroke="#484f58" stroke-width="2"/>
  <text x="600" y="636" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">RuntimeToolInvoker</text>

  <line x1="600" y1="656" x2="600" y2="684" stroke="#484f58" stroke-width="2"/>
  <path d="M600 684 L594 670 L606 670 Z" fill="#484f58"/>

  <rect x="380" y="684" width="440" height="52" rx="12" fill="#21262d" stroke="#484f58" stroke-width="2"/>
  <text x="600" y="716" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">ToolExecutor / handler</text>

  <line x1="600" y1="736" x2="600" y2="764" stroke="#484f58" stroke-width="2"/>
  <path d="M600 764 L594 750 L606 750 Z" fill="#484f58"/>

  <rect x="260" y="764" width="680" height="52" rx="12" fill="#2d1f4a" stroke="#a371f7" stroke-width="2"/>
  <text x="600" y="796" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">Integration / sandbox / RAG backend</text>

  <rect x="320" y="468" width="560" height="36" rx="8" fill="#3d1f12" stroke="#f0883e" stroke-width="1.5"/>
  <text x="600" y="491" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#f0883e">Intent is not execution.</text>

  <text x="600" y="868" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" fill="#8b949e">LLM tool_call describes intent &#8212; ToolRuntime performs governed execution.</text>
  <text x="600" y="928" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">Conceptual architecture &#8212; not a runtime class diagram.</text>
</svg>
