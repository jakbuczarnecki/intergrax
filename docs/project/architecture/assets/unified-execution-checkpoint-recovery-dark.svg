<text x="600.0" y="759.5" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#f0f6fc">Resume same Run / Attempt / Execution identity</text>
<text x="600.0" y="782.5" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#9da7b3">restore durable state → continue lifecycle</text>
<rect x="140" y="830" width="920" height="48" rx="12" fill="#351316" stroke="#f85149" stroke-width="2"/>
<text x="600.0" y="859.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#f0f6fc">Checkpoint persists execution truth; it never invents or reconstructs a competing identity tree.</text>
<text x="600" y="888" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#9da7b3">Canonical conceptual architecture — see UNIFIED_EXECUTION_ARCHITECTURE.md for normative semantics.</text>
