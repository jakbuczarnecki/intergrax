<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img">
  <title>Intergrax reliability recovery loop</title>
  <desc>Conceptual diagram: failure classified through ResiliencePolicy to retry, degrade, or HITL; recovery evidence flows to RuntimeEvent and HOS.</desc>
  <rect width="1200" height="980" fill="#f6f8fb"/>
  <rect x="32" y="28" width="1136" height="924" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="30" font-weight="700" fill="#1a1a2e">Intergrax Reliability &#8212; recovery loop</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" fill="#3d4f66">Failure is normal. Recovery is bounded. Evidence is mandatory.</text>

  <rect x="480" y="130" width="240" height="44" rx="10" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="600" y="158" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e">FAILURE</text>

  <line x1="600" y1="174" x2="600" y2="198" stroke="#c62828" stroke-width="2"/>
  <path d="M600 198 L594 214 L606 214 Z" fill="#c62828"/>

  <rect x="360" y="214" width="480" height="52" rx="12" fill="#fff8e1" stroke="#c9a227" stroke-width="2"/>
  <text x="600" y="246" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">classify failure</text>

  <line x1="600" y1="266" x2="600" y2="290" stroke="#c9a227" stroke-width="2"/>
  <path d="M600 290 L594 276 L606 276 Z" fill="#c9a227"/>

  <rect x="300" y="290" width="600" height="52" rx="12" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2.5"/>
  <text x="600" y="322" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#1a1a2e">ResiliencePolicy</text>

  <line x1="420" y1="342" x2="420" y2="378" stroke="#1a5fb4" stroke-width="2"/>
  <line x1="600" y1="342" x2="600" y2="378" stroke="#1a5fb4" stroke-width="2"/>
  <line x1="780" y1="342" x2="780" y2="378" stroke="#1a5fb4" stroke-width="2"/>

  <rect x="300" y="378" width="240" height="52" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="420" y="410" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e">retry</text>

  <rect x="480" y="378" width="240" height="52" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="600" y="410" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e">degrade</text>

  <rect x="660" y="378" width="240" height="52" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="780" y="410" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e">HITL</text>

  <line x1="420" y1="430" x2="420" y2="454" stroke="#2e7d32" stroke-width="2"/>
  <line x1="600" y1="430" x2="600" y2="454" stroke="#ef6c00" stroke-width="2"/>
  <line x1="780" y1="430" x2="780" y2="454" stroke="#7c3aed" stroke-width="2"/>

  <rect x="300" y="454" width="240" height="48" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
  <text x="420" y="484" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#1a1a2e">R0&#8211;R3</text>

  <rect x="480" y="454" width="240" height="48" rx="10" fill="#ffffff" stroke="#ef6c00" stroke-width="2"/>
  <text x="600" y="484" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#1a1a2e">partial result</text>

  <rect x="660" y="454" width="240" height="48" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="780" y="484" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#1a1a2e">interrupt</text>

  <line x1="780" y1="502" x2="780" y2="526" stroke="#7c3aed" stroke-width="2"/>
  <path d="M780 526 L774 512 L786 512 Z" fill="#7c3aed"/>

  <rect x="620" y="526" width="320" height="48" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="780" y="556" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#1a1a2e">human decision</text>

  <line x1="700" y1="574" x2="700" y2="598" stroke="#7c3aed" stroke-width="2"/>
  <line x1="860" y1="574" x2="860" y2="598" stroke="#7c3aed" stroke-width="2"/>

  <rect x="620" y="598" width="160" height="44" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="700" y="626" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#1a1a2e">resume</text>

  <rect x="800" y="598" width="160" height="44" rx="10" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="880" y="626" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#1a1a2e">stop</text>

  <line x1="420" y1="502" x2="420" y2="660" stroke="#5b6f82" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="600" y1="502" x2="600" y2="660" stroke="#5b6f82" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="700" y1="642" x2="700" y2="660" stroke="#5b6f82" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="880" y1="642" x2="880" y2="660" stroke="#5b6f82" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="420" y1="660" x2="880" y2="660" stroke="#5b6f82" stroke-width="2"/>
  <line x1="600" y1="660" x2="600" y2="684" stroke="#5b6f82" stroke-width="2"/>
  <path d="M600 684 L594 670 L606 670 Z" fill="#5b6f82"/>

  <rect x="360" y="684" width="480" height="52" rx="12" fill="#fff8e1" stroke="#c9a227" stroke-width="2"/>
  <text x="600" y="716" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#1a1a2e">recovery evidence</text>

  <line x1="600" y1="736" x2="600" y2="760" stroke="#c9a227" stroke-width="2"/>
  <path d="M600 760 L594 746 L606 746 Z" fill="#c9a227"/>

  <rect x="320" y="760" width="560" height="52" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="600" y="792" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">RuntimeEvent / HOS</text>

  <rect x="860" y="290" width="300" height="140" rx="12" fill="#f0f4f8" stroke="#5b6f82" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1010" y="318" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#1a1a2e">Boundary callout</text>
  <text x="1010" y="342" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#3d4f66">Reliability decides recovery</text>
  <text x="1010" y="366" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#3d4f66">Governance authorizes action</text>
  <text x="1010" y="390" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#3d4f66">Observability records evidence</text>
  <text x="1010" y="414" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#5b6f82">Conceptual &#8212; not a class diagram</text>

  <text x="600" y="870" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" fill="#5b6f82">Agents may request recovery. Runtime owns retry budget, layer, policy, and stop condition.</text>
  <text x="600" y="930" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#5b6f82">Conceptual architecture &#8212; not a runtime class diagram.</text>
</svg>
