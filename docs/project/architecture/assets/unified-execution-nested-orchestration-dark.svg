<text x="920.0" y="639.5" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">Execution E5</text>
<text x="920.0" y="662.5" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#9da7b3">strategy = agentic</text>
<rect x="155" y="565" width="300" height="110" rx="12" fill="#21262d" stroke="#30363d" stroke-width="2"/>
<text x="305.0" y="617.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">Identity remains one Run / Attempt</text>
<text x="305.0" y="640.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#9da7b3">E3, E4 and E5 do NOT mint a new Run merely because orchestration is nested</text>
<rect x="220" y="745" width="760" height="80" rx="12" fill="#351316" stroke="#f85149" stroke-width="2"/>
<text x="600.0" y="782.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#f0f6fc">Policy bounds</text>
<text x="600.0" y="805.0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#9da7b3">max_execution_depth · max_orchestration_depth · max_fan_out · max_active_children</text>
<text x="600" y="878" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#9da7b3">Canonical conceptual architecture — see UNIFIED_EXECUTION_ARCHITECTURE.md for normative semantics.</text>
</svg>