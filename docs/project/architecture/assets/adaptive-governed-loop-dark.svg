  <line x1="600" y1="730" x2="600" y2="754" stroke="#58a6ff" stroke-width="2"/>
  <path d="M600 754 L594 740 L606 740 Z" fill="#58a6ff"/>

  <rect x="450" y="754" width="300" height="48" rx="12" fill="#2d2410" stroke="#d29922" stroke-width="2"/>
  <text x="600" y="784" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Verify</text>

  <line x1="600" y1="802" x2="600" y2="826" stroke="#d29922" stroke-width="2"/>
  <line x1="420" y1="826" x2="780" y2="826" stroke="#d29922" stroke-width="2"/>
  <line x1="420" y1="826" x2="420" y2="850" stroke="#d29922" stroke-width="2"/>
  <line x1="780" y1="826" x2="780" y2="850" stroke="#d29922" stroke-width="2"/>

  <rect x="300" y="850" width="240" height="48" rx="12" fill="#13261a" stroke="#3fb950" stroke-width="2"/>
  <text x="420" y="880" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">keep</text>

  <rect x="660" y="850" width="240" height="48" rx="12" fill="#3d1f1f" stroke="#f85149" stroke-width="2"/>
  <text x="780" y="880" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">rollback</text>

  <rect x="120" y="940" width="960" height="72" rx="14" fill="#2d2410" stroke="#d29922" stroke-width="2"/>
  <text x="600" y="972" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Adaptation is versioned promotion, not silent mutation.</text>
  <text x="600" y="998" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" fill="#8b949e">Proposal &#8800; permission &#8800; production deployment</text>

  <text x="600" y="1060" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">AdaptationEngine proposes &#183; AdaptationExecutor promotes &#183; Governance grants authority</text>
</svg>
