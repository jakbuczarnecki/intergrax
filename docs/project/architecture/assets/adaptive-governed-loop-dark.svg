  <line x1="360" y1="634" x2="360" y2="658" stroke="#3fb950" stroke-width="2"/>
  <line x1="600" y1="634" x2="600" y2="658" stroke="#3fb950" stroke-width="2"/>
  <line x1="360" y1="658" x2="600" y2="658" stroke="#3fb950" stroke-width="2"/>
  <line x1="600" y1="658" x2="600" y2="682" stroke="#3fb950" stroke-width="2"/>
  <path d="M600 682 L594 668 L606 668 Z" fill="#3fb950"/>

