  <text x="600" y="232" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Outcome Signals</text>

  <line x1="600" y1="250" x2="600" y2="274" stroke="#58a6ff" stroke-width="2"/>
  <path d="M600 274 L594 260 L606 260 Z" fill="#58a6ff"/>

  <rect x="390" y="274" width="420" height="48" rx="12" fill="#2d2410" stroke="#d29922" stroke-width="2"/>
  <text x="600" y="304" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">AdaptationEngine</text>

  <line x1="600" y1="322" x2="600" y2="346" stroke="#d29922" stroke-width="2"/>
  <path d="M600 346 L594 332 L606 332 Z" fill="#d29922"/>

