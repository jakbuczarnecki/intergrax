  <text x="600" y="448" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Governance Pipeline</text>

  <line x1="600" y1="466" x2="600" y2="490" stroke="#a371f7" stroke-width="2"/>
  <path d="M600 490 L594 476 L606 476 Z" fill="#a371f7"/>

  <rect x="390" y="490" width="420" height="48" rx="12" fill="#13261a" stroke="#3fb950" stroke-width="2"/>
  <text x="600" y="520" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Profile Version</text>

  <line x1="600" y1="538" x2="600" y2="562" stroke="#3fb950" stroke-width="2"/>
  <line x1="360" y1="562" x2="840" y2="562" stroke="#3fb950" stroke-width="2"/>
  <line x1="360" y1="562" x2="360" y2="586" stroke="#3fb950" stroke-width="2"/>
  <line x1="600" y1="562" x2="600" y2="586" stroke="#3fb950" stroke-width="2"/>
