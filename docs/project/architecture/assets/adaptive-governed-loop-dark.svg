<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1180" role="img">
  <title>Intergrax Adaptive Harness Intelligence governed loop</title>
  <desc>Conceptual diagram: execution evidence flows through outcome signals, adaptation engine, governance gates, profile versioning, shadow and canary promotion, apply, verification, and keep or rollback.</desc>
  <rect width="1200" height="1180" fill="#0d1117"/>
  <rect x="32" y="28" width="1136" height="1124" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="30" font-weight="700" fill="#e6edf3">Intergrax AHI &#8212; governed adaptation loop</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" fill="#8b949e">Versioned promotion, not silent mutation</text>

  <rect x="420" y="130" width="360" height="48" rx="12" fill="#13253f" stroke="#58a6ff" stroke-width="2"/>
  <text x="600" y="160" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">EXECUTION EVIDENCE</text>

