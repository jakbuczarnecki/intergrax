<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img">
  <title>Fail-closed verification</title>
  <desc>Unavailable verifiers and missing provenance fail closed rather than pass silently.</desc>
  <rect width="1200" height="720" fill="#0d1117"/>
  <rect x="32" y="28" width="1136" height="664" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#e6edf3">Fail-Closed Verification</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#8b949e">Unavailable or unconfigured verifier does not silently pass</text>
  <rect x="200" y="170" width="320" height="56" rx="12" fill="#3d2e00" stroke="#d29922" stroke-width="2"/>
  <text x="360" y="204" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Required stage unavailable</text>
  <line x1="520" y1="198" x2="600" y2="198" stroke="#58a6ff" stroke-width="2"/>
  <path d="M600 198 L594 184 L606 184 Z" fill="#58a6ff"/>
  <rect x="600" y="170" width="400" height="56" rx="12" fill="#3d1f24" stroke="#f85149" stroke-width="2"/>
  <text x="800" y="204" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Fail closed or explicit UNRESOLVED</text>
  <rect x="200" y="300" width="320" height="56" rx="12" fill="#2d1f47" stroke="#a371f7" stroke-width="2"/>
  <text x="360" y="334" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Unresolvable rubric / provenance</text>
  <line x1="520" y1="328" x2="600" y2="328" stroke="#58a6ff" stroke-width="2"/>
  <path d="M600 328 L594 314 L606 314 Z" fill="#58a6ff"/>
  <rect x="600" y="300" width="400" height="56" rx="12" fill="#3d1f24" stroke="#f85149" stroke-width="2"/>
  <text x="800" y="334" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Challenge — no synthetic pass</text>
  <text x="600" y="450" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">High-assurance profiles require deterministic evidence before probabilistic stages</text>
</svg>
