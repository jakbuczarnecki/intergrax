<text x="600.0" y="754.5" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#f0f6fc">Anti-god-object invariant</text>
<text x="600.0" y="777.5" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#9da7b3">Execution coordinates contracts. It does not absorb Governance, Budget, Observability, DIAG, Nexus, Agent internals, Queue or Checkpoint persistence.</text>
<rect x="180" y="835" width="840" height="34" rx="9" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
<text x="600.0" y="858" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#f0f6fc">Canonical ownership remains distributed; execution truth remains singular</text>
<text x="600" y="938" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#9da7b3">Canonical conceptual architecture — see UNIFIED_EXECUTION_ARCHITECTURE.md for normative semantics.</text>
