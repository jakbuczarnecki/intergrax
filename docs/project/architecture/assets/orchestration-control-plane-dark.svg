<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img">
  <title>Intergrax Orchestration control plane</title>
  <desc>Conceptual diagram: application needs flow into OrchestrationProfile, which configures planner, graph topology, parallelism, and merge before Nexus executes a Task to TaskResult. UER supplies runtime behavior.</desc>
  <rect width="1200" height="920" fill="#0d1117"/>
  <rect x="32" y="28" width="1136" height="864" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#e6edf3">Intergrax Orchestration &#8212; configuration layer</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#8b949e">Structure before execution &#8212; not a separate runtime</text>

  <rect x="420" y="132" width="360" height="52" rx="12" fill="#1c2d4a" stroke="#58a6ff" stroke-width="2"/>
  <text x="600" y="164" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Application / product needs</text>

  <line x1="600" y1="184" x2="600" y2="208" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 208 L590 194 L610 194 Z" fill="#e6edf3"/>

  <rect x="360" y="212" width="480" height="64" rx="14" fill="#2d2411" stroke="#d4a72c" stroke-width="2.5"/>
  <text x="600" y="242" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#e6edf3">OrchestrationProfile</text>
  <text x="600" y="266" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#8b949e">planner &#183; classifier &#183; graph &#183; parallelism &#183; merge &#183; resilience</text>

  <line x1="600" y1="276" x2="600" y2="300" stroke="#d4a72c" stroke-width="2"/>
  <line x1="180" y1="300" x2="1020" y2="300" stroke="#d4a72c" stroke-width="2"/>
  <line x1="180" y1="300" x2="180" y2="328" stroke="#d4a72c" stroke-width="2"/>
  <line x1="420" y1="300" x2="420" y2="328" stroke="#d4a72c" stroke-width="2"/>
  <line x1="600" y1="300" x2="600" y2="328" stroke="#d4a72c" stroke-width="2"/>
  <line x1="780" y1="300" x2="780" y2="328" stroke="#d4a72c" stroke-width="2"/>
  <line x1="1020" y1="300" x2="1020" y2="328" stroke="#d4a72c" stroke-width="2"/>

  <rect x="100" y="332" width="160" height="48" rx="10" fill="#161b22" stroke="#d4a72c" stroke-width="2"/>
  <text x="180" y="362" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Planner</text>

  <rect x="340" y="332" width="160" height="48" rx="10" fill="#161b22" stroke="#d4a72c" stroke-width="2"/>
  <text x="420" y="362" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Graph</text>

  <rect x="520" y="332" width="160" height="48" rx="10" fill="#161b22" stroke="#d4a72c" stroke-width="2"/>
  <text x="600" y="362" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Parallelism</text>

  <rect x="700" y="332" width="160" height="48" rx="10" fill="#161b22" stroke="#d4a72c" stroke-width="2"/>
  <text x="780" y="362" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Merge</text>

  <rect x="940" y="332" width="160" height="48" rx="10" fill="#161b22" stroke="#d4a72c" stroke-width="2"/>
  <text x="1020" y="362" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Resilience</text>

  <rect x="300" y="408" width="600" height="120" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <text x="600" y="436" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#8b949e">Graph topology examples</text>
  <text x="600" y="462" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#6e7681">single &#183; sequential &#183; parallel &#183; delegation &#183; multi-agent graph</text>
  <text x="600" y="488" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#6e7681">swarm &#183; evaluator-loop &#183; dynamic pattern advisory</text>
  <text x="600" y="514" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#6e7681">ApplicationGraphSpec seeds NexusPlan when configured</text>

  <line x1="600" y1="528" x2="600" y2="556" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 556 L590 542 L610 542 Z" fill="#e6edf3"/>

  <rect x="380" y="560" width="440" height="56" rx="14" fill="#1a2e1f" stroke="#3fb950" stroke-width="2.5"/>
  <text x="600" y="586" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">Nexus Execution Flow</text>
  <text x="600" y="606" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">Task &#8594; plan &#8594; graph &#8594; control-flow</text>

  <line x1="600" y1="616" x2="600" y2="640" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 640 L590 626 L610 626 Z" fill="#e6edf3"/>

  <rect x="430" y="644" width="340" height="48" rx="12" fill="#21262d" stroke="#6e7681" stroke-width="2"/>
  <text x="600" y="674" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">TaskResult</text>

  <rect x="120" y="728" width="960" height="72" rx="12" fill="#1c2d4a" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="600" y="758" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Orchestration = structure &#160;&#160;&#183;&#160;&#160; Nexus = path &#160;&#160;&#183;&#160;&#160; UER = runtime behavior</text>
  <text x="600" y="784" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#8b949e">UER defines lifecycle, attempts, retry/HITL semantics inside each graph node</text>

  <text x="600" y="868" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#6e7681">Conceptual architecture &#8212; not a runtime class diagram.</text>
</svg>
