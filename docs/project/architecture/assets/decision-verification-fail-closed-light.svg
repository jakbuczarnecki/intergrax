<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img">
  <title>Fail-closed verification</title>
  <desc>Unavailable verifiers and missing provenance fail closed rather than pass silently.</desc>
  <rect width="1200" height="720" fill="#f6f8fb"/>
  <rect x="32" y="28" width="1136" height="664" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#1a1a2e">Fail-Closed Verification</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#3d4f66">Unavailable or unconfigured verifier does not silently pass</text>
  <rect x="200" y="170" width="320" height="56" rx="12" fill="#fff8e1" stroke="#c9a227" stroke-width="2"/>
  <text x="360" y="204" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Required stage unavailable</text>
  <line x1="520" y1="198" x2="600" y2="198" stroke="#1a5fb4" stroke-width="2"/>
  <path d="M600 198 L594 184 L606 184 Z" fill="#1a5fb4"/>
  <rect x="600" y="170" width="400" height="56" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="800" y="204" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Fail closed or explicit UNRESOLVED</text>
  <rect x="200" y="300" width="320" height="56" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="360" y="334" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Unresolvable rubric / provenance</text>
  <line x1="520" y1="328" x2="600" y2="328" stroke="#1a5fb4" stroke-width="2"/>
  <path d="M600 328 L594 314 L606 314 Z" fill="#1a5fb4"/>
  <rect x="600" y="300" width="400" height="56" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="800" y="334" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Challenge — no synthetic pass</text>
  <text x="600" y="450" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">High-assurance profiles require deterministic evidence before probabilistic stages</text>
</svg>
