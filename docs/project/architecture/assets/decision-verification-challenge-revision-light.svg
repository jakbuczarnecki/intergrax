<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img">
  <title>Challenge revision boundary</title>
  <desc>Verification challenges flow to Decision Lifecycle revision creating new versions.</desc>
  <rect width="1200" height="760" fill="#f6f8fb"/>
  <rect x="32" y="28" width="1136" height="704" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#1a1a2e">Challenge → Revision Boundary</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#3d4f66">Verification proposes — Lifecycle revises</text>
  <rect x="140" y="170" width="280" height="56" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="280" y="204" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Verification Result</text>
  <line x1="420" y1="198" x2="500" y2="198" stroke="#1a5fb4" stroke-width="2"/>
  <path d="M500 198 L494 184 L506 184 Z" fill="#1a5fb4"/>
  <rect x="500" y="170" width="220" height="56" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="610" y="204" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Challenge / revision request</text>
  <line x1="720" y1="198" x2="800" y2="198" stroke="#1a5fb4" stroke-width="2"/>
  <path d="M800 198 L794 184 L806 184 Z" fill="#1a5fb4"/>
  <rect x="800" y="170" width="260" height="56" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="930" y="204" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Decision Lifecycle Revision</text>
  <line x1="930" y1="226" x2="930" y2="280" stroke="#1a5fb4" stroke-width="2"/>
  <path d="M930 280 L924 266 L936 266 Z" fill="#1a5fb4"/>
  <rect x="800" y="280" width="260" height="56" rx="12" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="930" y="314" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">New Decision Version</text>
  <text x="600" y="400" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">Bounded revision loop — separate from technical retry</text>
  <text x="600" y="430" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">Verification does NOT mutate candidate versions in place</text>
</svg>
