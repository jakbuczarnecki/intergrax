<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img">
  <title>Application and scenario diagnostic adoption</title>
  <desc>Canonical paths through HarnessHostRuntime and ScenarioRuntimeBaseline versus forbidden local bypasses.</desc>
  <rect width="1200" height="700" fill="#0d1117"/>
  <rect x="24" y="24" width="1152" height="652" rx="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="600" y="58" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#e6edf3">Application + scenario adoption paths</text>
  <rect x="80" y="110" width="420" height="90" rx="12" fill="#1f2937" stroke="#58a6ff" stroke-width="2"/>
  <text x="290" y="145" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Tier-3 Application</text>
  <text x="290" y="175" text-anchor="middle" font-size="14" fill="#8b949e">factory ’ build_harness_host_runtime</text>
  <rect x="700" y="110" width="420" height="90" rx="12" fill="#1f2937" stroke="#58a6ff" stroke-width="2"/>
  <text x="910" y="145" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Scenario application</text>
  <text x="910" y="175" text-anchor="middle" font-size="14" fill="#8b949e">ScenarioRuntimeBaseline facade</text>
  <line x1="290" y1="200" x2="290" y2="260" stroke="#58a6ff" stroke-width="2"/>
  <line x1="910" y1="200" x2="910" y2="260" stroke="#58a6ff" stroke-width="2"/>
  <rect x="140" y="260" width="300" height="70" rx="12" fill="#1a3d2e" stroke="#3fb950" stroke-width="2"/>
  <text x="290" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">Central Diagnostics</text>
  <rect x="720" y="260" width="300" height="70" rx="12" fill="#1a3d2e" stroke="#3fb950" stroke-width="2"/>
  <text x="870" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">Central Diagnostics</text>
  <line x1="290" y1="330" x2="600" y2="400" stroke="#3fb950" stroke-width="2"/>
  <line x1="870" y1="330" x2="600" y2="400" stroke="#3fb950" stroke-width="2"/>
  <rect x="350" y="400" width="500" height="64" rx="12" fill="#3d2a14" stroke="#f0883e" stroke-width="2"/>
  <text x="600" y="438" text-anchor="middle" font-size="17" font-weight="700" fill="#e6edf3">Shared terminal trigger + ProblemPersistence</text>
  <rect x="80" y="500" width="1040" height="140" rx="12" fill="#21262d" stroke="#f85149" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="600" y="535" text-anchor="middle" font-size="16" font-weight="700" fill="#f85149">Forbidden bypass (conformance gates reject)</text>
  <text x="200" y="575" font-size="14" fill="#8b949e">local GraphExecutor</text>
  <text x="480" y="575" font-size="14" fill="#8b949e">local DiagnosticOrchestrator</text>
  <text x="800" y="575" font-size="14" fill="#8b949e">local Problem Store</text>
  <text x="350" y="610" font-size="14" fill="#8b949e">manual NexusLoop() in factory</text>
  <text x="720" y="610" font-size="14" fill="#8b949e">manual terminal RuntimeEvent publisher</text>
</svg>
