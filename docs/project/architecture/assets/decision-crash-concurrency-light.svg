<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img">
  <title>Crash recovery and concurrency</title>
  <desc>Recovery via Nexus infrastructure with finalize guards and budget ceilings.</desc>
  <rect width="1200" height="820" fill="#f6f8fb"/>
  <rect x="32" y="28" width="1136" height="764" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#1a1a2e">Crash Recovery & Concurrency Safety</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#3d4f66">Nexus checkpoint/persistence — no Decision checkpoint engine</text>
  <rect x="120" y="150" width="420" height="56" rx="12" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="330" y="178" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Nexus checkpoint / persistence</text>
  <text x="330" y="198" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">existing infrastructure</text>
  <line x1="330" y1="206" x2="330" y2="240" stroke="#1a5fb4" stroke-width="2"/>
  <path d="M330 240 L324 226 L336 226 Z" fill="#1a5fb4"/>
  <rect x="120" y="240" width="420" height="56" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="330" y="274" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Recover Decision state + version lineage</text>
  <rect x="620" y="150" width="460" height="56" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="850" y="178" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Finalize guard</text>
  <text x="850" y="198" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">one authoritative per scope</text>
  <rect x="620" y="240" width="460" height="56" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="850" y="268" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Budget ceiling</text>
  <text x="850" y="288" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">resume cannot expand granted budget</text>
  <rect x="120" y="360" width="960" height="56" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="600" y="388" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#1a1a2e">Race protection</text>
  <text x="600" y="408" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#3d4f66">no duplicate authoritative decisions from crash/resume</text>
  <text x="600" y="480" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">Resume continues from persisted lifecycle stage — not full deliberation restart</text>
  <text x="600" y="510" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="15" fill="#3d4f66">Technical retry → Nexus Reliability · revision → Decision Lifecycle · deliberation rounds → Strategy</text>
</svg>
