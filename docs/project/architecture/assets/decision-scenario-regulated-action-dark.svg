<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img">
  <title>Regulated action scenario</title>
  <desc>Decision acceptance separate from policy HITL and execution.</desc>
  <rect width="1200" height="700" fill="#0d1117"/>
  <rect x="24" y="24" width="1152" height="652" rx="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="600" y="58" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#e6edf3">Regulated Action — decision then authorization</text>
  <rect x="80" y="140" width="170" height="64" rx="12" fill="#eef4ff" stroke="#1a5fb4" stroke-width="2"/>
  <text x="165" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">candidate decision</text>
  <rect x="280" y="140" width="170" height="64" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="365" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">verification</text>
  <rect x="480" y="140" width="170" height="64" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="565" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">ACCEPTED</text>
  <rect x="680" y="140" width="170" height="64" rx="12" fill="#fff8e1" stroke="#c9a227" stroke-width="2"/>
  <text x="765" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">Policy gate</text>
  <rect x="880" y="140" width="170" height="64" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="965" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">HITL required</text>
  <rect x="280" y="280" width="640" height="64" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="600" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">execution authorization (exact version)</text>
  <rect x="280" y="400" width="640" height="64" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="600" y="438" text-anchor="middle" font-size="16" font-weight="700" fill="#e6edf3">Nexus governed side effect</text>
  <text x="600" y="560" text-anchor="middle" font-size="14" fill="#8b949e">Correct decision may still be blocked until human/policy approval</text>
</svg>
