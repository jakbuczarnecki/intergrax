<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img">
  <title>Intergrax Reasoning and Cognition  three cognition planes</title>
  <desc>Conceptual diagram: Task flows through three cognition planes  Nexus task planning, UAEP agent cognition, and tool cognition  each producing a typed contract before execution.</desc>
  <rect width="1200" height="980" fill="#0d1117"/>
  <rect x="32" y="28" width="1136" height="924" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <text x="600" y="72" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#e6edf3">Reasoning &amp; Cognition &#8212; three planes</text>
  <text x="600" y="102" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#8b949e">Typed decisions before side effects &#8212; not free-text plans</text>

  <rect x="470" y="124" width="260" height="56" rx="12" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
  <text x="600" y="158" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#e6edf3">TASK</text>

  <line x1="600" y1="180" x2="600" y2="204" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 204 L590 210 L610 210 Z" fill="#e6edf3"/>

  <rect x="300" y="208" width="600" height="120" rx="16" fill="#1c2d4a" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="600" y="242" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">PLANE 1 &#8212; Nexus task cognition</text>
  <text x="600" y="278" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" fill="#8b949e">classify + plan &#8212; which agents, order, dependencies?</text>
  <text x="600" y="300" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#6e7681">TaskClassifier &#8594; planner &#8594; validation</text>

  <line x1="600" y1="312" x2="600" y2="336" stroke="#58a6ff" stroke-width="2.5"/>
  <path d="M600 336 L590 350 L610 350 Z" fill="#58a6ff"/>

  <rect x="420" y="340" width="360" height="52" rx="10" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="600" y="372" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#58a6ff">NexusPlan</text>

  <line x1="600" y1="412" x2="600" y2="436" stroke="#e6edf3" stroke-width="2"/>
  <path d="M600 436 L590 450 L610 450 Z" fill="#e6edf3"/>

  <rect x="440" y="440" width="320" height="48" rx="10" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
  <text x="600" y="470" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#e6edf3">Graph node</text>

  <line x1="600" y1="508" x2="600" y2="528" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 528 L590 514 L610 514 Z" fill="#e6edf3"/>

  <rect x="300" y="532" width="600" height="120" rx="16" fill="#1a3324" stroke="#3fb950" stroke-width="2.5"/>
  <text x="600" y="562" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#e6edf3">PLANE 2 &#8212; UAEP step cognition</text>
  <text x="600" y="602" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" fill="#8b949e">agent decisions inside one node</text>
  <text x="600" y="624" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#6e7681">AgentEngine / UAEP &#8594; step loop</text>

  <line x1="600" y1="648" x2="600" y2="672" stroke="#3fb950" stroke-width="2.5"/>
  <path d="M600 672 L590 686 L610 686 Z" fill="#3fb950"/>

  <rect x="400" y="676" width="400" height="52" rx="10" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="600" y="708" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#3fb950">DecisionRecord</text>

  <line x1="600" y1="776" x2="600" y2="800" stroke="#e6edf3" stroke-width="2"/>
  <path d="M600 800 L590 814 L610 814 Z" fill="#e6edf3"/>

  <rect x="460" y="804" width="280" height="44" rx="10" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
  <text x="600" y="832" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Step</text>

  <line x1="600" y1="860" x2="600" y2="876" stroke="#e6edf3" stroke-width="2.5"/>
  <path d="M600 876 L590 862 L610 862 Z" fill="#e6edf3"/>

  <rect x="280" y="880" width="640" height="56" rx="14" fill="#3d2e14" stroke="#d29922" stroke-width="2.5"/>
  <text x="600" y="914" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Reason &#8594; typed contract &#8594; validate &#8594; execute</text>

  <text x="600" y="958" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#6e7681">Conceptual architecture &#8212; Plane 3 (ToolPlanDecision &#8594; ToolRuntime) follows the same pattern inside each step.</text>
</svg>
