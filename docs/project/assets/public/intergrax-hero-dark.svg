<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img">
  <title>Intergrax foundation diagram</title>
  <desc>Specialized application connects through Intergrax reusable foundations to models, tools, and organizational knowledge, with trace, proof receipts, human review, and observability surrounding execution.</desc>
  <defs>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e6edf3"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="#0d1117"/>
  <rect x="40" y="40" width="1520" height="640" rx="24" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <!-- Left card: Specialized application -->
  <rect x="80" y="120" width="380" height="360" rx="20" fill="#1c2d4a" stroke="#58a6ff" stroke-width="2"/>
  <text x="270" y="175" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#e6edf3">Specialized application</text>
  <text x="270" y="220" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="24" fill="#8b949e">LKW product proof</text>
  <rect x="120" y="260" width="300" height="48" rx="8" fill="#0d1117" stroke="#388bfd" stroke-width="1.5"/>
  <text x="270" y="292" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="22" fill="#c9d1d9">User workflow</text>
  <rect x="120" y="330" width="300" height="48" rx="8" fill="#0d1117" stroke="#388bfd" stroke-width="1.5"/>
  <text x="270" y="362" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="22" fill="#c9d1d9">Product environment</text>

  <!-- Center card: Intergrax foundation -->
  <rect x="520" y="80" width="560" height="440" rx="20" fill="#1a2e1a" stroke="#3fb950" stroke-width="3"/>
  <text x="800" y="140" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="32" font-weight="700" fill="#e6edf3">Intergrax</text>
  <text x="640" y="210" font-family="system-ui,Segoe UI,sans-serif" font-size="24" fill="#e6edf3">Policy</text>
  <text x="640" y="260" font-family="system-ui,Segoe UI,sans-serif" font-size="24" fill="#e6edf3">Knowledge</text>
  <text x="640" y="310" font-family="system-ui,Segoe UI,sans-serif" font-size="24" fill="#e6edf3">Evidence</text>
  <text x="640" y="360" font-family="system-ui,Segoe UI,sans-serif" font-size="24" fill="#e6edf3">Integrations</text>
  <text x="640" y="410" font-family="system-ui,Segoe UI,sans-serif" font-size="24" fill="#e6edf3">Execution</text>
  <line x1="720" y1="200" x2="880" y2="200" stroke="#3fb950" stroke-width="2"/>
  <line x1="720" y1="250" x2="880" y2="250" stroke="#3fb950" stroke-width="2"/>
  <line x1="720" y1="300" x2="880" y2="300" stroke="#3fb950" stroke-width="2"/>
  <line x1="720" y1="350" x2="880" y2="350" stroke="#3fb950" stroke-width="2"/>
  <line x1="720" y1="400" x2="880" y2="400" stroke="#3fb950" stroke-width="2"/>

  <!-- Right card: Models, tools, knowledge -->
  <rect x="1140" y="120" width="380" height="360" rx="20" fill="#2d2a1a" stroke="#d29922" stroke-width="2"/>
  <text x="1330" y="190" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#e6edf3">Models</text>
  <text x="1330" y="260" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="24" fill="#8b949e">Tools</text>
  <text x="1330" y="330" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="24" fill="#8b949e">Organizational</text>
  <text x="1330" y="365" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="24" fill="#8b949e">knowledge</text>

  <!-- Arrows left to center -->
  <line x1="460" y1="300" x2="520" y2="300" stroke="#e6edf3" stroke-width="3" marker-end="url(#arrow-dark)"/>
  <!-- Arrows center to right -->
  <line x1="1080" y1="300" x2="1140" y2="300" stroke="#e6edf3" stroke-width="3" marker-end="url(#arrow-dark)"/>

  <!-- Bottom evidence ribbon -->
  <rect x="120" y="560" width="1360" height="80" rx="16" fill="#21262d" stroke="#484f58" stroke-width="2"/>
  <text x="200" y="610" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#e6edf3">Trace</text>
  <text x="420" y="610" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#e6edf3">Proof receipts</text>
  <text x="720" y="610" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#e6edf3">Human review</text>
  <text x="1080" y="610" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#e6edf3">Observability</text>
  <line x1="800" y1="520" x2="800" y2="560" stroke="#484f58" stroke-width="2" stroke-dasharray="6,4"/>
</svg>
