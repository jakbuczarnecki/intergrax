<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 900" role="img">
  <title>Intergrax ecosystem hero</title>
  <desc>Five specialized AI products connect through the shared Intergrax governed foundation toward a future connected ecosystem. Local Knowledge Workspace is Backend Product Alpha; four portfolio directions are selected pre-bootstrap. Platform capability families, cross-cutting control, and an evidence layer sit beneath execution.</desc>
  <defs>
    <linearGradient id="bg-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="platform-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="55%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="fabric-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="evidence-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="soft-shadow-light" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e1b4b" flood-opacity="0.08"/>
    </filter>
    <pattern id="grid-light" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#cbd5e1" stroke-width="0.6" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1720" height="900" fill="url(#bg-light)"/>
  <rect width="1720" height="900" fill="url(#grid-light)" opacity="0.35"/>

