      <tspan x="1536" dy="0">Deployment / Change</tspan>
      <tspan x="1536" dy="16">Guardian</tspan>
    </text>
    <text x="1536" y="162" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" fill="#475569">Safe, authorized production change</text>
    <rect x="1470" y="182" width="132" height="22" rx="11" fill="#cffafe" stroke="#67e8f9" stroke-width="1"/>
    <text x="1536" y="197" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="10" font-weight="600" fill="#155e75">SELECTED</text>
  </g>

