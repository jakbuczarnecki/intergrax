    <rect x="210" y="332" width="1300" height="286" rx="28" fill="url(#fabric-light)"/>
    <path d="M260 420 H1460" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <path d="M260 520 H1460" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <path d="M430 360 V590" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
