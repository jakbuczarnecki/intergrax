    <circle cx="860" cy="500" r="5" fill="#bfdbfe"/>
    <circle cx="1160" cy="500" r="5" fill="#bfdbfe"/>
    <circle cx="1400" cy="500" r="5" fill="#bfdbfe"/>
    <circle cx="720" cy="530" r="5" fill="#c4b5fd"/>
    <path d="M320 500 L560 500 L720 530 L860 500 L1160 500 L1400 500" fill="none" stroke="#c7d2fe" stroke-width="1" opacity="0.6"/>
