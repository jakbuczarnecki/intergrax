      <circle cx="44" cy="10" r="8" fill="none" stroke="#6366f1" stroke-width="1.4"/>
      <circle cx="44" cy="28" r="8" fill="none" stroke="#6366f1" stroke-width="1.4"/>
      <path d="M28 18 L36 18 M36 10 L36 28" stroke="#6366f1" stroke-width="1.4"/>
