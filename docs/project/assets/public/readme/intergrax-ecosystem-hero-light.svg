  <path d="M340 118 Q860 18 1380 118" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="7 6" opacity="0.75"/>
  <text x="860" y="28" text-anchor="middle" font-family="Segoe UI,system-ui,sans-serif" font-size="11" letter-spacing="1.4" fill="#64748b">ECOSYSTEM DIRECTION</text>

