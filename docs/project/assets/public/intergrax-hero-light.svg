<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img">
  <title>Intergrax foundation diagram</title>
  <desc>Specialized application connects through Intergrax reusable foundations to models, tools, and organizational knowledge, with trace, proof receipts, human review, and observability surrounding execution.</desc>
  <defs>
    <marker id="arrow-light" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a1a2e"/>
    </marker>
  </defs>
  <rect width="1600" height="720" fill="#f6f8fb"/>
  <rect x="40" y="40" width="1520" height="640" rx="24" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <!-- Left card: Specialized application -->
  <rect x="80" y="120" width="380" height="360" rx="20" fill="#eef4ff" stroke="#4a6fa5" stroke-width="2"/>
  <text x="270" y="175" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#1a1a2e">Specialized application</text>
  <text x="270" y="220" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="24" fill="#3d4f66">LKW product proof</text>
  <rect x="120" y="260" width="300" height="48" rx="8" fill="#ffffff" stroke="#b8c9e0" stroke-width="1.5"/>
  <text x="270" y="292" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="22" fill="#3d4f66">User workflow</text>
  <rect x="120" y="330" width="300" height="48" rx="8" fill="#ffffff" stroke="#b8c9e0" stroke-width="1.5"/>
  <text x="270" y="362" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="22" fill="#3d4f66">Product environment</text>

  <!-- Center card: Intergrax foundation -->
  <rect x="520" y="80" width="560" height="440" rx="20" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="800" y="140" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="32" font-weight="700" fill="#1a1a2e">Intergrax</text>
  <text x="640" y="210" font-family="system-ui,Segoe UI,sans-serif" font-size="24" fill="#1a1a2e">Policy</text>
  <text x="640" y="260" font-family="system-ui,Segoe UI,sans-serif" font-size="24" fill="#1a1a2e">Knowledge</text>
  <text x="640" y="310" font-family="system-ui,Segoe UI,sans-serif" font-size="24" fill="#1a1a2e">Evidence</text>
  <text x="640" y="360" font-family="system-ui,Segoe UI,sans-serif" font-size="24" fill="#1a1a2e">Integrations</text>
  <text x="640" y="410" font-family="system-ui,Segoe UI,sans-serif" font-size="24" fill="#1a1a2e">Execution</text>
  <line x1="720" y1="200" x2="880" y2="200" stroke="#2e7d32" stroke-width="2"/>
  <line x1="720" y1="250" x2="880" y2="250" stroke="#2e7d32" stroke-width="2"/>
  <line x1="720" y1="300" x2="880" y2="300" stroke="#2e7d32" stroke-width="2"/>
  <line x1="720" y1="350" x2="880" y2="350" stroke="#2e7d32" stroke-width="2"/>
  <line x1="720" y1="400" x2="880" y2="400" stroke="#2e7d32" stroke-width="2"/>

  <!-- Right card: Models, tools, knowledge -->
  <rect x="1140" y="120" width="380" height="360" rx="20" fill="#fff8e1" stroke="#c9a227" stroke-width="2"/>
  <text x="1330" y="190" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#1a1a2e">Models</text>
  <text x="1330" y="260" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="24" fill="#3d4f66">Tools</text>
  <text x="1330" y="330" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="24" fill="#3d4f66">Organizational</text>
  <text x="1330" y="365" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="24" fill="#3d4f66">knowledge</text>

  <!-- Arrows left to center -->
  <line x1="460" y1="300" x2="520" y2="300" stroke="#1a1a2e" stroke-width="3" marker-end="url(#arrow-light)"/>
  <!-- Arrows center to right -->
  <line x1="1080" y1="300" x2="1140" y2="300" stroke="#1a1a2e" stroke-width="3" marker-end="url(#arrow-light)"/>

  <!-- Bottom evidence ribbon -->
  <rect x="120" y="560" width="1360" height="80" rx="16" fill="#f0f4f8" stroke="#8899aa" stroke-width="2"/>
  <text x="200" y="610" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#1a1a2e">Trace</text>
  <text x="420" y="610" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#1a1a2e">Proof receipts</text>
  <text x="720" y="610" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#1a1a2e">Human review</text>
  <text x="1080" y="610" font-family="system-ui,Segoe UI,sans-serif" font-size="24" font-weight="600" fill="#1a1a2e">Observability</text>
  <line x1="800" y1="520" x2="800" y2="560" stroke="#8899aa" stroke-width="2" stroke-dasharray="6,4"/>
</svg>
