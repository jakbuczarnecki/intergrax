# Optional Elasticsearch/OpenSearch-compatible observability backend overlay for LKW.
# Run from repository root:
# docker compose \
#   -f applications/local_workspace_application/docker/docker-compose.yml \
#   -f applications/local_workspace_application/docker/docker-compose.elasticsearch.yml \
#   up --build

services:
  local_workspace:
    environment:
      LOCAL_WORKSPACE_OBSERVABILITY_EXPORT_ENABLED: "true"
      LOCAL_WORKSPACE_OBSERVABILITY_EXPORT_BACKEND: elasticsearch
      LOCAL_WORKSPACE_OBSERVABILITY_ELASTICSEARCH_URL: http://elasticsearch:9200
      LOCAL_WORKSPACE_OBSERVABILITY_ELASTICSEARCH_INDEX: intergrax-lkw-observability
      LOCAL_WORKSPACE_OBSERVABILITY_ELASTICSEARCH_TIMEOUT_SECONDS: "30"
      LOCAL_WORKSPACE_OBSERVABILITY_EXPORT_CONTENT: "false"
    depends_on:
      - qdrant
      - ollama
      - otel-collector
      - elasticsearch

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_HOST: "0.0.0.0"
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

volumes:
  elasticsearch_data:
