# LKW Linux Docker runtime certification Compose project (PROOF-PORTABILITY-1D).
#
# From repository root:
#   docker compose -f applications/local_workspace_application/docker/linux-certification.compose.yml \
#     -p lkw-linux-certification up --build
#
# MongoDB is an external sidecar from the proof container's perspective.
# Nested Docker orchestration is prohibited for this certification project.

name: lkw-linux-certification

services:
  lkw-linux-certification-mongodb:
    image: mongo:7.0.14
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${LKW_MONGODB_ROOT_USERNAME:-intergrax}
      MONGO_INITDB_ROOT_PASSWORD: ${LKW_MONGODB_ROOT_PASSWORD:-intergrax-local-dev-only}
      MONGO_INITDB_DATABASE: ${LKW_MONGODB_DATABASE:-intergrax_proofs}
    expose:
      - "27017"
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--username",
          "${LKW_MONGODB_ROOT_USERNAME:-intergrax}",
          "--password",
          "${LKW_MONGODB_ROOT_PASSWORD:-intergrax-local-dev-only}",
          "--authenticationDatabase",
          "admin",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: "no"

  lkw-linux-certification-mongo-express:
    image: mongo-express:1.0.2-20
    profiles: ["reviewer"]
    ports:
      - "${LKW_CERT_MONGO_EXPRESS_PORT:-18086}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${LKW_MONGODB_ROOT_USERNAME:-intergrax}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${LKW_MONGODB_ROOT_PASSWORD:-intergrax-local-dev-only}
      ME_CONFIG_MONGODB_URL: mongodb://${LKW_MONGODB_ROOT_USERNAME:-intergrax}:${LKW_MONGODB_ROOT_PASSWORD:-intergrax-local-dev-only}@lkw-linux-certification-mongodb:27017/?authSource=admin
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      lkw-linux-certification-mongodb:
        condition: service_healthy
    restart: "no"

  lkw-linux-certification:
    build:
      context: ../../..
      dockerfile: applications/local_workspace_application/docker/Dockerfile.linux-certification
    image: intergrax-lkw-linux-certification:local
    depends_on:
      lkw-linux-certification-mongodb:
        condition: service_healthy
    environment:
      INTERGRAX_MONGODB_URI: mongodb://${LKW_MONGODB_ROOT_USERNAME:-intergrax}:${LKW_MONGODB_ROOT_PASSWORD:-intergrax-local-dev-only}@lkw-linux-certification-mongodb:27017/${LKW_MONGODB_DATABASE:-intergrax_proofs}?authSource=admin
      INTERGRAX_MONGODB_DATABASE: ${LKW_MONGODB_DATABASE:-intergrax_proofs}
      INTERGRAX_MONGODB_COLLECTION: ${LKW_MONGODB_COLLECTION:-proof_receipts}
      LKW_EXECUTION_ENVIRONMENT: container
      LKW_CONTAINER_RUNTIME: docker
      LKW_CERTIFICATION_PROFILE: linux_docker_runtime
      LKW_CERTIFICATION_SOURCE_COMMIT: ${LKW_CERTIFICATION_SOURCE_COMMIT:-}
      PYTHONUNBUFFERED: "1"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    working_dir: /app
    # No privileged mode. No nested Compose.
    restart: "no"
