# Prepare minimal context, then compose:
#   uv run python scripts/build/build_application_image.py --application local_workspace_application \
#     --context-dir applications/local_workspace_application/docker/runtime-context --keep-context --manifest-only
#   uv run python scripts/build/build_application_image.py --application local_workspace_application \
#     --tag local_workspace-application:latest --context-dir applications/local_workspace_application/docker/runtime-context --keep-context
# Or: docker compose -f applications/local_workspace_application/docker/docker-compose.yml up --build
# (requires runtime-context/ already materialized; same isolation contract as CLI).

name: intergrax_local_workspace

services:
  local_workspace:
    build:
      context: ./runtime-context
      dockerfile: Dockerfile
    image: local_workspace-application:latest
    ports:
      - "8020:8020"
    env_file:
      - ../.env
    environment:
      INTERGRAX_ENV: dev
      LOCAL_WORKSPACE_BACKEND_ENV: dev
      LOCAL_WORKSPACE_BACKEND_HOST: "0.0.0.0"
      LOCAL_WORKSPACE_BACKEND_PORT: "8020"
      LOCAL_WORKSPACE_INCLUDE_MCP: "false"
