# Local Sentry proof services for LKW (trimmed self-hosted 24.8.0 stack).
# Included by docker-compose.sentry.yml — not intended for standalone use.
# Internal fragment: does NOT match docker-compose.*.yml (see run-local-docker-all.*).

x-sentry-image: &sentry_image
  image: getsentry/sentry:24.8.0
  environment: &sentry_env
    SENTRY_CONF: /etc/sentry
    # Local proof only — unsafe for production; do not reuse outside this stack.
    SENTRY_SECRET_KEY: ${INTERGRAX_LOCAL_SENTRY_SECRET_KEY:-intergrax-local-sentry-proof-secret-key-not-for-production}
    SNUBA: http://sentry-snuba-api:1218
    DEFAULT_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
  volumes:
    - ./sentry:/etc/sentry
    - sentry_data:/data

x-snuba-image: &snuba_image
  image: getsentry/snuba:24.8.0
  environment: &snuba_env
    SNUBA_SETTINGS: self_hosted
    CLICKHOUSE_HOST: sentry-clickhouse
    DEFAULT_BROKERS: sentry-kafka:9092
    REDIS_HOST: sentry-redis
    UWSGI_MAX_REQUESTS: "10000"
    UWSGI_DISABLE_LOGGING: "true"

services:
  sentry-postgres:
    image: postgres:14.11
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - sentry_postgres:/var/lib/postgresql/data

  sentry-redis:
    image: redis:6.2.14-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - sentry_redis:/data

  sentry-memcached:
    image: memcached:1.6.26-alpine
    command: ["-I", "1M"]

  sentry-kafka:
    image: confluentinc/cp-kafka:7.6.1
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1001@127.0.0.1:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_NODE_ID: "1001"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:29092,INTERNAL://sentry-kafka:9093,EXTERNAL://sentry-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "1"
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_MESSAGE_MAX_BYTES: "50000000"
      KAFKA_MAX_REQUEST_SIZE: "50000000"
      CONFLUENT_SUPPORT_METRICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 10s
      retries: 30
    volumes:
      - sentry_kafka:/var/lib/kafka/data

  sentry-kafka-topics:
    image: confluentinc/cp-kafka:7.6.1
    command: >
      bash -lc '
        kafka-topics --bootstrap-server sentry-kafka:9092 --create --if-not-exists --topic ingest-events --partitions 1 --replication-factor 1
      '
    depends_on:
      sentry-kafka:
        condition: service_healthy
    restart: "no"

  sentry-clickhouse:
    image: altinity/clickhouse-server:23.8.11.29.altinitystable
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - sentry_clickhouse:/var/lib/clickhouse
      - ./sentry/clickhouse/config.xml:/etc/clickhouse-server/config.d/sentry.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -nv -t1 --spider http://localhost:8123/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  sentry-snuba-bootstrap:
    <<: *snuba_image
    command: bootstrap --force
    depends_on:
      sentry-clickhouse:
        condition: service_healthy
      sentry-kafka:
        condition: service_healthy
      sentry-redis:
        condition: service_healthy
    restart: "no"

  sentry-snuba-api:
    <<: *snuba_image
    depends_on:
      sentry-snuba-bootstrap:
        condition: service_completed_successfully
      sentry-clickhouse:
        condition: service_healthy
      sentry-kafka:
        condition: service_healthy
      sentry-redis:
        condition: service_healthy

  sentry-snuba-errors-consumer:
    <<: *snuba_image
    command: rust-consumer --storage errors --consumer-group snuba-consumers --auto-offset-reset=latest --max-batch-time-ms 750 --no-strict-offset-reset
    depends_on:
      - sentry-snuba-api

  sentry-snuba-replacer:
    <<: *snuba_image
    command: replacer --storage errors --auto-offset-reset=latest --no-strict-offset-reset
    depends_on:
      - sentry-snuba-api

  sentry-snuba-outcomes-consumer:
    <<: *snuba_image
    command: rust-consumer --storage outcomes_raw --consumer-group snuba-consumers --auto-offset-reset=earliest --max-batch-time-ms 750 --no-strict-offset-reset
    depends_on:
      - sentry-snuba-api

  sentry-snuba-subscription-consumer-events:
    <<: *snuba_image
    command: subscriptions-scheduler-executor --dataset events --entity events --auto-offset-reset=latest --no-strict-offset-reset --consumer-group=snuba-events-subscriptions-consumers --followed-consumer-group=snuba-consumers --schedule-ttl=60 --stale-threshold-seconds=900
    depends_on:
      - sentry-snuba-api

  sentry-symbolicator:
    image: getsentry/symbolicator:24.8.0
    command: run -c /etc/symbolicator/config.yml
    volumes:
      - sentry_symbolicator:/data
      - ./sentry/symbolicator/config.yml:/etc/symbolicator/config.yml:ro

  sentry-smtp:
    image: tianon/exim4
    platform: linux/amd64

  sentry-upgrade:
    <<: *sentry_image
    command: upgrade --noinput
    depends_on:
      sentry-postgres:
        condition: service_healthy
      sentry-redis:
        condition: service_healthy
      sentry-kafka:
        condition: service_healthy
      sentry-clickhouse:
        condition: service_healthy
      sentry-snuba-api:
        condition: service_started
    restart: "no"

  sentry-web:
    <<: *sentry_image
    command: run web
    depends_on:
      sentry-upgrade:
        condition: service_completed_successfully
      sentry-postgres:
        condition: service_healthy
      sentry-redis:
        condition: service_healthy
      sentry-kafka:
        condition: service_healthy
      sentry-memcached:
        condition: service_started
      sentry-snuba-api:
        condition: service_started
      sentry-symbolicator:
        condition: service_started
      sentry-smtp:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "/bin/bash",
          "-c",
          'exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e "GET /_health/ HTTP/1.1\r\nhost: 127.0.0.1\r\n\r\n" >&3 && grep ok -s -m 1 <&3',
        ]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s

  sentry-worker:
    <<: *sentry_image
    command: run worker
    depends_on:
      sentry-web:
        condition: service_healthy

  sentry-cron:
    <<: *sentry_image
    command: run cron
    depends_on:
      sentry-web:
        condition: service_healthy

  sentry-events-consumer:
    <<: *sentry_image
    command: run consumer ingest-events --consumer-group ingest-consumer
    depends_on:
      sentry-web:
        condition: service_healthy
      sentry-kafka-topics:
        condition: service_completed_successfully
    restart: on-failure

  sentry-post-process-forwarder-errors:
    <<: *sentry_image
    command: run consumer --no-strict-offset-reset post-process-forwarder-errors --consumer-group post-process-forwarder --synchronize-commit-log-topic=snuba-commit-log --synchronize-commit-group=snuba-consumers
    depends_on:
      sentry-web:
        condition: service_healthy

  sentry-subscription-consumer-events:
    <<: *sentry_image
    command: run consumer events-subscription-results --consumer-group query-subscription-consumer
    depends_on:
      sentry-web:
        condition: service_healthy

  sentry-relay:
    image: getsentry/relay:24.8.0
    command: run -c /work/.relay
    volumes:
      - ./sentry/relay:/work/.relay:ro
    depends_on:
      sentry-kafka:
        condition: service_healthy
      sentry-redis:
        condition: service_healthy
      sentry-web:
        condition: service_healthy

  sentry-nginx:
    image: nginx:1.25.4-alpine
    ports:
      - "9000:80"
    volumes:
      - ./sentry/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - sentry-web
      - sentry-relay

  sentry-bootstrap:
    <<: *sentry_image
    entrypoint: ["/bin/bash", "/etc/sentry/bootstrap/bootstrap.sh"]
    volumes:
      - ./sentry:/etc/sentry
      - ./sentry-proof:/proof
    depends_on:
      sentry-web:
        condition: service_healthy
    restart: "no"

volumes:
  sentry_data:
  sentry_postgres:
  sentry_redis:
  sentry_kafka:
  sentry_clickhouse:
  sentry_symbolicator:
