# Optional Kafka + Redis background-task platform proof overlay for LKW (LKW.4E).
# Run from repository root:
# docker compose \
#   -f applications/local_workspace_application/docker/docker-compose.yml \
#   -f applications/local_workspace_application/docker/docker-compose.kafka.yml \
#   up --build

services:
  local_workspace:
    environment:
      INTERGRAX_ALLOWED_READ_ROOTS: /data/user_docs
      INTERGRAX_RAG_CHUNKING_STRATEGY: recursive
      LOCAL_WORKSPACE_ENABLE_MESSAGE_BUS: "true"
      LOCAL_WORKSPACE_ENABLE_KAFKA_MESSAGE_BUS: "true"
      LOCAL_WORKSPACE_ENABLE_REDIS: "true"
      INTERGRAX_REDIS_URL: redis://lkw-redis:6379/0
      INTERGRAX_KAFKA_BOOTSTRAP_SERVERS: lkw-kafka:9092
      INTERGRAX_KAFKA_TOPIC: intergrax.tasks
      INTERGRAX_KAFKA_EVENTS_TOPIC: intergrax.task-events
      INTERGRAX_KAFKA_STATUS_TOPIC: intergrax.task-status
      INTERGRAX_KAFKA_RESULTS_TOPIC: intergrax.task-results
      INTERGRAX_KAFKA_CONSUMER_GROUP: lkw-background-ingest
    volumes:
      - lkw_sqlite:/data/sqlite
      - lkw_shadow:/data/shadow_workspaces
      - ../.proof_docs:/data/user_docs:rw
    depends_on:
      - qdrant
      - ollama
      - otel-collector
      - lkw-redis
      - lkw-kafka
      - lkw-kafka-topics
      - lkw-background-worker

  lkw-background-worker:
    build:
      context: ./runtime-context
      dockerfile: Dockerfile
    image: local_workspace-application:latest
    command:
      [
        "python",
        "-m",
        "local_workspace_application.host.background_worker_main",
      ]
    env_file:
      - ../.env
    environment:
      INTERGRAX_ENV: dev
      LOCAL_WORKSPACE_BACKEND_ENV: dev
      LOCAL_WORKSPACE_ENABLE_MESSAGE_BUS: "true"
      LOCAL_WORKSPACE_ENABLE_KAFKA_MESSAGE_BUS: "true"
      LOCAL_WORKSPACE_ENABLE_REDIS: "true"
      INTERGRAX_RAG_CHUNKING_STRATEGY: recursive
      LOCAL_WORKSPACE_VECTOR_STORE: qdrant
      INTERGRAX_QDRANT_URL: http://qdrant:6333
      INTERGRAX_QDRANT_COLLECTION: local_workspace
      INTERGRAX_SQLITE_DATA_DIR: /data/sqlite
      INTERGRAX_SHADOW_ROOT: /data/shadow_workspaces
      INTERGRAX_ALLOWED_READ_ROOTS: /data/user_docs
      INTERGRAX_LLM_PROVIDER: ollama
      INTERGRAX_LLM_MODEL: llama3.1:latest
      INTERGRAX_DEFAULT_OLLAMA_MODEL: llama3.1:latest
      OLLAMA_HOST: http://ollama:11434
      INTERGRAX_REDIS_URL: redis://lkw-redis:6379/0
      INTERGRAX_KAFKA_BOOTSTRAP_SERVERS: lkw-kafka:9092
      INTERGRAX_KAFKA_TOPIC: intergrax.tasks
      INTERGRAX_KAFKA_EVENTS_TOPIC: intergrax.task-events
      INTERGRAX_KAFKA_STATUS_TOPIC: intergrax.task-status
      INTERGRAX_KAFKA_RESULTS_TOPIC: intergrax.task-results
      INTERGRAX_KAFKA_CONSUMER_GROUP: lkw-background-ingest
    volumes:
      - lkw_sqlite:/data/sqlite
      - lkw_shadow:/data/shadow_workspaces
      - ../.proof_docs:/data/user_docs:rw
    depends_on:
      - qdrant
      - ollama
      - lkw-redis
      - lkw-kafka
      - lkw-kafka-topics

  lkw-redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - lkw_redis_data:/data

  lkw-kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://lkw-kafka:9092,PLAINTEXT_HOST://127.0.0.1:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@lkw-kafka:9093
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - lkw_kafka_data:/var/lib/kafka/data

  lkw-kafka-topics:
    image: apache/kafka:3.7.0
    depends_on:
      - lkw-kafka
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in intergrax.tasks intergrax.task-events intergrax.task-status intergrax.task-results; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server lkw-kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done
    restart: "no"

  lkw-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: intergrax-lkw
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: lkw-kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - lkw-kafka
      - lkw-kafka-topics

volumes:
  lkw_sqlite:
  lkw_shadow:
  lkw_redis_data:
  lkw_kafka_data:
