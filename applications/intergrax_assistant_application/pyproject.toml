# Tier-3 application dependency project (workspace member).
# Application source remains importable via PYTHONPATH=applications/.
# Canonical platform doc: docs/project/architecture/APPLICATION_DEPENDENCY_MODEL.md

[project]
name = "intergrax-assistant-application"
version = "0.1.0"
description = "Intergrax assistant Tier-3 application"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Intergrax-ai",
  "intergrax-echo-agent",
  "intergrax-assistant-agent",
  "intergrax-legal-agent",
  "intergrax-research-agent",
]

[tool.uv]
package = false

[tool.uv.sources]
Intergrax-ai = { workspace = true }
intergrax-echo-agent = { workspace = true }
intergrax-assistant-agent = { workspace = true }
intergrax-legal-agent = { workspace = true }
intergrax-research-agent = { workspace = true }
