# Prepare minimal context, then compose:
#   uv run python scripts/build/build_application_image.py --application governed_contractor_application \
#     --context-dir applications/governed_contractor_application/docker/runtime-context --keep-context --manifest-only
#   uv run python scripts/build/build_application_image.py --application governed_contractor_application \
#     --tag governed_contractor-application:latest --context-dir applications/governed_contractor_application/docker/runtime-context --keep-context
# Or: docker compose -f applications/governed_contractor_application/docker/docker-compose.yml up --build
# (requires runtime-context/ already materialized; same isolation contract as CLI).

name: intergrax_governed_contractor

services:
  governed_contractor:
    build:
      context: ./runtime-context
      dockerfile: Dockerfile
    image: governed_contractor-application:latest
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      INTERGRAX_ENV: dev
      GOVERNED_CONTRACTOR_BACKEND_ENV: dev
      GOVERNED_CONTRACTOR_BACKEND_HOST: "0.0.0.0"
      GOVERNED_CONTRACTOR_BACKEND_PORT: "8000"
      GOVERNED_CONTRACTOR_INCLUDE_MCP: "false"
