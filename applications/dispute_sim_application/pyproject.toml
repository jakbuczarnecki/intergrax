# Tier-3 application dependency project (workspace member).
# Application source remains importable via PYTHONPATH=applications/.
# Canonical platform doc: docs/architecture/APPLICATION_DEPENDENCY_MODEL.md

[project]
name = "intergrax-dispute-sim-application"
version = "0.1.0"
description = "Dispute simulation Tier-3 application"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Intergrax-ai",
  "intergrax-dispute-analyst-agent",
  "intergrax-dispute-intake-agent",
  "intergrax-dispute-scenario-agent",
  "intergrax-dispute-strategist-agent",
]

[tool.uv]
package = false

[tool.uv.sources]
Intergrax-ai = { workspace = true }
intergrax-dispute-analyst-agent = { workspace = true }
intergrax-dispute-intake-agent = { workspace = true }
intergrax-dispute-scenario-agent = { workspace = true }
intergrax-dispute-strategist-agent = { workspace = true }
