# Tier-3 application dependency project (workspace member).
# Application source remains importable via PYTHONPATH=applications/.
# Canonical platform doc: docs/project/architecture/APPLICATION_DEPENDENCY_MODEL.md

[project]
name = "intergrax-lab-application"
version = "0.1.0"
description = "Lab / reference Tier-3 application"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Intergrax-ai",
  "intergrax-echo-agent",
  "intergrax-lab-agent",
  "intergrax-problem-radar-agent",
  "intergrax-research-agent",
  "intergrax-signoff-probe-agent",
]

[tool.uv]
package = false

[tool.uv.sources]
Intergrax-ai = { workspace = true }
intergrax-echo-agent = { workspace = true }
intergrax-lab-agent = { workspace = true }
intergrax-problem-radar-agent = { workspace = true }
intergrax-research-agent = { workspace = true }
intergrax-signoff-probe-agent = { workspace = true }
