# vLLM OpenAI-compatible inference server (production self-hosted LLM).
# Requires NVIDIA GPU + nvidia-container-toolkit. For CPU-only dev use Ollama (infra/docker/ollama).
# Host port 8100 avoids conflict with Chroma (8000) in the rag profile.
# Wire Intergrax: INTERGRAX_DEFAULT_VLLM_BASE_URL=http://127.0.0.1:8100/v1

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: intergrax-vllm
    ports:
      - "8100:8000"
    volumes:
      - vllm_cache:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      # WSL2: v1 engine can fail to start; v0 is more reliable for local dev.
      VLLM_USE_V1: ${VLLM_USE_V1:-0}
    shm_size: "2gb"
    command:
      - ${VLLM_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --enforce-eager
      - --gpu-memory-utilization
      - "0.85"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  vllm_cache:
