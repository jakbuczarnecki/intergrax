# vLLM OpenAI-compatible inference server (production self-hosted LLM).
# Requires NVIDIA GPU + nvidia-container-toolkit. For CPU-only dev use Ollama (infra/docker/ollama).
# Host port 8100 avoids conflict with Chroma (8000) in the rag profile.
# Wire Intergrax: INTERGRAX_DEFAULT_VLLM_BASE_URL=http://127.0.0.1:8100/v1
#
# TOKEN-10C canonical proof uses vLLM v0.23.0 V1 metrics/cache path with automatic prefix caching.
# Do not force VLLM_USE_V1=0 for prefix-cache proof; the legacy V0 workaround is obsolete for v0.23.0.

services:
  vllm:
    image: vllm/vllm-openai:v0.23.0
    container_name: intergrax-vllm
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - vllm_cache:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    shm_size: "2gb"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    command:
      - ${VLLM_MODEL:-Qwen/Qwen2.5-3B-Instruct}
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --enable-prefix-caching
      - --prefix-caching-hash-algo
      - sha256
      - --enable-prompt-tokens-details
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
      - --gpu-memory-utilization
      - "0.85"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  vllm_cache:
