version: "3.9"

services:
  postgresql:
    image: postgres:16.6
    container_name: intergrax-postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: intergrax
      POSTGRES_PASSWORD: intergrax
      POSTGRES_DB: intergrax
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intergrax -d intergrax"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgresql_data:
