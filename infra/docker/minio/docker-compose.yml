services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: intergrax-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: intergrax
      MINIO_ROOT_PASSWORD: intergrax
    command: server /data --console-address ":9001"
    restart: unless-stopped
