services:

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: intergrax-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: intergrax
      RABBITMQ_DEFAULT_PASS: intergrax
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data: