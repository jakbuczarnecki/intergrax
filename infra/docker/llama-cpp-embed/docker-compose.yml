# llama.cpp OpenAI-compatible embedding server.
# Separate from chat llama.cpp - exposes /v1/embeddings when started with --embeddings.
# Host port 8103; wire RAG: INTERGRAX_DEFAULT_LLAMA_CPP_EMBED_BASE_URL=http://127.0.0.1:8103/v1

services:
  llama-cpp-embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: intergrax-llama-cpp-embed
    ports:
      - "8103:8080"
    volumes:
      - llama_cpp_embed_cache:/root/.cache
    environment:
      HF_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --embeddings
      - -hf
      - ${LLAMA_CPP_EMBED_HF_REPO:-nomic-ai/nomic-embed-text-v1.5-GGUF}
      - -hff
      - ${LLAMA_CPP_EMBED_HF_FILE:-nomic-embed-text-v1.5.Q4_K_M.gguf}
      - -np
      - "2"
    restart: unless-stopped

volumes:
  llama_cpp_embed_cache:
